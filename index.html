d repeating them. What if we receive counsel from congregation elders, even on a seemingly minor matter? We should not feel rejected by Jehovah or by the elders. Even the good kings of Israel were not above receiving counsel and reproof. (Heb. 12:6) When we receive correction, we should (1) respond humbly, (2) make the necessary changes, and (3) move on with our wholehearted service to Jehovah. If we repent of our sins, Jehovah will forgive us.—2 Cor. 7:9, 11. w24.07 21 ˚8; 22 ˚9, 11"},"2026-09-28":{"date":"2026-09-28","label":"Monday, September 28, 2026","scripture":"Remove the wicked person from among yourselves.","ref":"—1 Cor. 5:13.","comment":"A wrongdoer is removed from the congregation when he does not respond to repeated attempts by the elders to lead him to repentance. (2 Ki. 17:12-15) His actions show that he has chosen not to abide by Jehovah’s standards. (Deut. 30:19, 20) An announcement is made to inform the congregation that he is no longer one of Jehovah’s Witnesses. The purpose of that announcement is not to humiliate the wrongdoer. Rather, it is made so that the congregation can follow the Scriptural admonition to “stop keeping company” with that person, “not even eating with” him. (1 Cor. 5: 9-11) That direction is given for good reason. The apostle Paul wrote: “A little leaven ferments the whole batch of dough.” (1 Cor. 5:6) Unrepentant wrongdoers can weaken the determination of those who are trying to live by Jehovah’s righteous standards. —Prov. 13:20; 1 Cor. 15:33. w24.08 27 ˚3-4"},"2026-09-29":{"date":"2026-09-29","label":"Tuesday, September 29, 2026","scripture":"For all things I have the strength through the one who gives me power.","ref":"—Phil. 4:13.","comment":"We cannot literally impart strength, or energy, to others. But we can use our power in their behalf. For example, we might run errands or do household chores for an elderly or infirm Christian. Or we could volunteer to help with the cleaning and the maintenance of the Kingdom Hall. Do not forget, too, that words have power. Can you think of someone who"},"2026-09-30":{"date":"2026-09-30","label":"Wednesday, September 30, 2026","scripture":"If a man is reaching out to be an overseer, he is desirous of a fine work.","ref":"—1 Tim. 3:1.","comment":"If you have been serving for a time as a ministerial servant, you may be well on your way to qualifying to serve as an elder. Can you reach out for that “fine work”? What does the work of an elder involve? He takes the lead in preaching, works hard in shepherding and teaching, and builds up the congregation by word and example. For good reason, the Bible calls hardworking elders “gifts in men.” (Eph. 4:8) How can you qualify to serve as an elder? Qualifying as an elder is not the same as qualifying for a secular job. Often in the secular world, if you have the basic work skills that an employer is looking for, you can get the job. By contrast, if you wish to be appointed as an elder, you need more than preaching and teaching skills. You need to meet the Scriptural qualifications for elders listed at 1 Timothy 3: 1-7 and Titus 1:5-9. w24.11 20 ˚1-3"},"2026-10-01":{"date":"2026-10-01","label":"Thursday, October 1, 2026","scripture":"I will keep on the lookout for Jehovah.","ref":"—Mic. 7:7.","comment":"We often receive theocratic direction—from our local elders, the circuit overseer, the branch office, or the Governing Body—that guides us in our worship. But what if on occasion we cannot understand the reason for the direction we receive? We may see only the negative effects that the direction could have on us. We may even begin to focus on the imperfections of the brothers who gave the direction. When we walk by faith, we trust that Jehovah is in control and that he knows our circumstances. As a result, we are quick to obey, and we do so with a positive attitude. (Heb. 13:17) We recognize that our obedience contributes to the unity of our congregation. (Eph. 4:2, 3) We trust that even though the brothers taking the lead are imperfect, Jehovah will bless our obedience. (1 Sam. 15:22) In due time, he will correct anything that truly needs to be corrected. w25.03 23-24 ˚13-14"},"2026-10-02":{"date":"2026-10-02","label":"Friday, October 2, 2026","scripture":"God . . . is a Revealer of secrets.","ref":"—Dan. 2:28.","comment":"We are living in exciting times! Each day, Bible prophecy is being fulfilled before our eyes. For example, we see “the king of the north” and “the king of the south” engaged in a struggle for world dominance. (Dan. 11:40, ftn.) We see the good news of God’s Kingdom being preached on an unprecedented scale, with millions responding favorably. (Isa. 60:22; Matt. 24:14) And we are receiving an abundance"},"2026-10-03":{"date":"2026-10-03","label":"Saturday, October 3, 2026","scripture":"He does not slander with his tongue.","ref":"—Ps. 15:3.","comment":"The psalmist specifically mentions slander. What is slander? Generally, it is a false statement that can ruin someone’s reputation. Psalm 15:3 also reminds us that Jehovah’s guests do nothing bad to their neighbors and do not defame their friends. (Ps. 15:1) What might that involve? We could unintentionally defame someone by spreading negative information. For example: (1) a sister discontinues her full-time service, (2) a married couple no longer serve at Bethel, or (3) a brother is no longer serving as an elder or a ministerial servant. Would it be proper to speculate on the reasons why these adjustments were made and to share that opinion with others? There may well be reasons for the change that we are unaware of. Furthermore, a guest in Jehovah’s tent “does nothing bad to his neighbor, and he does not defame his friends.” w24.06 11 ˚11-13"},"2026-10-04":{"date":"2026-10-04","label":"Sunday, October 4, 2026","scripture":"I keep Jehovah before me constantly. Because he is at my right hand, I will never be shaken.","ref":"—Ps. 16:8.","comment":"To strengthen our fear of Jehovah, we need to focus on pleasing him in every decision we make. As you read Bible accounts, ask yourself, ‘If I had been in that situation, what decision would I have made?’ For example, picture yourself listening as the ten Israelite chieftains gave their negative report after they spied out the land that Jehovah had promised to give to the Israelites. Would you have believed the report and given in to the fear of man, or would your love for Jehovah and your desire to please him have won out? An entire generation of Israelites failed to recognize the truth that Joshua and Caleb spoke. As a result, they lost the opportunity to enter the Promised Land.—Num. 14:10, 22, 23. w24.07 10 ˚7"},"2026-10-05":{"date":"2026-10-05","label":"Monday, October 5, 2026","scripture":"Jehovah is the examiner of hearts.","ref":"—Prov. 17:3.","comment":"Gomer, the wife of the prophet Hosea, left Hosea for other men. Was she beyond help? Jehovah, who can read hearts, told Hosea: “Go once again, love the woman who is loved by another man and is committing adultery, just as Jehovah loves the people of Israel while they turn to other gods.” (Hos. 3:1; Prov. 16:2) Note that Hosea’s wife was still involved in a course of serious sin. Yet, Jehovah told Hosea to reach out to her and offer forgiveness and reconciliation. Similarly, Jehovah had not given up on his obstinate people. Even"},"2026-10-06":{"date":"2026-10-06","label":"Tuesday, October 6, 2026","scripture":"The Law has a shadow of the good things to come.","ref":"—Heb. 10:1.","comment":"Early Christians of a Jewish background faced a big challenge. At one time, the Jews had been Jehovah’s chosen people. Jerusalem was the earthly seat of God’s Kingdom, and the temple was the center of pure worship. All faithful Jews followed the Mosaic Law as explained by their religious leaders. Those teachings governed their diet, their view of circumcision, and even their association with Gentiles. However, Jehovah no longer accepted the Jewish sacrifices after Jesus’ death. That presented a challenge for Jewish Christians who were used to following the Law. (Heb. 10:1, 4, 10) Even mature Christians, such as the apostle Peter, struggled to adapt to some of these changes. (Acts 10:914; Gal. 2:11-14) Because of their new beliefs, those Christians became a target of the Jewish religious leaders. w24.09 9 ˚4"},"2026-10-07":{"date":"2026-10-07","label":"Wednesday, October 7, 2026","scripture":"Remember those who are taking the lead among you, who have spoken the word of God to you.","ref":"—Heb. 13:7.","comment":"Whenever Jehovah gives his people an assignment, he expects them to carry it out in an organized way. (1 Cor. 14:33) For example, it is God’s will for the good news to be preached in all the inhabited earth. (Matt. 24:14) Jehovah has put Jesus in charge of that work. Jesus has seen to it that it is carried out in an organized fashion. In the first century, as congregations were established in various places, elders were appointed to give direction and take the lead. (Acts 14:23) In Jerusalem a central body of elders, consisting of the apostles and older men, made certain decisions that all the congregations were expected to comply with. (Acts 15:2; 16:4) As a result of their obedience to the instructions they received, “the congregations continued to be made firm in the faith and to increase in number.” —Acts 16:5. w24.04 8 ˚1"},"2026-10-08":{"date":"2026-10-08","label":"Thursday, October 8, 2026","scripture":"Mary Magdalene came and brought the news to the disciples: “I have seen the Lord!”","ref":"—John 20:18.","comment":"Early on the morning of Nisan 16, a number of loyal women went to the place where Jesus had been lying lifeless. (Luke 24:1, 10) Let us focus on the experience of one of the women, Mary Magdalene. When Mary arrived at the tomb, she found it empty. She ran to tell Peter and John and then followed them as they raced to the tomb. After confirming that the tomb was empty, the men returned home."},"2026-10-09":{"date":"2026-10-09","label":"Friday, October 9, 2026","scripture":"I will multiply my signs and my miracles in the land of Egypt.","ref":"—Ex. 7:3.","comment":"Moses served as a prophet, a judge, a commander, and a historian. He led the nation of Israel out of slavery in Egypt and personally witnessed many of Jehovah’s miracles. Jehovah used him to write the first five books of the Bible, Psalm 90, and possibly Psalm 91. He also likely wrote the book of Job. Shortly before he died, at the age of 120, Moses called together all the Israelites to remind them of the things they had seen and experienced. They had witnessed the many signs and miracles performed by Jehovah as well as His judgments against Egypt. (Ex. 7:4) They had walked through the parted waters of the Red Sea and had seen the destruction of Pharaoh’s army. (Ex. 14:29-31) In the wilderness, they had experienced Jehovah’s protection and care. (Deut. 8:3, 4) Now, poised to enter the Promised Land, Moses grasped this last opportunity to encourage the people. w24.11 8-9 ˚3-4"},"2026-10-10":{"date":"2026-10-10","label":"Saturday, October 10, 2026","scripture":"If anyone eats of this bread he will live forever . . . The bread that I will give is my flesh in behalf of the life of the world.","ref":"—John 6:51.","comment":"What Jesus said to his apostles during the Lord’s Evening Meal stands in contrast with what he said to the crowd in Galilee, where he was speaking in a way that was broader in scope. When Jesus was in Galilee in 32 C.E., he was mainly addressing Jews who wanted bread from him. However, he called their attention to something much more beneficial than literal food. He identified a provision by which they could gain everlasting life. And Jesus said that those who died could be resurrected on the last day and live forever. He was not referring to a chosen few, a limited number, as he did later during the Lord’s Evening Meal. Rather, in Galilee he focused on a blessing that would be available to all people. w24.12 11 ˚10-11"},"2026-10-11":{"date":"2026-10-11","label":"Sunday, October 11, 2026","scripture":"Husbands, keep on loving your wives.","ref":"—Col. 3:19.","comment":"Jehovah hates anyone who is violent. (Ps. 11:5) He specifically condemns husbands who abuse their wife. (Mal. 2:16) If a husband does not treat his wife well, his relationship with God will be affected. Jehovah may not even listen to his prayers. (1 Pet. 3:7) Some husbands abuse their wife with angry words and hurtful speech. But Jehovah hates “anger, wrath, screaming, and abusive speech.” (Eph. 4:31, 32) A husband who speaks harshly to his wife damages not only his marriage but also his friendship with God."},"2026-10-12":{"date":"2026-10-12","label":"Monday, October 12, 2026","scripture":"A man is declared righteous . . . only through faith in Jesus Christ.","ref":"—Gal. 2:16.","comment":"Being declared righteous means that the charges against us have been dropped and that our record has been expunged, or wiped clean. By doing this, Jehovah does not violate his own standards of justice. He does not declare us righteous on our own merit; nor does he condone our sins. But because of our faith in the atonement arrangement and the ransom price that was paid, Jehovah has a basis for canceling our debts. (Rom. 3: 24) What does this mean for each of us? Those who have been selected to rule with Jesus in heaven have already been declared righteous as children of God. (Titus 3:7; 1 John 3:1) Their sins have been forgiven. They no longer have, as it were, a criminal record, and thus they qualify to be in the Kingdom. (Rom. 8:1, 2, 30) Those who have an earthly hope have been declared righteous as friends of God, and their sins are forgiven.—Jas. 2:2123. w25.02 5 ˚17; 7 ˚18"},"2026-10-13":{"date":"2026-10-13","label":"Tuesday, October 13, 2026","scripture":"You think, not God’s thoughts, but those of men.","ref":"—Matt. 16:23.","comment":"Consider one occasion when the apostle Peter did not reflect Jehovah’s thinking on matters. Jesus had told his apostles that he would have to go to Jerusalem, be handed over to the religious leaders there, endure torture, and then be put to death. (Matt. 16:21) Peter may have found it hard to accept that Jehovah would allow Jesus—the hope of Israel and the promised Messiah—to be put to death. (Matt. 16:16) So Peter took Jesus aside and said: “Be kind to yourself, Lord; you will not have this happen to you at all.” (Matt. 16:22) Because Peter did not reflect Jehovah’s thinking on the matter, he was not thinking in agreement with Jesus. Peter may have had good intentions, but Jesus rejected Peter’s advice. There is a lesson for us. Leading a self-sparing life was not Jehovah’s will for Jesus. On that occasion, Peter learned a valuable lesson about making God’s thoughts his thoughts. w25.03 9 ˚5-6"},"2026-10-14":{"date":"2026-10-14","label":"Wednesday, October 14, 2026","scripture":"Jehovah is close to the brokenhearted; he saves those who are crushed in spirit.","ref":"—Ps. 34:18.","comment":"Are you coping with emotional distress caused by disappointment or by betrayal from someone you trusted? Regardless of how a person has treated you, your heavenly Father loves you. When coping with betrayal, we can be comforted by David’s reassuring words found in today’s text. One reference work says that those “crushed in spirit” may refer to “those"},"2026-10-15":{"date":"2026-10-15","label":"Thursday, October 15, 2026","scripture":"From Jehovah you will receive the . . . reward.","ref":"—Col. 3:24.","comment":"Today, elders can be certain that Jehovah sees and values their fine work. In addition to shepherding, teaching, and preaching, many elders support construction projects and disaster relief efforts. Others serve on Patient Visitation Groups or Hospital Liaison Committees. Elders who make themselves available for such work see the congregation as Jehovah’s arrangement. They are whole-souled in their assignments and have full trust that God will reward them for what they do. (Col. 3:23, 24) Not all can be elders. But all of us have something to offer Jehovah. Our God appreciates it when we do our best to serve him. He notices our contributions to the worldwide work, no matter how modest. And he rejoices when we overlook an offense and extend forgiveness. Trust that Jehovah values what you can do. He loves you for it, and he will reward you.—Luke 21:1-4. w24.06 23 ˚12-13"},"2026-10-16":{"date":"2026-10-16","label":"Friday, October 16, 2026","scripture":"Do not let your heart turn aside to her ways. Do not stray onto her paths.","ref":"—Prov. 7:25.","comment":"Solomon’s account illustrates what can happen to any worshipper of Jehovah. He might fall into serious sin and later feel that everything occurred suddenly. Or he might say, “It just happened.” And yet, if he thinks about what actually occurred, he will likely discover that he took some unwise steps that led to his transgression. Those steps might have involved bad association, unwholesome entertainment, or frequenting questionable places—whether in person or online. Perhaps he had also stopped praying, reading the Bible, attending meetings, or sharing in the ministry. Like the young man discussed in Proverbs, he may not have committed the sin so suddenly after all. What is the lesson for us? We need to avoid not only the sin itself but also the steps that lead to sin. Solomon makes that very point after relating the account.—Matt. 5: 29, 30. w24.07 16 ˚10-11"},"2026-10-17":{"date":"2026-10-17","label":"Saturday, October 17, 2026","scripture":"We have this treasure in earthen vessels.","ref":"—2 Cor. 4:7.","comment":"What is this treasure? It is the lifesaving work of preaching the Kingdom message. (2 Cor. 4:1) What are the earthen vessels? They represent God’s servants, who take the good news to others. In Paul’s day, merchants used clay jars to transport valuable goods, such as food, wine, and money. Similarly, Jehovah entrusts us with the valuable message of the good news. With Jehovah’s backing, we can have"},"2026-10-18":{"date":"2026-10-18","label":"Sunday, October 18, 2026","scripture":"Our Father in the heavens, let your name be sanctified.","ref":"—Matt. 6:9.","comment":"Our love for Jehovah moves us to sanctify his name. We want to have a part in clearing his name of the reproach that Satan has brought on it by his malicious lies. (Gen. 3:1-5; Job 2:4; John 8:44) In our ministry, we are eager to stand up for our God, telling the truth about him to all who will listen. We want everyone to know that his greatest quality is love, that his way of ruling is righteous and just, and that his Kingdom will soon end all suffering and bring peace and happiness to the human family. (Ps. 37:10, 11, 29; 1 John 4:8) When we defend Jehovah’s reputation in our ministry, we sanctify his name. We also have the satisfaction of knowing that we are living up to our name. w24.05 18 ˚12"},"2026-10-19":{"date":"2026-10-19","label":"Monday, October 19, 2026","scripture":"When you spread a feast, invite the poor, the crippled, the lame, the blind; and you will be happy, because they have nothing with which to repay you. For you will be repaid in the resurrection of the righteous ones.","ref":"—Luke 14:13, 14.","comment":"Brothers, you demonstrate that you are “hospitable” when you do good things for others, including those outside your circle of close friends. (1 Pet. 4:9) One reference work describes a hospitable man this way: “The door of his house—and of his heart—must be open to strangers.” Ask yourself, ‘What is my reputation when it comes to welcoming visitors?’ (Heb. 13:2, 16) A hospitable man shares what he can with visitors, including lowly ones of little means and hardworking servants, such as circuit overseers and visiting speakers.—Gen. 18:2-8; Prov. 3:27; Acts 16:15; Rom. 12:13. w24.11 21 ˚6"},"2026-10-20":{"date":"2026-10-20","label":"Tuesday, October 20, 2026","scripture":"The virgins who were ready went in with him to the marriage feast.","ref":"—Matt. 25:10.","comment":"In the parable of the virgins, Jesus spoke of ten virgins who went out to meet a bridegroom. (Matt. 25:1-4) They all hoped to accompany the bridegroom to his marriage feast. Jesus described five of them as “discreet” and the other five as “foolish.” The discreet virgins were prepared to wait for the bridegroom as long as needed, even if he arrived late at night. Thus, they brought oil lamps to provide light in the dark. They even brought extra oil in case the bride-"},"2026-10-21":{"date":"2026-10-21","label":"Wednesday, October 21, 2026","scripture":"I saw . . . a great crowd . . . out of all nations.","ref":"—Rev. 7:9.","comment":"We are moved to keep zealously preaching by considering what is being accomplished worldwide today. Each year, millions of interested ones attend the Memorial and study the Bible with us. Hundreds of thousands get baptized and join us in the preaching work. We do not know how many may yet respond to our preaching work, but we do know that Jehovah is gathering a great crowd who will survive the coming great tribulation. (Rev. 7:9, 14) The Master of the harvest continues to see potential in the field, so we have good reason to keep preaching. (Luke 10:2) Jesus’ disciples have always been identified by their zealous preaching. When people witnessed the outspokenness of the apostles, “they began to realize that they had been with Jesus.” (Acts 4: 13) As people observe us in the ministry, may they see that we too have been influenced by Jesus’ zealous example. w25.03 18 ˚15; 19 ˚17-18"},"2026-10-22":{"date":"2026-10-22","label":"Thursday, October 22, 2026","scripture":"O Jehovah, what is man that you should notice him?","ref":"—Ps. 144:3.","comment":"From the Bible, we learn that Jehovah notices those who seem unimportant to others. For example, Jehovah sent the prophet Samuel to the house of Jesse to anoint one of his sons as the future king of Israel. Jesse called seven of his eight sons to meet Samuel but did not include David, the youngest. Yet, it was David whom Jehovah chose. (1 Sam. 16:6, 7, 10-12) Jehovah saw who David really was on the inside—a young man who valued spiritual things. Think about how Jehovah has already shown that he notices you. He offers to give you advice tailored to fit your needs. (Ps. 32:8) How can he do that unless he knows you well? (Ps. 139:1) When you apply Jehovah’s advice and see how it helps you, you will become convinced that Jehovah is interested in you. (1 Chron. 28:9; Acts 17:26, 27) Jehovah takes note of your efforts. He sees your inner qualities and is moved to reach out to you.—Jer. 17: 10. w24.10 25-26 ˚7-9"},"2026-10-23":{"date":"2026-10-23","label":"Friday, October 23, 2026","scripture":"He was moved with pity for them, because they were as sheep without a shepherd.","ref":"—Mark 6:34.","comment":"No doubt you love Jehovah and want to serve others. How can you strengthen your desire to serve? Why not think about the joys that can come from serving your brothers and sisters? Jesus said: “There is more happiness in giving than there is in receiving.” (Acts 20:35) He lived by this principle. He found real joy in serving others. Con-"},"2026-10-24":{"date":"2026-10-24","label":"Saturday, October 24, 2026","scripture":"Your activity will be rewarded.","ref":"—2 Chron. 15:7.","comment":"Parents, encourage your child to look for opportunities to share Bible truth with others. (Rom. 10:10) You might compare his efforts to talk about his faith with the efforts needed to play a musical instrument. At first, a learner practices tunes that are simple to play. In time, playing music becomes easier. Similarly, a young Christian might at first use a simple approach when sharing his faith with others. For example, he might ask a schoolmate: “Did you know that engineers often copy designs from nature? Let me show you a fascinating video.” After sharing a video from the series Was It Designed? he might say: “If a scientist gets credit for a design that already exists in nature, who deserves credit for the original?” Such a simple approach might be enough to stimulate a young person’s interest and leave him open to learning more. w24.12 19 ˚17-18"},"2026-10-25":{"date":"2026-10-25","label":"Sunday, October 25, 2026","scripture":"Through one man sin entered into the world and death through sin.","ref":"—Rom. 5:12.","comment":"To set us free from sin and death, Jehovah arranged for Jesus to provide the ransom. But how could the sacrifice of one perfect human redeem millions of people? The apostle Paul explains: “Just as through the disobedience of the one man [Adam] many were made sinners, so also through the obedience of the one person [Jesus] many will be made righteous.” (Rom. 5:19; 1 Tim. 2:6) In other words, it took one disobedient perfect man to cause us to become enslaved to sin and death. Therefore, it took one obedient perfect man to set us free. Couldn’t Jehovah have simply decided to allow righthearted members of Adam’s offspring to live forever? To imperfect humans, that would seem to be the kind and reasonable thing to do. But it does not take into account Jehovah’s perfect justice. Because Jehovah is just, he would never choose to ignore Adam’s glaring act of disobedience. w25.01 21 ˚3-4"},"2026-10-26":{"date":"2026-10-26","label":"Monday, October 26, 2026","scripture":"We are walking by faith, not by sight.","ref":"—2 Cor. 5:7.","comment":"At one point, the apostle Paul knew that he would soon be put to death, but he had every reason to feel satisfied with his life. Looking back, he could say: “I have run the race to the finish, I have observed the faith.” (2 Tim. 4:6-8) Paul had made wise decisions in his Christian ministry, and he felt sure that Jehovah"},"2026-10-27":{"date":"2026-10-27","label":"Tuesday, October 27, 2026","scripture":"Be transformed by making your mind over.","ref":"—Rom. 12:2.","comment":"With the help of God’s spirit, many who formerly had beastly personalities have made remarkable changes in their life. (Isa. 65:25) They have tamed their former undesirable traits. (Eph. 4:22-24) Granted, God’s people are still imperfect, so we will continue to make mistakes. However, Jehovah has united “all sorts of people” in an unbreakable bond of love and peace. (Titus 2:11) This is a miracle that only the almighty God could perform! His words always come true. (Isa. 55:10, 11) The spiritual paradise is already a reality. Jehovah has created a brotherhood that is truly unique. Among his people, we can find relative peace and enjoy a safe oasis in a violent world. (Ps. 72:7) For these reasons, we want to help as many as possible to join us in our Christian brotherhood. We can do this by focusing on making disciples.—Matt. 28:19, 20. w24.04 23 ˚13, 15"},"2026-10-28":{"date":"2026-10-28","label":"Wednesday, October 28, 2026","scripture":"We do have the mind of Christ.","ref":"—1 Cor. 2:16.","comment":"Jesus loved Jehovah with his whole mind. He knew God’s will for him and was determined to act in harmony with it, even though doing so would mean suffering for the sake of what was right. Being focused on doing his Father’s will, Jesus allowed nothing to distract him from that goal. Peter and his fellow apostles were privileged to spend time with Jesus and to learn firsthand how he thought. When Peter wrote his first inspired letter, he encouraged Christians to arm themselves with the same mental disposition as that of Christ. (1 Pet. 4:1) Peter used a military expression when he wrote: “Arm yourselves.” So if Christians imitate Jesus’ mental disposition, or way of thinking, they will be equipped with a powerful weapon in their war against sinful tendencies and against a world ruled by Satan.—2 Cor. 10:3-5; Eph. 6:12. w25.03 8-9 ˚1-3"},"2026-10-29":{"date":"2026-10-29","label":"Thursday, October 29, 2026","scripture":"The thoughts of a man’s heart are like deep waters, but the discerning man draws them out.","ref":"—Prov. 20:5.","comment":"What should you learn about the other person during courtship? Before you become too emotionally involved, you may want to discuss some important matters, such as the other person’s goals. How can you get to know what the other person is like deep inside? One of the best ways is to talk openly and honestly, to ask questions and really listen. (Jas. 1:19) To that end, you may find it helpful"},"2026-10-30":{"date":"2026-10-30","label":"Friday, October 30, 2026","scripture":"Become imitators of God, as beloved children.","ref":"—Eph. 5:1.","comment":"In the days ahead, we will encounter trials that will require us to lean on Jehovah as never before. Bible accounts and experiences of modernday Witnesses will help us discern how God has displayed rocklike qualities to support his servants. Think deeply about those accounts. Doing so can help you to make Jehovah your Rock. Also, you will be better equipped to build up the congregation. For example, Jesus gave Simon the name Cephas (translated “Peter”), which means “A Piece of Rock.” (John 1: 42) This indicated that he would become a source of comfort and stability in the congregation. Congregation elders are described as “the shadow of a massive crag.” That illustrates how they protect those in the congregation. (Isa. 32:2) Of course, the congregation benefits when all—brothers and sisters—imitate Jehovah’s rocklike qualities. w24.06 28 ˚10-11"},"2026-10-31":{"date":"2026-10-31","label":"Saturday, October 31, 2026","scripture":"Jehovah . . . requires exclusive devotion.","ref":"—Deut. 4:24.","comment":"The kings of Israel whom Jehovah considered faithful adhered to true worship. The majority of the kings whom Jehovah judged as unfaithful abandoned his Law in favor of false worship. (1 Ki. 21:25, 26; 2 Chron. 12:1) Why was the issue of worship so important to Jehovah? For one thing, the kings were responsible for guiding God’s people in true worship. Also, false worship inevitably leads to other serious sins and injustices. (Hos. 4: 1, 2) Furthermore, the kings and their subjects were dedicated to Jehovah. Thus, the Bible likens their involvement in false worship to adultery. (Jer. 3:8, 9) A person who commits literal adultery sins against his or her mate in a most personal way. Similarly, a dedicated servant of Jehovah who engages in false worship sins against Him in a direct and personal manner.—Deut. 4:23. w24.07 22-23 ˚12-15"},"2026-11-01":{"date":"2026-11-01","label":"Sunday, November 1, 2026","scripture":"I will not stay resentful forever.","ref":"—Jer. 3:12.","comment":"The elders strive to reflect Jehovah’s compassion as they deal with someone who has been removed from the congregation. For example, Jehovah did not wait for his wayward people in ancient Israel to take the first step. Rather, he took the initiative to reach out to them even before they showed any signs of repentance. Jehovah illustrated his compassion by telling the prophet Hosea to offer reconciliation to his wife, who was still sin-"},"2026-11-02":{"date":"2026-11-02","label":"Monday, November 2, 2026","scripture":"If any one of you is lacking in wisdom, let him keep asking God, for he gives generously to all and without finding fault.","ref":"—Jas. 1:5; ftn.","comment":"As the words in today’s text indicate, Jehovah does not hoard his wisdom. He generously shares it with others. Notice, too, that when Jehovah gives wisdom, he does so “without reproaching,” or “without finding fault.” He never makes us feel bad for admitting that we need his guidance. Actually, he urges us to seek it. (Prov. 2:1-6) What about us? Can we imitate Jehovah by sharing our wisdom? (Ps. 32:8) Jehovah’s people have many opportunities to share what they have learned. For instance, we often train new ones in the ministry. Elders patiently help ministerial servants and baptized brothers to learn how to handle their assignments in the congregation. And those with experience in construction and maintenance help train less experienced ones to do work on theocratic facilities. w24.09 28-29 ˚11-12"},"2026-11-03":{"date":"2026-11-03","label":"Tuesday, November 3, 2026","scripture":"You became so beloved to us.","ref":"—1 Thess. 2:8.","comment":"Brothers, to qualify as an elder, you must “be irreprehensible,” that is, have a good reputation in the congregation because your conduct is above reproach. (1 Tim. 3:2) In addition, you should have a fine testimony from outsiders. Unbelievers may criticize your Christian beliefs, but they should have no valid reason to question your honesty or conduct. (Dan. 6:4, 5) Ask yourself, ‘Do I have a good reputation both inside and outside the congregation?’ If you are “a lover of goodness,” you look for the good in others and commend them for their fine qualities. (Titus 1:8) You are also happy to do good for others, even going beyond what is required. Why is this quality so important for elders? Because they use much of their valuable time to shepherd the congregation and care for assignments. (1 Pet. 5: 1-3) Even so, the joy that comes from serving others far outweighs any sacrifice.—Acts 20:35. w24.11 20-21 ˚3-5"},"2026-11-04":{"date":"2026-11-04","label":"Wednesday, November 4, 2026","scripture":"There is more happiness in giving than there is in receiving.","ref":"—Acts 20:35.","comment":"Ministerial servants perform vital work in the congregations. The apostle Paul obviously appreciated these loyal men. For instance, when writing to Christians in Philippi, he specifically greeted the ministerial servants along with the elders. (Phil. 1:1) Whether young or old, many baptized brothers find great joy in being ministerial servants. For example, Devan was 18 when he was appointed. On the other hand, a broth-"},"2026-11-05":{"date":"2026-11-05","label":"Thursday, November 5, 2026","scripture":"I beg you, O Jehovah, remember . . . how . . . I have done what was good in your eyes.","ref":"—2 Ki. 20:3.","comment":"At the age of 39, King Hezekiah of Judah learned that he had a terminal illness. The prophet Isaiah delivered Jehovah’s message that Hezekiah would die from his sickness. (2 Ki. 20:1) There seemed to be no hope for Hezekiah. Devastated by the news, Hezekiah wept profusely. He prayed to Jehovah fervently. Jehovah was touched by Hezekiah’s tearful plea and kindly said to him: “I have heard your prayer. I have seen your tears. Here I am healing you.” Through Isaiah, Jehovah mercifully promised to extend his life and to rescue Jerusalem out of the hands of the Assyrians. (2 Ki. 20: 4-6) Are you facing a health situation that appears to be hopeless? Turn to Jehovah in prayer, even in tears. The Bible assures us that “the Father of tender mercies and the God of all comfort” will comfort us in all our trials.—2 Cor. 1:3, 4. w24.12 24 ˚15-17"},"2026-11-06":{"date":"2026-11-06","label":"Friday, November 6, 2026","scripture":"I have hope toward God, which hope these men also look forward to, that there is going to be a resurrection of both the righteous and the unrighteous.","ref":"—Acts 24:15.","comment":"What a joy it will be to welcome resurrected ones back to life! Imagine, too, how you will enjoy learning more about Jehovah by examining his numerous works of creation. (Ps. 104: 24; Isa. 11:9) Best of all, how thrilling it will be to worship Jehovah without the slightest feeling of guilt! Would you trade these future blessings for “the temporary enjoyment of sin”? (Heb. 11:25) Certainly not! These blessings are worth any sacrifice we must make now. Remember, the Paradise earth will not always be a future hope. It will eventually become the present reality. None of this would be possible if Jehovah had not loved us enough to provide the gift of his Son! w25.01 29 ˚12"},"2026-11-07":{"date":"2026-11-07","label":"Saturday, November 7, 2026","scripture":"Is the hand of Jehovah too short?","ref":"—Num. 11:23.","comment":"Among those mentioned in the book of Hebrews as examples of faith, Moses is noteworthy. (Heb. 3:2-5; 11:2325) Moses’ faith was not misplaced, for God miraculously provided food and water to sustain the people in the barren wilderness. (Ex. 15:22-25; Ps. 78:23-25) Despite Moses’ strong faith, however, about a year after Israel’s miraculous deliverance, he questioned Jehovah’s ability to give meat to His people. Moses could not imagine how Jehovah could provide enough meat to satisfy the millions who were camping"},"2026-11-08":{"date":"2026-11-08","label":"Sunday, November 8, 2026","scripture":"[God] did not refrain from punishing an ancient world.","ref":"—2 Pet. 2:5.","comment":"Should we view the account of the Flood as a prophetic type? The answer is no. Why? Because there is no direct Scriptural support for doing so. Jesus did compare the days of Noah to the time of his presence, but he did not imply that the Flood was a prophetic type, with each person and each event having a corresponding antitype; nor did he say that the closing of the door of the ark had any prophetic significance. (Matt. 24:37-39) What was Noah’s reaction when he heard Jehovah’s warning message? He proved that he had faith by building the ark. (Heb. 11:7; 1 Pet. 3:20) Similarly, people who hear the good news about God’s Kingdom must act on what they hear. (Acts 3:17-20) Peter called Noah “a preacher of righteousness.” Today we are involved in a global preaching work, and we endeavor to have a zealous share in it. Still, try as we might, we cannot possibly reach everyone on earth with the good news before the end comes. w24.05 9-10 ˚3-5"},"2026-11-09":{"date":"2026-11-09","label":"Monday, November 9, 2026","scripture":"He honors those fearing Jehovah.","ref":"—Ps. 15:4.","comment":"We should look for ways to show kindness and respect to Jehovah’s friends. (Rom. 12:10) How? One way, based on Psalm 15:4, is that a guest in Jehovah’s tent “does not go back on his promise, even when it is bad for him.” Breaking our promises could surely hurt others. (Matt. 5:37) For example, Jehovah expects his guests to live up to their marriage vow. He is also pleased when parents make earnest efforts to fulfill promises they make to their children. Our love for God and for neighbor will compel us to keep our word to the best of our ability. Another way to honor God’s friends is by being hospitable and generous. (Rom. 12:13) Leisure time spent with our brothers and sisters helps us to strengthen bonds of friendship with them and with Jehovah. Moreover, by showing hospitality, we imitate Jehovah. w24.06 12 ˚15-16"},"2026-11-10":{"date":"2026-11-10","label":"Tuesday, November 10, 2026","scripture":"What is mortal man that you keep him in mind?","ref":"—Ps. 8:4.","comment":"Jehovah reveals the truth to those who are humble. (Matt. 11:25) We humbly accepted help to learn the truth. (Acts 8:30, 31) Still, we must be careful not to become proud. Being prideful could lead us to consider our personal opinions to be just as valid as Scriptural principles and direction from Jehovah’s organization. To maintain our humility, we need to remember our littleness when compared to Jehovah’s greatness. (Ps. 8: 3, 4) We can also pray to develop a"},"2026-11-11":{"date":"2026-11-11","label":"Wednesday, November 11, 2026","scripture":"The little one will become a thousand and the small one a mighty nation. I myself, Jehovah, will speed it up in its own time.","ref":"—Isa. 60:22.","comment":"Since 1919, Jesus has used a small group of anointed men to organize the preaching work and supply spiritual food to his followers. (Luke 12: 42) Jehovah is obviously blessing the work of that group. (Isa. 65:13, 14) If we were not organized, we would not be able to accomplish the work Jesus has assigned us to do. (Matt. 28:19, 20) Suppose, for example, that there were no territory assignments; everyone could preach wherever he wanted. Some territories might be worked over and over by a number of different publishers, while other territories might be neglected entirely. Can you think of other ways we benefit by being organized? What Jesus did on earth set the pattern for how he keeps us organized today. w24.04 8-9 ˚2-4"},"2026-11-12":{"date":"2026-11-12","label":"Thursday, November 12, 2026","scripture":"If you turn to doing good, will you not be restored to favor? But if you do not turn to doing good, sin is crouching at the door, and its craving is to dominate you.","ref":"—Gen. 4:7.","comment":"Cain was Adam and Eve’s first son. He inherited sinful tendencies from his parents. Additionally, the Bible says of him: “His own works were wicked.” (1 John 3:12) Perhaps that explains why Jehovah “did not look with any favor on Cain and on his offering” when he offered up a sacrifice. Instead of changing his ways, “Cain grew hot with anger and was dejected.” What did Jehovah do next? He spoke to Cain. (Gen. 4:3-7) Note that Jehovah reasoned kindly with Cain, offering him hope and warning him against the danger of sin. Sadly, Cain refused to listen. He did not let Jehovah lead him to repentance. After that negative response, did Jehovah stop trying to lead other sinners to repentance? Far from it! w24.08 10 ˚8"},"2026-11-13":{"date":"2026-11-13","label":"Friday, November 13, 2026","scripture":"Choose life so that you may live.","ref":"—Deut. 30:19.","comment":"The nation of Israel had prospects for a wonderful future. With Jehovah’s blessing, the Israelites could live for a long time in the land that he had promised them. And what a beautiful, fruitful land it was! Moses described it for them: “Great and fine cities that you did not build, houses full of all sorts of good things that you did not work for, hewn cisterns that you did not dig, and vineyards and olive trees that you did not plant.” (Deut. 6:10, 11) Moses also gave the Israelites a"},"2026-11-14":{"date":"2026-11-14","label":"Saturday, November 14, 2026","scripture":"No man can come to me unless the Father, who sent me, draws him.","ref":"—John 6:44.","comment":"Many nominal Christians feel that they will be saved if they merely “believe on [Jesus]” and view him as their personal savior. (John 6:29, King James Version) Yet, some in a crowd who initially believed in Jesus abandoned him. Why? Most in the crowd whom Jesus fed were happy to follow him as long as he provided what they wanted. They were interested in miraculous cures, free food, or teachings that matched their expectations. However, Jesus showed that more would be required of his true disciples. He did not come to earth simply to satisfy people’s fleshly desires. They had to respond to his invitation to “come to” him by accepting and obeying everything he taught.—John 5:40. w24.12 12 ˚12-13"},"2026-11-15":{"date":"2026-11-15","label":"Sunday, November 15, 2026","scripture":"Husbands, continue loving your wives, just as the Christ also loved the congregation.","ref":"—Eph. 5:25.","comment":"What can help a husband to overcome abusive and demeaning behavior? He can strive to imitate Jesus. The way he treated his disciples is a model for how a husband should treat his wife. Consider what husbands can learn from the way Jesus treated his apostles and from the way he spoke to them. Jesus treated his apostles in a kind and dignified way. He was never harsh or domineering. Jesus did not feel the need to prove his authority over them through displays of power. Instead, he humbly served them. (John 13:12-17) He told his disciples: “Learn from me, for I am mildtempered and lowly in heart, and you will find refreshment for yourselves.” (Matt. 11:28-30) Note that Jesus was mild-tempered. A mild person is not weak. Rather, he has the inner strength to show restraint. When provoked, he remains calm and in control of his emotions. w25.01 10 ˚10-11"},"2026-11-16":{"date":"2026-11-16","label":"Monday, November 16, 2026","scripture":"Commit to Jehovah whatever you do.","ref":"—Prov. 16:3.","comment":"As the present system of things draws closer to its end, we can expect economic conditions to worsen. Political turmoil, armed conflicts, natural disasters, or new pandemics might lead to unexpected expenses or to the loss of our job, our possessions, or our home. What can help us to make decisions that show our trust in Jehovah’s hand? A primary and effective"},"2026-11-17":{"date":"2026-11-17","label":"Tuesday, November 17, 2026","scripture":"God has shown me that I should call no man defiled or unclean.","ref":"—Acts 10:28.","comment":"The time had arrived for uncircumcised Gentiles to become part of God’s people. The apostle Peter was assigned to preach to the Gentile Cornelius, who would be among the first of this new group of worshippers. Jews had very little to do with Gentiles, so it is not surprising that Peter needed help to prepare for his assignment. When Peter discerned God’s will in this matter, he adjusted his viewpoint. As a result, when he was sent for, he went “without objection.” (Acts 10:28, 29) He preached to Cornelius and his household, and they got baptized. (Acts 10:21-23, 34, 35, 44-48) Years later, Peter encouraged fellow Christians to “think in agreement.” (1 Pet. 3:8, ftn.) As Jehovah’s people, we can think in agreement by reflecting Jehovah’s thinking as it is expressed in his Word. w25.03 9-10 ˚7-8"},"2026-11-18":{"date":"2026-11-18","label":"Wednesday, November 18, 2026","scripture":"Do not be led astray by various and strange teachings.","ref":"—Heb. 13:9.","comment":"The attitudes and opinions of the world are becoming ever more distant from God’s perfect view of matters. (Prov. 17:15) We, therefore, must strengthen our ability to identify and reject ideas that opposers use in an attempt to discourage us or even to lead us astray. We do well to take to heart the counsel that the apostle Paul gave the Hebrew Christians, to press on to spiritual maturity. That includes acquiring a deep knowledge of the truth and adopting Jehovah’s way of thinking. This process continues even after dedication and baptism. No matter how long we have been in the truth, all of us must regularly read and study God’s Word. (Ps. 1:2) A good routine of personal study will help us to strengthen a quality that Paul emphasized in his letter to the Hebrews: faith.—Heb. 11:1, 6. w24.09 10 ˚7-8"},"2026-11-19":{"date":"2026-11-19","label":"Thursday, November 19, 2026","scripture":"Draw close to God, and he will draw close to you.","ref":"—Jas. 4:8.","comment":"If Jehovah is real to us, we will find it easier to stay faithful to him. That was true of Joseph. He firmly refused to commit immorality. God was real to him, and he didn’t want to displease Him. (Gen. 39:9) For Jehovah to be real to us, we need to make time to pray to him and to study his Word. Our friendship with him will thus grow. When, like Joseph, we have a close friendship with Jehovah, we will not want to do anything that displeases Him. Those who forget that Jehovah is the living God can easily draw"},"2026-11-20":{"date":"2026-11-20","label":"Friday, November 20, 2026","scripture":"The eyes of Jehovah are on the righteous, and his ears listen to their cry for help.","ref":"—Ps. 34:15.","comment":"We are living deep in the last days, and we expect that causes of tears will only increase. Jehovah sees the tears we shed and is deeply moved by them. Our tears are truly precious to him. So when we face distressing situations, we certainly want to pour out our heart to Jehovah in prayer. May we never isolate ourselves from our loving brothers and sisters in the congregation. And may we continue to find comfort in the soothing words recorded in the Bible. We can be sure that if we keep enduring faithfully, Jehovah will reward us. That includes the wonderful promise that in time he will wipe out every tear of sorrow, betrayal, and despair from our eyes. (Rev. 21:4) Then we will shed only tears of joy. w24.12 20 ˚3; 25 ˚19"},"2026-11-21":{"date":"2026-11-21","label":"Saturday, November 21, 2026","scripture":"“You are my witnesses,” declares Jehovah.","ref":"—Isa. 43:12.","comment":"Jehovah has appointed us to be his Witnesses, and he promises to help us be courageous. (Isa. 43:10, 11) Consider just four of the ways he does that. First, Jesus is with us whenever we preach the good news. (Matt. 28:18-20) Second, Jehovah has appointed angels to help us. (Rev. 14:6) Third, Jehovah has given us his holy spirit as a helper to bring back to our minds the things we have learned. (John 14:25, 26) Fourth, Jehovah has provided brothers and sisters to accompany us. With Jehovah’s backing and the support of our loving brotherhood, we have everything we need to be successful. But if you feel discouraged when you find few people at home, ask yourself: ‘Where are the people from my territory right now?’ (Acts 16:13) ‘Are they at work or out shopping?’ If that is the case, could you find more people by doing street witnessing? w24.04 17 ˚10-11"},"2026-11-22":{"date":"2026-11-22","label":"Sunday, November 22, 2026","scripture":"If any man does not know how to preside over his own household, how will he care for the congregation of God?","ref":"—1 Tim. 3:5.","comment":"If you are a husband and want to qualify as an elder, the reputation of your family will affect your qualifications. Thus, you need to be “presiding over [your] own household in a fine manner.” You need to have a reputation for being a loving and responsible family head. This includes taking the lead in all aspects of our worship. If you are a father, you must"},"2026-11-23":{"date":"2026-11-23","label":"Monday, November 23, 2026","scripture":"No one has love greater than this, that someone should surrender his life in behalf of his friends.","ref":"—John 15:13.","comment":"The more we engage in Jehovah’s service, the more we will experience his support and, as a result, our confidence in him will grow stronger. (1 Cor. 3:9) Remember, though, Jehovah does not look at how much you give in comparison with what others give; he sees what is in your heart. He is pleased when he observes your heartfelt gratitude for his precious gift, the ransom. (1 Sam. 16:7; Mark 12:41-44) It is only because of the ransom that we have forgiveness of our sins, a friendship with Jehovah, and the prospect of everlasting life. May we always show our gratitude for Jehovah’s love, which moved him to make these blessings available to us. (1 John 4:19) May we also demonstrate our appreciation for Jesus, who loved us so much that he gave his human life in our behalf! w25.01 31 ˚16-18"},"2026-11-24":{"date":"2026-11-24","label":"Tuesday, November 24, 2026","scripture":"I was troubled all day long.","ref":"—Ps. 73:14.","comment":"Consider how the writer of Psalm 73 felt. He saw others enjoying what looked like a healthy, prosperous, and stress-free life. (Ps. 73:3-5, 12) As he observed them and their apparent success, he felt that his efforts to serve Jehovah were pointless. He was “troubled all day long” by this discouraging thought. (Ps. 73:13, 14) How did he deal with his troubled feelings? The psalmist went to the peaceful setting of Jehovah’s sanctuary. (Ps. 73:16-18) There, he was able to think clearly. He discerned that even though the life of some might seem easy, their long-term future was precarious. With this insight, he found peace of mind, knowing that pursuing spiritual things was the very best decision. As a result, he renewed his determination to continue serving Jehovah.—Ps. 73:23-28. w24.10 27 ˚11-12"},"2026-11-25":{"date":"2026-11-25","label":"Wednesday, November 25, 2026","scripture":"May people know that you, whose name is Jehovah, you alone are the Most High over all the earth.","ref":"—Ps. 83:18.","comment":"Jehovah has called us to be his “witnesses.” (Isa. 43:10-12) Some years ago, a letter from the Governing Body stated: “The greatest honor that any of us could enjoy is that of being called one of Jehovah’s Witnesses.” Why is that so? Consider an illustration. If you needed someone to be a character witness for you in a court case, you would choose someone you know and trust, someone whose reputation would make his testimony"},"2026-11-26":{"date":"2026-11-26","label":"Thursday, November 26, 2026","scripture":"He cured all who were suffering.","ref":"—Matt. 8:16.","comment":"Serving others brought Jesus great joy. On one occasion when Jesus ministered to a crowd, he did more than teach them. He also cared for their physical needs. He miraculously provided food and then had his disciples distribute it. (Mark 6:41) By doing so, he taught his disciples how to serve others. He also showed them that practical services are important. Imagine the joy the apostles had in sharing with Jesus in this miraculous distribution of food until “all ate and were satisfied”! (Mark 6:42) Of course, this was not the only time that Jesus put the welfare of others ahead of his own. He used his entire earthly life to serve people. (Matt. 4:23) Jesus found joy and satisfaction in teaching others and in humbly caring for their needs. w24.11 16 ˚10-11"},"2026-11-27":{"date":"2026-11-27","label":"Friday, November 27, 2026","scripture":"In the last days critical times hard to deal with will be here.","ref":"—2 Tim. 3:1.","comment":"As conditions in “the last days” get worse, we will no doubt have more opportunities to render aid to one another. We can also provide an emotional and spiritual haven for our brothers. One way we can do that is by making them feel welcome at the Kingdom Hall. So when our brothers and sisters attend meetings, we want to do all we can to make them feel loved, refreshed, and secure. Elders can become a refuge to those in the congregation who endure literal or figurative storms. During disasters and medical emergencies, elders take the initiative to arrange practical assistance. They also offer spiritual help. Brothers and sisters will be inclined to approach an elder if he is known to be gentle, empathetic, and willing to listen. Such qualities help others feel cared for; thus, it is easier for them to apply any Bible-based guidance an elder may provide.—1 Thess. 2:7, 8, 11. w24.06 29 ˚12-13"},"2026-11-28":{"date":"2026-11-28","label":"Saturday, November 28, 2026","scripture":"He did not even spare his own Son.","ref":"—Rom. 8:32.","comment":"Let us not think that because God is almighty, he does not have feelings! We are made in his image, created with the ability to feel, so it stands to reason that Jehovah has feelings. The Bible describes him as feeling “hurt” and “grieved.” (Ps. 78:40, 41) Jehovah must have felt grieved as he observed his Son being cruelly tortured to death by ungodly men! The ransom teaches us that no one loves us as"},"2026-11-29":{"date":"2026-11-29","label":"Sunday, November 29, 2026","scripture":"Keep on making sure of what is acceptable to the Lord.","ref":"—Eph. 5:10.","comment":"We all make some decisions based on what we perceive with our physical senses. But our physical senses can sometimes deceive us. Even when they do not, if we walk only by sight, we may end up ignoring God’s will or counsel. (Eccl. 11:9; Matt. 24:37-39) When we walk by faith, however, we will more likely make decisions that are “acceptable to the Lord.” Following God’s advice will give us inner peace and make us truly happy. (Ps. 16:8, 9; Isa. 48:17, 18) And if we continue walking by faith, we will have an everlasting future. (2 Cor. 4:18) How can we tell if we are walking by faith or by sight? Basically, it comes down to this: What factors guide our decisions? Are we guided only by the things we can see? Or are we guided by our trust in and advice from Jehovah? w25.03 20-21 ˚3-4"},"2026-11-30":{"date":"2026-11-30","label":"Monday, November 30, 2026","scripture":"Be peaceable with one another.","ref":"—1 Thess. 5:13.","comment":"Each of us has an important role to play in making the spiritual paradise attractive to others. We can fulfill this role if we imitate Jehovah. He does not drag people into his organization against their will. Instead, he gently “draws” people to himself. (John 6:44; Jer. 31:3) Good-hearted people who learn about Jehovah’s loving qualities and appealing personality are irresistibly drawn to him. How can we, by our good qualities and fine conduct, attract people to the spiritual paradise? One way is by treating our fellow worshippers with love and kindness. When new ones attend our congregation meetings, we want them to come to the same conclusion as did the unbelievers who likely attended the meetings in ancient Corinth. They declared: “God is really among you.” (1 Cor. 14:24, 25; Zech. 8:23) Thus, we must continue to heed the counsel in today’s text. w24.04 23-24 ˚16-17"},"2026-12-01":{"date":"2026-12-01","label":"Tuesday, December 1, 2026","scripture":"He opened up their minds fully to grasp the meaning of the Scriptures.","ref":"—Luke 24:45.","comment":"Jesus’ disciples accepted God’s Word and tried hard to apply it in their life. (John 17:6) Still, Jesus’ dying as a criminal on a torture stake confused them. Jesus realized that their doubts stemmed, not from a bad heart, but from a lack of understanding. (Luke 9: 44, 45; John 20:9) So he taught them to reason on the Scriptures. Consider how he did that when he appeared to the two disciples on the"},"2026-12-02":{"date":"2026-12-02","label":"Wednesday, December 2, 2026","scripture":"I do nothing of my own initiative; but just as the Father taught me, I speak these things.","ref":"—John 8:28.","comment":"Jesus learned from his heavenly Father what to do and what to say. Following the example of Jesus, Jehovah’s organization bases its moral teachings and its direction on God’s Word. (2 Tim. 3:16, 17) We regularly receive reminders to read and apply God’s Word. We benefit greatly when we study the Bible with the help of our Christian publications. For instance, we are able to compare Bible teachings with the direction we receive from the organization. When we see that the guidance we receive is based on the Scriptures, our confidence in Jehovah’s organization grows. (Rom. 12:2) Jesus preached “the good news of the Kingdom of God.” (Luke 4:43, 44) Also, Jesus commanded his disciples to preach about the Kingdom. (Luke 9:1, 2; 10:8, 9) Today all who are associated with Jehovah’s organization preach the Kingdom message no matter where they live. w24.04 9 ˚5-7"},"2026-12-03":{"date":"2026-12-03","label":"Thursday, December 3, 2026","scripture":"We will do all that you have commanded, and we will go wherever you send us.","ref":"—Josh. 1:16.","comment":"Maintain confidence in theocratic direction. In ancient Israel, Jehovah used Moses and then Joshua to convey instructions to His people. (Josh. 1:17) The Israelites were blessed when they viewed these men as representatives of Jehovah God. Centuries later when the Christian congregation was first formed, the 12 apostles gave direction. (Acts 8:14, 15) Then that group was expanded to include other elders in Jerusalem. By following the guidance received from those faithful men, “the congregations continued to be made firm in the faith and to increase in number day by day.” (Acts 16:4, 5) In modern times, we too are blessed when we follow theocratic direction from Jehovah’s organization. w24.07 10 ˚10"},"2026-12-04":{"date":"2026-12-04","label":"Friday, December 4, 2026","scripture":"I have found David the son of Jesse a man agreeable to my heart.","ref":"—Acts 13:22.","comment":"Jehovah dearly loved King David. He even called him “a man agreeable to my heart.” But David became involved in gross sins, including adultery and murder. According to the Mosaic Law, David deserved to die. (Lev. 20:10; Num. 35:31) Yet, Jehovah kindly stepped in. He sent his prophet Nathan to visit the king, even though David had not yet shown any sign of repentance. Nathan used an illustration designed to touch David’s heart. Deeply moved, David repented. (2 Sam. 12:1-14) He wrote a heart-"},"2026-12-05":{"date":"2026-12-05","label":"Saturday, December 5, 2026","scripture":"Prove to yourselves the good and acceptable and perfect will of God.","ref":"—Rom. 12:2.","comment":"Many would agree that being a parent is a full-time job. If you are a parent with a young child, we commend you for working hard to build strong faith in him. (Deut. 6:6, 7) As your child grows up, he may begin asking serious questions about our Biblebased beliefs, including the Bible’s moral standards. At first, you may be worried about your child’s questions. You might even view such questions as a step backward regarding his faith. In reality, however, growing children need to ask questions in order to form their own convictions. (1 Cor. 13:11) So there is no reason to be fearful. You may view all sincere questions your child raises about our beliefs as opportunities to help him to develop his thinking ability. w24.12 14 ˚1-2"},"2026-12-06":{"date":"2026-12-06","label":"Sunday, December 6, 2026","scripture":"We are . . . the sort who have faith for the preserving of our lives.","ref":"—Heb. 10:39.","comment":"The Hebrew Christians would need strong faith to survive the approaching tribulation in Judea. (Heb. 10: 37, 38) Jesus had warned his followers that when they saw Jerusalem surrounded by encamped armies, they should flee to the mountains. His counsel applied to all Christians, whether they lived in that city or in the open countryside. (Luke 21:2024) People back then who were threatened by an invading army would normally seek protection in a walled city like Jerusalem. Fleeing to the mountains would have seemed illogical and would have taken great faith. The Hebrew Christians would also need to trust those whom Jesus was using to direct the congregation. Those taking the lead likely gave specific instructions to help all in the congregation to follow Jesus’ direction at the right time and in an orderly manner. —Heb. 13:17. w24.09 10 ˚9-10"},"2026-12-07":{"date":"2026-12-07","label":"Monday, December 7, 2026","scripture":"He gave gifts in men.","ref":"—Eph. 4:8.","comment":"While on earth, Jesus perfectly cared for the work his Father had given him to do. (John 17:4) But Jesus did not have the attitude, ‘If you want something done right, you must do it yourself.’ He trained others to do the work. Jesus entrusted his disciples with the responsibility of caring for Jehovah’s precious sheep and taking the lead in the preaching and teaching work. Jesus gave his disciples frank but loving counsel. Some"},"2026-12-08":{"date":"2026-12-08","label":"Tuesday, December 8, 2026","scripture":"The righteous will possess the earth, and they will live forever on it.","ref":"—Ps. 37:29.","comment":"Obedience leads to life. Like the Israelites who were on the threshold of the Promised Land, we are on the verge of entering God’s promised new world, where we will see the earth transformed into a paradise. (Isa. 35:1; Luke 23:43) The Devil and his demons will be gone. (Rev. 20:2, 3) No longer will false religion lead people away from Jehovah. (Rev. 17:16) No longer will human governments oppress those under their care. (Rev. 19: 19, 20) Paradise will have no place for rebels. (Ps. 37:10, 11) People everywhere will obey Jehovah’s righteous laws, which promote unity and peace. Thus, they will love and trust one another. (Isa. 11:9) What a wonderful prospect! What is more, if we obey Jehovah, we can continue to live on a paradise earth not just for hundreds of years but for all eternity.—John 3: 16. w24.11 9 ˚7"},"2026-12-09":{"date":"2026-12-09","label":"Wednesday, December 9, 2026","scripture":"This good news of the Kingdom will be preached in all the inhabited earth for a witness to all the nations.","ref":"—Matt. 24:14.","comment":"The prophecy in today’s text is being fulfilled in our day as never before. The Kingdom message is published in more than 1,000 languages, and by means of the jw.org website, it is available to the majority of the world’s population. However, Jesus also told his disciples that they would not “complete the circuit of the cities,” or preach to everyone, before he would come. (Matt. 10:23; 25:3133) Jesus’ words will prove to be true in our day as well. Millions of people today live in areas where the preaching work is severely restricted. In addition, hundreds of babies are born every minute. We do our best to reach people from “every nation and tribe and tongue” with the good news. (Rev. 14:6) But the fact is that we will not be able to share the good news with each individual on earth before the end comes. w24.05 10 ˚6-7"},"2026-12-10":{"date":"2026-12-10","label":"Thursday, December 10, 2026","scripture":"They are no longer two, but one flesh.","ref":"—Matt. 19:6.","comment":"Jesus used his words to comfort and refresh others. He did not speak harshly to his followers. (Luke 8:47, 48) What an excellent example for Christian husbands! Jesus instructed husbands to remain loyal to their wife. He quoted his Father, who said that a husband should “stick to his wife.” (Matt. 19:4-6) The Greek verb used in that passage for “stick to” literally means “to glue.” Therefore, the"},"2026-12-11":{"date":"2026-12-11","label":"Friday, December 11, 2026","scripture":"Our God . . . will forgive in a large way.","ref":"—Isa. 55:7.","comment":"The forgiveness humans extend can be complicated. The way Jehovah forgives us imperfect humans is very different from the way we forgive one another. The forgiveness Jehovah extends is unique. The psalmist said of Jehovah: “With you there is true forgiveness, so that you may be held in awe.” (Ps. 130:4) Yes, Jehovah’s forgiveness is “true forgiveness.” He sets the ultimate standard of what forgiveness really means. In some cases, Bible writers used a Hebrew word for forgiveness that is never used to describe human forgiveness. When Jehovah forgives someone, that person’s sin is wiped out. The damaged relationship is entirely restored. Jehovah’s forgiveness is amazingly complete and generous. w25.02 8 ˚1-3"},"2026-12-12":{"date":"2026-12-12","label":"Saturday, December 12, 2026","scripture":"He ordered us to preach to the people and to give a thorough witness.","ref":"—Acts 10:42.","comment":"Our success in the ministry does not depend on the results we obtain. Why? Because we have done what Jehovah and his Son want us to do—we have given a witness. Even when we do not find anyone to speak with or when our message is rejected, we can have joy because we know that we are pleasing our heavenly Father. (Prov. 27:11) We can also rejoice when another publisher finds an interested person in the territory. The Watchtower has likened our work to searching for a lost child. Many are involved in looking for him, covering one area after another. When the child is found, everyone—not just the individual who found him—has reason to rejoice. Similarly, the disciple-making work is a team effort. All are needed to cover the territory, and all rejoice when a new one starts attending meetings. w24.04 18 ˚13-14"},"2026-12-13":{"date":"2026-12-13","label":"Sunday, December 13, 2026","scripture":"All those who were rightly disposed for everlasting life became believers.","ref":"—Acts 13:48.","comment":"What exciting prospects lie ahead of us! With Jehovah’s blessing, we hope to see many more accept the truth before the great tribulation begins. Also, we are thrilled at the possibility that even during the great tribulation, we may see still more people turn away from Satan’s dying world and join us in praising Jehovah! Meanwhile, we have work to do. We have the privilege of sharing in a never-to-be-"},"2026-12-14":{"date":"2026-12-14","label":"Monday, December 14, 2026","scripture":"Clothe yourselves with humility toward one another, because God opposes the haughty ones, but he gives undeserved kindness to the humble ones.","ref":"—1 Pet. 5:5.","comment":"On the night before he was put to death, Jesus taught Peter and the other apostles an important lesson in humility. Much to the astonishment of his apostles, he did something that a servant would normally do. Jesus took off his outer garments, wrapped a towel around his waist, put water into the basin, and started washing their feet. (John 13:4, 5) It may have taken some time to wash the feet of all 12 apostles—including Judas, who was going to betray him. Yet, Jesus humbly completed the task. Then Jesus patiently explained: “Do you understand what I have done to you? You address me as ‘Teacher’ and ‘Lord,’ and you are correct, for I am such. Therefore, if I, the Lord and Teacher, washed your feet, you also should wash the feet of one another.” —John 13:12-14. w25.03 10 ˚9-11"},"2026-12-15":{"date":"2026-12-15","label":"Tuesday, December 15, 2026","scripture":"You guide me with your advice, and afterward you will lead me to glory.","ref":"—Ps. 73:24.","comment":"The world makes it challenging for us to remain close to Jehovah. Many reject the idea that God exists. Often, those who ignore what God requires seem to prosper. When we see that happen, our faith can be tested. While we would not deny that God exists, we could begin to wonder whether he will act in our behalf. The writer of Psalm 73 found himself wondering about this. He saw those around him ignoring God’s laws and still enjoying life. As a result, he began to question whether it was worth serving God. (Ps. 73:11-13) What eventually helped the psalmist to correct his view? He meditated on what would happen to those who forget Jehovah. (Ps. 73:18, 19, 27) He also considered the benefits that come from serving God. We too can reflect on the blessings that Jehovah has given us. w24.06 25 ˚16-17"},"2026-12-16":{"date":"2026-12-16","label":"Wednesday, December 16, 2026","scripture":"Let your way of life be free of the love of money.","ref":"—Heb. 13:5.","comment":"In Bible times, some took advantage of their poor brothers by charging them interest on the money lent to them. Also, some judges accepted bribes and then judged innocent victims unfairly. Such practices are detestable to Jehovah. (Ezek. 22:12) It is good for us to evaluate our personal attitude toward money. Ask yourself: ‘Do I often find myself thinking about money and what it can buy? If I borrow money, am I slow to repay it, concluding that the person who"},"2026-12-17":{"date":"2026-12-17","label":"Thursday, December 17, 2026","scripture":"I refuse to walk on any evil path, so that I may keep your word.","ref":"—Ps. 119:101.","comment":"To guard ourselves against temptation, we need to cultivate right desires. If we learn to “hate what is bad and love what is good,” we will strengthen our resolve to do what is right. (Amos 5:15) Proper desires will also fortify us to remain firm if we find ourselves in a tempting situation. We should be absorbed as much as possible in spiritual activities. When we are at Christian meetings or in the ministry, we build our desire to please Jehovah. (Matt. 28:19, 20; Heb. 10:24, 25) By reading and studying God’s Word and meditating on it, we strengthen our love for what is good and our hatred for what is bad. (Josh. 1:8; Ps. 1:2, 3; 119:97) Remember, Jesus told his disciples: “Pray continually, so that you may not enter into temptation.” (Matt. 26:41) Thus, we take advantage of Jehovah’s help and strengthen our determination to please him.—Jas. 4:8. w24.07 17-18 ˚14-16"},"2026-12-18":{"date":"2026-12-18","label":"Friday, December 18, 2026","scripture":"I will give you insight and instruct you in the way you should go. I will give you advice with my eye upon you.","ref":"—Ps. 32:8.","comment":"Those who provide training do well to imitate the manner in which Jehovah shares his wisdom. Recall that Jehovah gives wisdom generously. Likewise, we freely share our knowledge and experience with those who are learning. We do not withhold some of our knowledge out of fear that the learner may eventually replace us. Nor do we take the view: ‘No one trained me! Let him learn on his own.’ Such an attitude has no place among Jehovah’s people. Rather, we gladly impart not only our knowledge “but also our very selves” to those we train. (1 Thess. 2:8) We hope that they, “in turn, will be adequately qualified to teach others.” (2 Tim. 2:1, 2) In that sense, we can be part of an ongoing cycle of generosity that results in a cycle of happiness. w24.09 29 ˚12-13"},"2026-12-19":{"date":"2026-12-19","label":"Saturday, December 19, 2026","scripture":"Individually we are members belonging to one another.","ref":"—Rom. 12:5.","comment":"If you feel that you do not have any outstanding ability, do not be discouraged. No doubt you have qualities that can make you useful in the congregation. You might benefit from prayerfully reading Paul’s reasoning found at 1 Corinthians 12:1230. Paul’s words make it clear that you, like every other servant of Jehovah, have a necessary and valuable role to play in the congregation. Do whatever you can to be useful to Je-"},"2026-12-20":{"date":"2026-12-20","label":"Sunday, December 20, 2026","scripture":"She began to pray to Jehovah and to weep uncontrollably.","ref":"—1 Sam. 1:10.","comment":"Hannah faced several problems that caused her to shed tears of sorrow. One of these difficulties was that she was in a bigamous marriage, and her husband’s other wife, Peninnah, despised her. As if that were not bad enough, Hannah was childless, while Peninnah had several children. (1 Sam. 1:1, 2) Peninnah relentlessly taunted Hannah about her barrenness. Hannah was so upset that “she would weep and not eat,” and she became “extremely bitter” at heart. (1 Sam. 1:6, 7, 10) How did Hannah find comfort? One thing that helped her was that she went to the center of true worship, the tabernacle. There, she begged Jehovah: “Look upon the affliction of your servant and remember me.” (1 Sam. 1:11) Jehovah saw her distress, heard her cry, and later blessed her by allowing her to conceive.—1 Sam. 1:19, 20; 2:21. w24.12 21 ˚5-7"},"2026-12-21":{"date":"2026-12-21","label":"Monday, December 21, 2026","scripture":"I was especially fond of the sons of men.","ref":"—Prov. 8:31.","comment":"The ransom teaches us that Jesus cares deeply for people, especially for his disciples. (John 13:1) For example, Jesus knew that some aspects of his earthly ministry would be very challenging, in particular his painful death. Yet, in carrying out his assignment on earth, he did not simply go through the motions. Instead, Jesus put his whole heart into preaching, teaching, and ministering to others. Even on the day of his death, Jesus took time to wash the feet of his apostles and give them many parting words of comfort and instruction. (John 13:12-15) Then while he was on the stake, Jesus took a few moments to give hope to a dying criminal and to arrange for his own mother’s care. (Luke 23:42, 43; John 19:26, 27) Thus Jesus’ deep love was expressed not only through his death but also through his entire life course on earth. w25.01 23 ˚11"},"2026-12-22":{"date":"2026-12-22","label":"Tuesday, December 22, 2026","scripture":"He bore the punishment for our peace, and because of his wounds we were healed.","ref":"—Isa. 53:5.","comment":"The Bible uses a word picture to help us understand the freedom that comes from true forgiveness. Because of our sinful nature and inclination, we are likened to “slaves of sin.” But thanks to Jehovah’s forgiveness, we are like slaves who have been “set free from sin.” (Rom. 6:17, 18; Rev. 1:5) Yes, Jehovah’s forgiveness gives us the exhilarating feeling of being set free from slavery. Because of the ran-"},"2026-12-23":{"date":"2026-12-23","label":"Wednesday, December 23, 2026","scripture":"If you keep on doing these things, you will by no means ever fail.","ref":"—2 Pet. 1:10.","comment":"In the parable of the talents, Jesus spoke of two slaves who were faithful to their master and one who was not. (Matt. 25:14-30) The two faithful slaves represent faithful anointed Christians. The Master, Jesus, invites them to “enter into the joy of [their] master.” They receive their heavenly reward, the first resurrection. (Matt. 25:21, 23; Rev. 20:5b) On the other hand, the bad example of the sluggish slave provides a warning for anointed ones. How so? They must prove to be industrious and diligent. In the parable of the talents, as in the parable of the virgins, Jesus was not predicting that the anointed would become sluggish. Rather, he was explaining what would happen if ever they did lose their zeal. They would fail to make their “calling and choosing sure for [themselves],” and they would not be permitted to enter into the heavenly Kingdom. w24.09 22 ˚10; 23 ˚12-13"},"2026-12-24":{"date":"2026-12-24","label":"Thursday, December 24, 2026","scripture":"Make sure of the more important things.","ref":"—Phil. 1:10.","comment":"All of us want to be able to provide for our own needs and for those of our family. (Eccl. 7:12; 1 Tim. 5:8) When deciding whether to accept a job, we understandably will consider how much money we will earn. However, a person might be walking primarily by sight if that is the only factor he takes into account. If we are walking by faith, we will also consider how the job could affect our friendship with Jehovah. We could ask ourselves: ‘Would the job require me to engage in practices that Jehovah hates?’ (Prov. 6:1619) ‘Would it interfere with my worship and perhaps keep me away from my family for long periods of time?’ If the answer to such questions is yes, it would be wise not to accept the job, even if work is hard to find. Because we walk by faith, we make decisions that show our conviction that Jehovah will somehow care for our needs. —Matt. 6:33; Heb. 13:5. w25.03 21 ˚5-6"},"2026-12-25":{"date":"2026-12-25","label":"Friday, December 25, 2026","scripture":"[Be] kind to one another, tenderly compassionate, freely forgiving one another.","ref":"—Eph. 4:32.","comment":"We should always try to see our Christian brothers and sisters as Jehovah sees them. We do so by focusing on their positive qualities and not on their imperfections, which will eventually disappear. We can resolve any differences between us in a spirit of love. Then the spiritual paradise will attract people who want to be treated in a similar way. May we be forever grateful for the paradise that Je-"},"2026-12-26":{"date":"2026-12-26","label":"Saturday, December 26, 2026","scripture":"[Seek] first the Kingdom.","ref":"—Matt. 6:33.","comment":"Parents, you can instill in your children zeal for Jehovah’s worship. Teach your children by word and example that spiritual matters—such as studying the Bible, attending meetings, and participating in the field ministry—take priority over all other activities. Otherwise your children might conclude that being one of Jehovah’s Witnesses is nothing more than belonging to the “family religion.” As a result, they might put true worship in second place or even leave it entirely. Is someone who has stopped serving Jehovah beyond hope? No, because he can repent and resume true worship. To do so, he may need to swallow his pride and accept help from congregation elders. (Jas. 5:14) No effort he makes is too great if it results in his being restored to Jehovah’s favor! w24.07 24-25 ˚18-19"},"2026-12-27":{"date":"2026-12-27","label":"Sunday, December 27, 2026","scripture":"Flee from sexual immorality!","ref":"—1 Cor. 6:18.","comment":"How can you keep your courtship honorable? As your feelings grow, you will naturally feel more attracted to each other. What can help you to keep yourselves morally clean? Avoid immoral conversations, being alone together, and heavy drinking. (Eph. 5:3) These things can arouse passion and weaken your resolve to do what is right. Why not regularly discuss together what measures you can take to keep your courtship honorable? (Prov. 22:3) Some displays of affection may be appropriate as your relationship progresses. However, if your passions are aroused, you will likely find it hard to think objectively about the other person. (Song of Sol. 1:2; 2:6) Displays of affection can also easily escalate and
