<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Classic Clock</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;background:#02070d;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
body{overflow:hidden}
#page{position:relative;width:100%;height:100vh;min-height:100vh;background-position:center center;background-size:cover;background-repeat:no-repeat;background-color:#02070d}
#shade{position:absolute;left:0;right:0;top:0;bottom:0;background:linear-gradient(to bottom,rgba(2,9,17,.28) 0%,rgba(2,9,17,.34) 31%,rgba(2,9,17,.72) 58%,rgba(2,9,17,.86) 100%);pointer-events:none}
#top{position:relative;z-index:2;height:34%;min-height:180px;text-align:center;padding:2.6vh 20px 0;border-bottom:1px solid rgba(220,235,248,.65);text-shadow:0 2px 8px rgba(0,0,0,.6)}
#date{font-size:26px;line-height:1.15;color:#f0f4f8;margin:0 0 1.2vh;font-weight:400}
#clock{font-size:128px;line-height:.9;font-weight:300;letter-spacing:1px;white-space:nowrap}
#clock .ampm{font-size:.34em;font-weight:500;vertical-align:middle;margin-left:10px;letter-spacing:1px}
#daily{position:relative;z-index:2;height:66%;padding:2.4vh 6vw 3vh;overflow:hidden;text-align:center;text-shadow:0 2px 7px rgba(0,0,0,.65)}
#dailyContent{height:100%;max-width:1200px;margin:0 auto;display:flex;flex-direction:column;align-items:center;overflow:hidden}
#dailyHeading{font-size:15px;letter-spacing:4px;color:#c2d0dc;font-weight:400;margin:0 auto 1.8vh;line-height:1.2;white-space:nowrap;position:relative;display:inline-block;padding:0 28px}
#dailyHeading:before,#dailyHeading:after{content:"";position:absolute;top:50%;width:72px;height:1px;background:rgba(210,225,238,.58)}
#dailyHeading:before{right:100%;margin-right:12px}
#dailyHeading:after{left:100%;margin-left:12px}
#dailyDate{font-size:19px;color:#d7e1ea;margin:0 0 1.5vh;display:none}
#scripture{font-family:Georgia,"Times New Roman",serif;font-size:36px;line-height:1.22;font-style:italic;font-weight:400;max-width:1150px;margin:0 auto}
#dailyRef{font-family:Georgia,"Times New Roman",serif;font-size:20px;color:#d5e0ea;margin-top:.8vh}
#comment{font-size:19px;line-height:1.5;color:#e0e7ed;max-width:1150px;margin:2vh auto 0;overflow:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0;padding:0 8px 22px;text-align:center}
#choosePhoto{position:absolute;right:14px;bottom:12px;z-index:5;background:rgba(3,13,24,.52);border:1px solid rgba(210,225,238,.28);border-radius:8px;color:#dce7ef;padding:6px 9px;font-size:11px;opacity:.55}
#choosePhoto:active{opacity:1}
#photoInput{display:none}
#version{position:absolute;right:9px;bottom:5px;z-index:4;font-size:10px;color:rgba(220,230,240,.48)}
.loading{color:#c6d2dd}
@media(max-width:760px){
 #top{padding-top:2.8vh;min-height:150px}
 #date{font-size:21px;margin-bottom:1.5vh}
 #clock{font-size:78px}
 #daily{padding:2.6vh 5vw 3.5vh}
 #dailyHeading{font-size:12px;letter-spacing:3px;margin-bottom:1.8vh}
 #scripture{font-size:30px;line-height:1.25}
 #dailyRef{font-size:18px}
 #comment{font-size:17px;line-height:1.48;margin-top:2vh}
}
@media(max-height:700px) and (min-width:761px){
 #top{padding-top:2vh;min-height:150px}
 #date{font-size:22px;margin-bottom:1vh}
 #clock{font-size:100px}
 #daily{padding-top:2.2vh}
 #dailyHeading{margin-bottom:1.4vh}
 #scripture{font-size:32px}
 #dailyRef{font-size:18px;margin-top:.5vh}
 #comment{font-size:17px;line-height:1.45;margin-top:1.5vh}
}
</style>
</head>
<body>
<div id="page">
  <div id="shade"></div>
  <section id="top">
    <div id="date">Loading date...</div>
    <div id="clock">--:--</div>
  </section>
  <section id="daily">
    <div id="dailyContent">
      <div id="dailyHeading">EXAMINING THE SCRIPTURES DAILY</div>
      <div id="dailyDate"></div>
      <div id="scripture" class="loading">Loading Daily Text...</div>
      <div id="dailyRef"></div>
      <div id="comment"></div>
    </div>
    <button id="choosePhoto" type="button">Change Picture</button>
    <input id="photoInput" type="file" accept="image/*">
  </section>
  <div id="version">v2.6</div>
</div>
<script>
(function(){
"use strict";
function getStorage(key){try{return window.localStorage.getItem(key)}catch(e){return null}}
function setStorage(key,value){try{window.localStorage.setItem(key,value);return true}catch(e){return false}}
function pad(n){return n<10?"0"+n:String(n)}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;")}
function updateClock(){
 var d=new Date(),h=d.getHours(),m=d.getMinutes(),ap=h>=12?"PM":"AM";h=h%12;if(h===0)h=12;
 document.getElementById("clock").innerHTML=h+":"+pad(m)+" <span class='ampm'>"+ap+"</span>";
 var days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
 var months=["January","February","March","April","May","June","July","August","September","October","November","December"];
 document.getElementById("date").innerHTML=days[d.getDay()]+", "+months[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear();
}
updateClock();window.setInterval(updateClock,1000);

function isoDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function prettyDailyDate(d){
 var days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
 var months=["January","February","March","April","May","June","July","August","September","October","November","December"];
 return days[d.getDay()]+", "+months[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear();
}
var dailyFallback={
 date:"2026-09-09",
 label:"Wednesday, September 9, 2026",
 scripture:"All Scripture is inspired of God and beneficial.",
 ref:"— 2 Timothy 3:16",
 comment:"All of God’s people receive the spiritual nourishment, direction, and protection they need. An example of Jehovah’s impartiality is that he makes the Bible accessible to people around the globe today. The Holy Scriptures were originally written in three languages: Hebrew, Aramaic, and Greek. Do those who can read the original Bible languages have a closer relationship with Jehovah than those who cannot? No, they do not. (Matt. 11:25) Jehovah’s approval of us is not dependent on our secular education or on our ability with languages. Rather than offer his wisdom only to the highly educated, Jehovah makes it accessible to people around the earth, whether they are highly educated or not. His inspired Word, the Bible, has been translated into thousands of languages; thus, people the world over can benefit from its teachings and learn how they can become his friends.—2 Tim. 3:16, 17."
};
function applyDaily(e){
 document.getElementById("dailyDate").innerHTML=escapeHtml(e.label||"");
 document.getElementById("scripture").className="";
 document.getElementById("scripture").innerHTML=escapeHtml(e.scripture||"");
 document.getElementById("dailyRef").innerHTML=escapeHtml(e.ref||"");
 document.getElementById("comment").innerHTML=escapeHtml(e.comment||"");
}
function getDailyCache(){var raw=getStorage("dailyTextCache");if(!raw)return null;try{return JSON.parse(raw)}catch(e){return null}}
function saveDaily(e){setStorage("dailyTextCache",JSON.stringify(e))}
function showDailyUnavailable(d){
 document.getElementById("dailyDate").innerHTML=escapeHtml(prettyDailyDate(d));
 document.getElementById("scripture").className="";
 document.getElementById("scripture").innerHTML="Daily Text unavailable";
 document.getElementById("dailyRef").innerHTML="";
 document.getElementById("comment").innerHTML="Connect to the internet and reload to retrieve today's Daily Text.";
}
function loadDaily(){
 var d=new Date(),today=isoDate(d),cached=getDailyCache();
 if(cached&&cached.date===today){applyDaily(cached);return}
 if(today===dailyFallback.date){applyDaily(dailyFallback)}
 var x;
 try{
  x=new XMLHttpRequest();
  x.onreadystatechange=function(){
   if(x.readyState!==4)return;
   if(x.status>=200&&x.status<300){
    try{var e=JSON.parse(x.responseText);if(e&&e.date===today&&e.scripture&&e.ref&&e.comment){saveDaily(e);applyDaily(e);return;}}catch(ignore){}
   }
   if(today!==dailyFallback.date&&!(cached&&cached.date===today))showDailyUnavailable(d);
  };
  x.open("GET","dailytext.json?v="+today,true);x.send(null);
 }catch(err){if(today!==dailyFallback.date&&!(cached&&cached.date===today))showDailyUnavailable(d)}
}
loadDaily();window.setInterval(loadDaily,1800000);

var defaultScenes=[
 "data:image/svg+xml;charset=utf-8,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='1000'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop stop-color='#274f73'/><stop offset='.48' stop-color='#071a2d'/><stop offset='1' stop-color='#02070d'/></linearGradient></defs><rect width='1600' height='1000' fill='url(#g)'/><circle cx='1250' cy='300' r='120' fill='#ffd68a' opacity='.85'/><path d='M0 650 L330 360 L520 580 L850 300 L1600 680 L1600 1000 L0 1000Z' fill='#071321'/><path d='M0 760 L350 560 L620 700 L980 500 L1600 760 L1600 1000 L0 1000Z' fill='#0b2134'/></svg>"),
 "data:image/svg+xml;charset=utf-8,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='1000'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop stop-color='#193d61'/><stop offset='.55' stop-color='#041327'/><stop offset='1' stop-color='#01050b'/></linearGradient></defs><rect width='1600' height='1000' fill='url(#g)'/><circle cx='1180' cy='240' r='100' fill='#d8e8f5' opacity='.72'/><g fill='#fff' opacity='.8'><circle cx='340' cy='170' r='3'/><circle cx='590' cy='110' r='2'/><circle cx='820' cy='250' r='3'/><circle cx='1040' cy='130' r='2'/><circle cx='1350' cy='320' r='2'/></g><path d='M0 690 Q300 530 620 650 T1600 620 L1600 1000 L0 1000Z' fill='#07101b'/></svg>")
];
function applySavedPhoto(){
 var p=getStorage("dailyTextPhoto");
 if(p)document.getElementById("page").style.backgroundImage="url('"+p+"')";
 else document.getElementById("page").style.backgroundImage="url('"+defaultScenes[Math.floor(Math.random()*defaultScenes.length)]+"')";
}
applySavedPhoto();
document.getElementById("choosePhoto").onclick=function(){document.getElementById("photoInput").click()};
document.getElementById("photoInput").onchange=function(){
 var file=this.files&&this.files[0];if(!file)return;
 var reader=new FileReader();
 reader.onload=function(ev){
  var img=new Image();
  img.onload=function(){
   var max=1400,w=img.width,h=img.height;
   if(w>max||h>max){if(w>=h){h=Math.round(h*max/w);w=max}else{w=Math.round(w*max/h);h=max}}
   var c=document.createElement("canvas");c.width=w;c.height=h;var ctx=c.getContext("2d");ctx.drawImage(img,0,0,w,h);
   var data=c.toDataURL("image/jpeg",0.72);document.getElementById("page").style.backgroundImage="url('"+data+"')";
   if(!setStorage("dailyTextPhoto",data))alert("The picture is being displayed, but this device could not save it for the next visit.");
  };
  img.src=ev.target.result;
 };
 reader.readAsDataURL(file);
};
})();
</script>
</body>
</html>
