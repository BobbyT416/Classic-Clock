ake it a point to greet not only one another but especially those who are new or who have not attended in a long time. We want to make them feel welcome!—Rom. 12:13. w25.01 29 ˚15"},"2026-03-29":{"date":"2026-03-29","label":"Sunday, March 29, 2026","scripture":"God . . . loved us and sent his Son as a propitiatory sacrifice for our sins.","ref":"—1 John 4:10.","comment":"While the ransom helps us to understand that Jehovah is just, it especially helps us to grasp the depth of his love. (John 3:16; 1 John 4:9, 10) The teaching of the ransom reveals that Jehovah wants us not only to have endless life but also to be part of his family. Consider: When Adam sinned, Jehovah expelled him from His family of worshippers. As a result, all of us have been born outside of God’s family. But on the basis of the ransom, Jehovah forgives our sins and will eventually bring into his family all mankind who exercise faith and who are obedient. Even now we can have a warm relationship with Jehovah and with our fellow worshippers. Truly, we are recipients of Jehovah’s tender love!—Rom. 5:10, 11. w25.01 21 ˚6 Memorial Bible reading: (Daytime events: Nisan 9) John 12:12-19; Mark 11:1-11"},"2026-03-30":{"date":"2026-03-30","label":"Monday, March 30, 2026","scripture":"By this the love of God was revealed.","ref":"—1 John 4:9.","comment":"Surely you agree that the ransom is a priceless gift! (2 Cor. 9:15) Because Jesus sacrificed his human life, you can have a close friendship with Jehovah God. You can also have the prospect of everlasting life. How fitting it is that we show gratitude for the ransom and for Jehovah, who was moved by love to provide it! (Rom. 5:8) To help us remain grateful and never take the ransom for granted, Jesus instituted the annual Memorial of his"},"2026-03-31":{"date":"2026-03-31","label":"Tuesday, March 31, 2026","scripture":"Take my discipline instead of silver, and knowledge rather than the finest gold.","ref":"—Prov. 8:10.","comment":"You can keep learning about the love that Jehovah God and Christ Jesus have for us if you continue to meditate on it. Perhaps during this year’s Memorial season, you can carefully read one or more of the Gospels. Do not try to cover too much material at one time. Instead, slow down and look for additional reasons why we should love Jehovah and Jesus. If you have been in the truth for many years, you might wonder if it is possible to discover new insights on such familiar subjects as God’s justice, his love, and the ransom. The truth is that there is no end to what we can learn about these and other topics. So take full advantage of the wealth of information that can be found in our publications. w25.01 24-25 ˚13-15 Memorial Bible reading: (Daytime events: Nisan 11) Luke 21:1-36"},"2026-04-01":{"date":"2026-04-01","label":"Wednesday, April 1, 2026","scripture":"This is the will of my Father, that everyone who recognizes the Son and exercises faith in him should have everlasting life.","ref":"—John 6:40.","comment":"For us to benefit from Jesus’ flesh and blood, we need to exercise faith in the ransom. (Eph. 1:7) Those Jesus referred to as “other sheep” do not and should not partake of the bread and the wine at the annual Lord’s Evening Meal. (John 10:16) Nonetheless, they benefit from the flesh and the blood of Jesus Christ. They do so by exercising faith in the redeeming value of his sacrifice. (John 6:53) In contrast, those who should partake show that they have been brought into the new covenant as prospective heirs of the heavenly Kingdom. Consequently, whether we are of the anointed or of the other sheep, we need to exercise faith and thus gain everlasting life. w24.12 13 ˚14, 16 Memorial Bible reading: (Daytime events: Nisan 12) Matthew 26:1-5, 14-16; Luke 22:1-6 MEMORIAL DATE After Sundown"},"2026-04-02":{"date":"2026-04-02","label":"Thursday, April 2, 2026","scripture":"Have no fear, little flock, for your Father has approved of giving you the Kingdom.","ref":"—Luke 12:32.","comment":"During the Lord’s Evening Meal, Jesus offered unleavened bread to his apostles and told them that it represented his body. Then he gave them the wine and said that it stood for the “blood of the covenant.” (Mark 14:2225; Luke 22:20; 1 Cor. 11:24) The new covenant is made with “the house of [spiritual] Israel”—who will be “in the"},"2026-04-03":{"date":"2026-04-03","label":"Friday, April 3, 2026","scripture":"God loved the world so much that he gave his only-begotten Son, so that everyone exercising faith in him might not be destroyed but have everlasting life.","ref":"—John 3:16.","comment":"Jesus was betrayed, arrested, verbally abused, slandered, convicted, and even tortured. Soldiers led him to the site of execution and nailed him to a stake. As he faithfully endured all that agony, there was Someone who felt even more pain. That was Jehovah God. He held back his infinite power and refrained from intervening. Why? In a word, love. Jesus’ sacrifice is the ultimate proof of how much Jehovah loves you. He went to great lengths, subjecting himself to the worst pain imaginable in order to rescue you from sin and death. (1 John 4:9, 10) Yes, he wants to help each one of us to fight against sin—and to win! w24.08 6 ˚13-14 Memorial Bible reading: (Daytime events: Nisan 14) John 19:1-42"},"2026-04-04":{"date":"2026-04-04","label":"Saturday, April 4, 2026","scripture":"Christ suffered for you.","ref":"—1 Pet. 2:21.","comment":"We can better understand how much Jehovah loves us if we consider what the ransom cost him. Satan claims that no servant of God will remain loyal to Him when it is hard to do so. To refute that charge, Jehovah allowed Jesus to suffer before he died. (Job 2:1-5) As Jehovah looked on, Jesus was mocked by religious opposers, whipped raw by soldiers, and nailed to a stake. Then Jehovah watched as his dear Son was left to suffer a painful death. (Matt. 27:28-31, 39) Jehovah had the power to stop the process at any given point. (Matt. 27:42, 43) However, if God had stepped in, no ransom would have been paid and we would have been left without hope. So Jehovah permitted his Son to endure suffering until he drew his last breath. w25.01 22 ˚7 Memorial Bible reading: (Daytime events: Nisan 15) Matthew 27:62-66 (Events after sunset: Nisan 16) John 20:1"},"2026-04-05":{"date":"2026-04-05","label":"Sunday, April 5, 2026","scripture":"He was seen by them throughout 40 days.","ref":"—Acts 1:3.","comment":"It is Nisan 16, 33 C.E. Jesus’ disciples are numb with grief and paralyzed by fear. Two of them leave Jerusalem and head for Emmaus. A stranger approaches and walks with them. The disciples relate their disappointment about what happened to Jesus. The stranger then begins a life-changing discussion with them. “Starting with Moses and all the Prophets,” he explains why the Messiah had to suffer and die. When the three men ar-"},"2026-04-06":{"date":"2026-04-06","label":"Monday, April 6, 2026","scripture":"Build yourselves up on your most holy faith.","ref":"—Jude 20.","comment":"We may grow to physical adulthood naturally over time, but no one grows to spiritual maturity automatically. For instance, the brothers and sisters in Corinth accepted the good news, got baptized, received holy spirit, and benefited from the personal instruction of the apostle Paul. (Acts 18:8-11) Yet, some years after their baptism, many were still immature. (1 Cor. 3:2) To reach maturity, we must first cultivate the desire to become mature. Those who “love inexperience,” preferring to remain as spiritual infants, will fail to make progress. (Prov. 1:22) We do not want to be like those who are fully grown physically but continue depending on their parents to make decisions for them. Instead, we want to take responsibility for our own spiritual growth. If you are still working to reach maturity, pray that Jehovah will give you “both the desire and the power to act.”—Phil. 2:13. w24.04 4 ˚9-10"},"2026-04-07":{"date":"2026-04-07","label":"Tuesday, April 7, 2026","scripture":"Jehovah . . . does not desire anyone to be destroyed.","ref":"—2 Pet. 3:9.","comment":"When it comes to the way he judges humans, Jehovah kindly reveals to us how he feels. (Ezek. 33:11) Jehovah is not quick to destroy people once and for all. He is profoundly merciful, and he shows mercy whenever possible. What do we know about the people who will not be resurrected? The Bible offers only a few examples. Jesus indicated that Judas Iscariot will not be resurrected. (Mark 14:21; see also John 17:12 and study note.) Judas knowingly and willfully worked in opposition to Jehovah God and His Son. (See Mark 3:29 and study notes.) Similarly, Jesus said that some of the religious leaders who had opposed him would die without a hope of resurrection. (Matt. 23:33; see John 19: 11 and study note “the man.”) And the apostle Paul warned that unrepentant apostates would not be resurrected. —Heb. 6:4-8; 10:29. w24.05 4 ˚10-11"},"2026-04-08":{"date":"2026-04-08","label":"Wednesday, April 8, 2026","scripture":"Jehovah protects the faithful.","ref":"—Ps. 31:23.","comment":"When we remain close to Jehovah, Satan can do us no lasting harm. (1 John 3:8) In the new world, Jehovah will continue to protect his faithful friends not only from spiritual harm but also from death. (Rev. 21:4) It truly is a great honor to be a guest in Jehovah’s tent—to enjoy a personal and ongoing relationship with him. (Ezek. 37:27) How should we conduct ourselves if we want to continue as his guests? If you were invited to someone’s home, you would want to know"},"2026-04-09":{"date":"2026-04-09","label":"Thursday, April 9, 2026","scripture":"He interceded for the transgressors.","ref":"—Isa. 53:12.","comment":"Jehovah asked Abraham to offer up his own son Isaac as a sacrifice. Abraham surely found this to be the most painful task imaginable. Nonetheless, he prepared to follow through with it. But God stopped him at the last moment. Still, that example teaches all people of faith a vital truth—Jehovah would be willing to offer his own beloved Son as a sacrifice. Jehovah loves humans that much. (Gen. 22:118) Centuries later, the Law given to the nation of Israel called for many sacrifices to atone for the sins of God’s people. (Lev. 4:27-29; 17:11) Such sacrifices pointed to a greater sacrifice, one that would completely save mankind from sin. God’s prophets were inspired to explain that the promised offspring, who turned out to be a special Son of God, would have to suffer and be put to death in order to save mankind—including you—from sin and death!—Isa. 53:112. w24.08 4 ˚7-8"},"2026-04-10":{"date":"2026-04-10","label":"Friday, April 10, 2026","scripture":"How I do love your law! I ponder over it all day long.","ref":"—Ps. 119:97.","comment":"When you do your Bible reading, be sure to look for ways to apply what you read. As you go over a portion of God’s Word, ask yourself, ‘How can I apply this information now or in the near future?’ To illustrate, let’s say that your Bible reading included 1 Thessalonians 5:17, 18. After reading those two verses, you could stop and think of how often and how deeply you pray. Also, you could reflect on things for which you are grateful. Maybe you determine that you will thank Jehovah for three specific things. With even a few minutes of such focused attention, you will to some extent become a hearer and a doer of God’s Word. Think of how you would benefit by repeating this process each day with other portions of the Bible that you read! Yes, you will grow as a doer of God’s Word. w24.09 4-5 ˚9-10"},"2026-04-11":{"date":"2026-04-11","label":"Saturday, April 11, 2026","scripture":"Look out for yourselves, so that you do not lose the things we have worked to produce, but that you may obtain a full reward.","ref":"—2 John 8.","comment":"Jehovah created us with a special ability. Although we enjoy receiving, we gain even greater happiness when we give to others. We feel good when we are able to help our fellow believers. And we are happy when they express their appreciation. Yet, whether the receiver expresses appreciation or not, we can be glad that we did the right thing. Never forget that whatever you give, “Jehovah has the means to"},"2026-04-12":{"date":"2026-04-12","label":"Sunday, April 12, 2026","scripture":"I praise you, O Jehovah my God, with all my heart, and I will glorify your name forever.","ref":"—Ps. 86:12.","comment":"Jehovah is merciful and compassionate. (Ps. 103:13; Isa. 49:15) He is empathetic; when we feel hurt, he feels hurt. (Zech. 2:8) He makes it easy for us to draw close to him as a Friend. (Ps. 25:14; Acts 17:27) And he is humble; “he stoops down to look on heaven and earth, raising the lowly from the dust.” (Ps. 113:6, 7) How could anyone not want to glorify our great God? We glorify Jehovah because we want others to know him. Many do not know the truth about Jehovah. Why? Because Satan has blinded their minds by spreading terrible lies about Him. (2 Cor. 4:4) Satan has convinced people that Jehovah is vengeful, uncaring, and the cause of much of the world’s suffering. But we know the truth about our God! We have the opportunity to set the record straight and thus bring him glory.—Isa. 43:10. w25.01 3 ˚6-7"},"2026-04-13":{"date":"2026-04-13","label":"Monday, April 13, 2026","scripture":"Satan . . . is misleading the entire inhabited earth.","ref":"—Rev. 12:9.","comment":"In the first century, Satan’s supporters told one lie after another about the perfect, miracle-working Son of God. For example, the religious leaders told people that Jesus’ power to expel demons was given to him by “the ruler of the demons.” (Mark 3:22) When Jesus was on trial, the religious leaders accused him of blasphemy and incited the crowds to call for his death. (Matt. 27:20) Later, as Christ’s followers preached the good news, those who opposed them “stirred up and wrongly influenced the people” to persecute those Christians. (Acts 14:2, 19) Regarding Acts 14:2, The Watchtower of December 1, 1998, explained: “Not content with rejecting the message themselves, Jewish opposers embarked on a smear campaign, trying to prejudice the Gentile population against Christians.” Today, Satan is still “misleading the entire inhabited earth.” w24.04 11 ˚15-16"},"2026-04-14":{"date":"2026-04-14","label":"Tuesday, April 14, 2026","scripture":"Will the Judge of all the earth not do what is right?","ref":"—Gen. 18:25.","comment":"A person’s eternal future does not depend on when he happens to die. Jehovah is the perfect Judge—he renders just and righteous decisions. (Ps. 33:4, 5) We can be confident that “the Judge of all the earth” will do what is right. It is also reasonable to conclude that a person’s eternal future does not depend on where he happens to live. It is unthinkable that Jehovah would automatically label as “goats” millions of people who live in"},"2026-04-15":{"date":"2026-04-15","label":"Wednesday, April 15, 2026","scripture":"Love one another.","ref":"—John 15:12.","comment":"Jehovah’s people love to help one another. (2 Cor. 8:4) However, at times, it takes courage to do so. For example, when a war breaks out, the local elders realize that their brothers and sisters need encouragement, support, and perhaps spiritual or physical provisions. Out of love for the sheep, the elders put their own safety at risk in order to provide what is needed. In such circumstances, it is important that we remain united. Cooperate with the direction from your local branch office. (Heb. 13:17) Elders should regularly review local arrangements for disaster preparedness as well as organizational direction on what to do when a disaster is imminent. (1 Cor. 14:33, 40) Be courageous but cautious. (Prov. 22:3) Use common sense. Do not take unnecessary risks. Rely on Jehovah. He can help you to assist your brothers safely. w24.07 4 ˚8; 5 ˚11"},"2026-04-16":{"date":"2026-04-16","label":"Thursday, April 16, 2026","scripture":"In my distress I called on Jehovah, . . . and my cry to him for help reached his ears.","ref":"—Ps. 18:6.","comment":"King David knew Jehovah and relied on Him. When pursued by his enemies, including King Saul, David prayed to Jehovah for help. After God answered his prayer and rescued him, David declared: “Jehovah is alive!” (Ps. 18:46) With these words, David was not merely acknowledging that God exists. One reference work notes that David was expressing confidence in Jehovah “as a living god who constantly acts on behalf of his people.” Yes, David knew from personal experience that his God was alive, and that conviction renewed his determination to serve and praise Jehovah. (Ps. 18:28, 29, 49) Our being convinced that Jehovah is the living God can help us to serve him with zeal. We will have the strength to endure trials and the motivation to continue working hard in his service. We will also be determined to remain close to Jehovah. w24.06 20-21 ˚3-4"},"2026-04-17":{"date":"2026-04-17","label":"Friday, April 17, 2026","scripture":"Let no one lead you astray in any way.","ref":"—2 Thess. 2:3.","comment":"What can we learn from the apostle Paul’s words to the Thessalonians? When we hear something that does not harmonize with what we have learned from the Bible or when we hear a sensational rumor, we need to use discernment. In the former Soviet Union, our enemies once circulated a letter that was allegedly from world headquarters. The letter encouraged some of the brothers to form a sep-"},"2026-04-18":{"date":"2026-04-18","label":"Saturday, April 18, 2026","scripture":"If anyone does commit a sin, we have a helper.","ref":"—1 John 2:1.","comment":"The most important decision that any person can make is the decision to dedicate himself to Jehovah and to become part of His family of worshippers. Jehovah desires everyone to do so. Why? He wants them to enjoy a friendship with him and to live forever. (Deut. 30:19, 20; Gal. 6:7, 8) However, Jehovah does not force anyone to serve him. He allows each individual to decide what he will do. What if a baptized Christian breaks God’s law, committing a serious sin? If he does not repent, he must be removed from the congregation. (1 Cor. 5:13) Yet, even then, Jehovah fervently hopes that the wrongdoer will return to Him. In fact, that is an important reason why he provided the ransom—to make forgiveness possible for repentant sinners. Our loving God warmly appeals to wrongdoers, urging them to repent.—Zech. 1:3; Rom. 2:4; Jas. 4:8. w24.08 14 ˚1-2"},"2026-04-19":{"date":"2026-04-19","label":"Sunday, April 19, 2026","scripture":"If your heart becomes wise, then my own heart will rejoice.","ref":"—Prov. 23:15.","comment":"By the time the apostle John wrote his third letter, some individuals were spreading false teachings and causing divisions. However, others continued “walking in the truth.” They obeyed Jehovah and were “walking according to his commandments.” (2 John 4, 6) These faithful Christians brought joy not just to John but also to Jehovah himself. (Prov. 27:11) What is the lesson for us? Faithfulness leads to joy. (1 John 5:3) For example, we have the joy of knowing that we make Jehovah happy. He rejoices to see us reject the temptations of the world and accept the truth. Others in heaven also rejoice. (Luke 15:10) We too can find joy in seeing one another remain faithful. (2 Thess. 1:4) Then when this system passes away, we will have the satisfaction of knowing that we demonstrated our loyalty to Jehovah even in a world dominated by Satan. w24.11 12 ˚17-18"},"2026-04-20":{"date":"2026-04-20","label":"Monday, April 20, 2026","scripture":"Let each one keep seeking, not his own advantage, but that of the other person.","ref":"—1 Cor. 10:24.","comment":"How long should you observe the person before you express your romantic interest? If you approach someone too soon, you could come across as impulsive. (Prov. 29:20) On the other hand, if you take too long, you could come across as indecisive, especially if the other person has perceived your interest. (Eccl. 11:4) Remember, before approaching someone, you do not need to be convinced that you will"},"2026-04-21":{"date":"2026-04-21","label":"Tuesday, April 21, 2026","scripture":"I will come again and will receive you home to myself.","ref":"—John 14:3.","comment":"Only genuine, faithful anointed ones will be received by Jesus into the heavenly Kingdom. Any anointed ones who do not remain spiritually alert will not be gathered with the “chosen ones.” (Matt. 24:31) By extension, all of God’s people, regardless of their hope, should view Jesus’ words as a warning to keep on the watch and remain faithful. We have come to know Jehovah well, so we trust his judgment. We are not concerned if Jehovah has chosen to anoint some faithful ones in more recent years. We recall what Jesus said about the 11th-hour workers in his illustration of the vineyard. (Matt. 20:1-16) Those who were invited to work in the vineyard later in the day received the same wage as those who began working in it earlier. Likewise, no matter when anointed ones are selected, they will receive the heavenly reward if they are judged faithful. w24.09 24 ˚15-17"},"2026-04-22":{"date":"2026-04-22","label":"Wednesday, April 22, 2026","scripture":"Christ suffered for you, leaving a model for you to follow his steps closely.","ref":"—1 Pet. 2:21.","comment":"Jesus set a perfect example of how to cope with injustice. Consider the unjust treatment he experienced, both from family and from outsiders. His unbelieving relatives accused him of being out of his mind, the religious leaders accused him of collaborating with the demons, and Roman soldiers mocked him, physically assaulted him, and eventually killed him. (Mark 3:21, 22; 14:55; 15:16-20, 3537) Yet, Jesus endured all that injustice and more without retaliating. What can we learn from his example? (1 Pet. 2:21-23) Jesus left us a perfect model to follow when we are dealing with an injustice. He knew when to remain silent and when to speak. (Matt. 26:62-64) He did not reply to every false statement made about him. (Matt. 11:19) When he did speak, he did not insult his persecutors or threaten them. w24.11 4-5 ˚9-10"},"2026-04-23":{"date":"2026-04-23","label":"Thursday, April 23, 2026","scripture":"Christ Jesus came into the world to save sinners.","ref":"—1 Tim. 1:15.","comment":"Imagine giving someone you love a special gift that is both beautiful and practical. How disappointed you would be if that person simply put it in storage and gave it no further thought! On the other hand, you would surely be pleased if he or she put your gift to good use and expressed appreciation for it. What is the point? Jehovah has given his Son in our behalf. How happy Jehovah must be when we show gratitude"},"2026-04-24":{"date":"2026-04-24","label":"Friday, April 24, 2026","scripture":"Ponder over these things; be absorbed in them, so that your advancement may be plainly seen by all people.","ref":"—1 Tim. 4:15.","comment":"A brother who qualifies as an elder is not a newly converted man. Although you do not have to be baptized for many years, you do need time to become a mature Christian. Before you are appointed as an elder, you must demonstrate that, like Jesus, you are humble and are content to wait on Jehovah for any assignment. (Matt. 20: 23; Phil. 2:5-8) You can prove that you are loyal by sticking to Jehovah and his righteous standards and by following the direction given through his organization. The Scriptures clearly state that overseers must be qualified to teach. Does this mean that you must be an excellent public speaker? No. Many well-qualified elders, though not the best public speakers, teach effectively in the ministry and on shepherding calls. w24.11 23-24 ˚14-15"},"2026-04-25":{"date":"2026-04-25","label":"Saturday, April 25, 2026","scripture":"I love your commandments more than gold, even fine gold.","ref":"—Ps. 119:127.","comment":"When you find a passage in the Bible that you do not fully understand, do research. Then throughout the day, meditate on what you have discovered and what it tells you about Jehovah, his Son, and their love for you. (Ps. 119:97, ftn.) Do not be discouraged if you do not find something new or exciting every time you sit down to read or to do research. In a sense, you are like a person who pans for gold. Patiently, prospectors spend hours or days before finding even the smallest nugget of gold. Yet, they persist because every bit of gold is valuable to them. Of how much greater value is every gem of Bible truth! (Prov. 8:10) So be patient and stick to your Bible reading schedule.—Ps. 1:2. w25.01 25 ˚14-15"},"2026-04-26":{"date":"2026-04-26","label":"Sunday, April 26, 2026","scripture":"Just as Jehovah freely forgave you, you must also do the same.","ref":"—Col. 3:13.","comment":"Jehovah expects us to be ready to forgive those who hurt us. (Ps. 86:5; Luke 17:4; Eph. 4:32) We may be deeply hurt because of what someone says or does to us, especially if that person is a close friend or family member. (Ps. 55:12-14) At times, the emotional pain we suffer can be likened to being stabbed. (Prov. 12:18) We may try to suppress or ignore our hurt feelings. But doing so might be like getting stabbed and then leaving the knife in the wound. Similarly, we cannot expect our hurt feelings to get better if we simply ignore"},"2026-04-27":{"date":"2026-04-27","label":"Monday, April 27, 2026","scripture":"Wisdom preserves the life of its owner.","ref":"—Eccl. 7:12.","comment":"Jesus illustrated the foolishness of storing up money without being “rich toward God.” (Luke 12:16-21) No one knows what tomorrow will bring. (Prov. 23:4, 5; Jas. 4:13-15) We face a particular challenge as followers of Christ. Jesus said that we must be ready to “give up” all our belongings to be his disciples. (Luke 14:33, ftn.) First-century Christians in Judea accepted such a loss with joy. (Heb. 10: 34) In modern times, many brothers have had to sacrifice their financial security because of refusing to give allegiance to a political system. (Rev. 13:16, 17) What has helped them to do that? They have absolute confidence in Jehovah’s promise: “I will never leave you, and I will never abandon you.” (Heb. 13:5) We do our best to plan for our future needs, and if unexpected events befall us, we trust in Jehovah’s support. w25.03 29 ˚13-14"},"2026-04-28":{"date":"2026-04-28","label":"Tuesday, April 28, 2026","scripture":"Now that we have moved beyond the primary doctrine about the Christ, let us press on to maturity, not laying a foundation again.","ref":"—Heb. 6:1.","comment":"Jehovah does not expect us to grow to maturity on our own. Those who serve as shepherds and teachers in the Christian congregation are prepared to help us in becoming “full-grown” in a spiritual sense, “attaining the measure of stature that belongs to the fullness of the Christ.” (Eph. 4:11-13) Jehovah also provides his holy spirit to help us have “the mind of Christ.” (1 Cor. 2:14-16) Further, God inspired the writing of the four Gospels to show us how Jesus thought, spoke, and acted during his earthly ministry. By imitating Jesus’ way of thinking and acting, you can reach your goal of Christian maturity. But in order to advance to maturity, we must also move “beyond the primary doctrine about the Christ,” that is, basic Christian teachings. w24.04 4-5 ˚11-12"},"2026-04-29":{"date":"2026-04-29","label":"Wednesday, April 29, 2026","scripture":"Thinking ability will keep watch over you, and discernment will safeguard you.","ref":"—Prov. 2:11.","comment":"Every day we need to make decisions. Some are relatively easy to make, such as what to have for breakfast or when to go to bed. Other matters are more difficult to decide. They may affect our health, our happiness, our loved ones, or our worship. We want our decisions to benefit us and our family. Above all, we hope that our decisions will please Jehovah. (Rom. 12:1, 2) An important step toward making a good decision is to get the"},"2026-04-30":{"date":"2026-04-30","label":"Thursday, April 30, 2026","scripture":"Jehovah . . . forgives your sin. You will not die.","ref":"—2 Sam. 12:13.","comment":"What do we know about Jehovah’s mercy? How has he demonstrated that he “does not desire anyone to be destroyed”? (2 Pet. 3:9) Consider his mercy toward some who committed serious sins. King David got involved in a series of gross sins, including adultery and murder. Yet, David repented, so Jehovah mercifully forgave him. (2 Sam. 12:1-12) King Manasseh was profoundly wicked for much of his life. Even in that extreme case, however, Jehovah responded favorably to that man’s repentance and found a basis for extending mercy and forgiveness. (2 Chron. 33:9-16) These examples remind us that Jehovah shows mercy whenever he sees that there is a basis for doing so. He will resurrect such individuals because they realized that they had committed terrible sins and they repented. w24.05 4 ˚12"},"2026-05-01":{"date":"2026-05-01","label":"Friday, May 1, 2026","scripture":"There is no partiality with God.","ref":"—Rom. 2:11.","comment":"After he had delivered his people from slavery in Egypt, Jehovah appointed priests to serve at the tabernacle. Levites were assigned to share in other duties related to that holy tent. Did those who served at the tabernacle or who were encamped close to it enjoy better care from Jehovah than others? No! Jehovah is not partial. Everyone in the encampment had an equal opportunity to enjoy Jehovah’s friendship. For example, Jehovah made sure that the entire nation was able to see the miraculous pillar of cloud and pillar of fire posted above the tabernacle. (Ex. 40:38) When the cloud started to move in a new direction, even those encamped farthest from the tabernacle were able to see that, assemble their belongings, dismantle their family tents, and keep pace with the rest of the nation. (Num. 9:15-23) Similarly today, no matter where we live on earth, we can benefit from Jehovah’s loving, watchful care and protection. w24.06 4 ˚10-12"},"2026-05-02":{"date":"2026-05-02","label":"Saturday, May 2, 2026","scripture":"Get up, and let us run away, for none of us will escape from Absalom!","ref":"—2 Sam. 15:14.","comment":"David’s life was in danger. His son Absalom was determined to steal the kingdom from him. (2 Sam. 15:12, 13) David needed to leave Jerusalem at once! As his servants were leaving, David realized that someone needed to stay back to keep him informed of Absalom’s plans. So he sent Zadok"},"2026-05-03":{"date":"2026-05-03","label":"Sunday, May 3, 2026","scripture":"“Come, now, and let us set matters straight between us,” says Jehovah.","ref":"—Isa. 1:18.","comment":"Some of Jehovah’s servants are deeply troubled by regrets over their past actions, either before or even after baptism. But we do well to remember that Jehovah provided the ransom because of his deep love for us. Surely, he wants us to accept his gift. Jehovah assures us that after we have “set matters straight” with him, he no longer holds our sins against us. How loving of Jehovah not to remember our past sins! At the same time, he never forgets the good we have done. (Ps. 103:9, 12; Heb. 6:10) If you are troubled by regrets about the past, do your best to focus on the present and on the future rather than on the past. You cannot change the past. But you can honor Jehovah in your present circumstances and look ahead to the wonderful future that he has promised you. w24.10 8 ˚8-9"},"2026-05-04":{"date":"2026-05-04","label":"Monday, May 4, 2026","scripture":"Clothe yourselves with the new personality.","ref":"—Col. 3:10.","comment":"When you read the Bible and look for ways to apply its guidance, you may at times feel overwhelmed. Think of this scenario: Today your Bible reading includes counsel against showing favoritism. (Jas. 2:1-8) You see that you could improve on how you treat others, so you decide to make some changes. Then tomorrow you read a passage that highlights the importance of controlling your speech. (Jas. 3:112) You realize that on occasion your speech has been somewhat negative. So you determine that you will be more positive and upbuilding. Your Bible reading the next day includes a warning against becoming a friend of the world. (Jas. 4:4-12) You notice that you need to be more selective in your choice of entertainment. By the fourth day, you might feel rather overwhelmed by all the things you need to work on. Do not be discouraged. Remember that putting on “the new personality” is an ongoing process. w24.09 5-6 ˚11-12"},"2026-05-05":{"date":"2026-05-05","label":"Tuesday, May 5, 2026","scripture":"Sanctify the Christ as Lord in your hearts, always ready to make a defense before everyone who demands of you a reason for the hope you have, but doing so with a mild temper and deep respect.","ref":"—1 Pet. 3:15.","comment":"Jesus knew that it was Jehovah’s view of matters that was most important. He trusted that Jehovah would deal with injustices at the right time. We can imitate Jesus by controlling what we say when we are treated unjustly."},"2026-05-06":{"date":"2026-05-06","label":"Wednesday, May 6, 2026","scripture":"Joy arises among the angels of God over one sinner who repents.","ref":"—Luke 15:10.","comment":"If a sinner repents, that is a cause for great joy! (Luke 15:7) Who deserves the credit? Do the elders? Recall what the apostle Paul wrote about sinners: “Perhaps God may give them repentance.” (2 Tim. 2:25) A study note on that verse comments: “The credit for such a change in thinking and attitude goes, not to any human, but to Jehovah, who helps the wayward Christian make this vital change. Paul goes on to mention some of the beautiful results of such repentance—it leads the sinner to a more accurate knowledge of the truth, it helps him come back to his proper senses, and it enables him to escape from Satan’s snares.—2Ti 2: 26.” When a wrongdoer repents, the committee will arrange for shepherding visits so that the person can continue to receive the help he needs to fight against Satan’s snares and to make straight paths for his feet.—Heb. 12:12, 13. w24.08 23 ˚14-15"},"2026-05-07":{"date":"2026-05-07","label":"Thursday, May 7, 2026","scripture":"You are looking for me, not because you saw signs, but because you ate from the loaves and were satisfied.","ref":"—John 6:26.","comment":"A crowd that Jesus had fed were focused on satisfying their physical needs and desires. How so? The following day, they saw that Jesus and his apostles had left. So the crowd boarded some boats that had arrived from Tiberias and headed toward Capernaum to find Jesus. (John 6:2224) Did they do that mainly to hear more about the Kingdom? No. They were primarily thinking about their physical need for bread. How do we know? Note what happened when the crowd caught up with Jesus near Capernaum. Jesus openly said that their priority was satisfying their temporary physical needs. He acknowledged that they “ate from the loaves and were satisfied” with “food that perishes.” He urged them to work instead for “food that remains for everlasting life.” (John 6:26, 27) Jesus said that his Father would provide such food. w24.12 5 ˚8-9"},"2026-05-08":{"date":"2026-05-08","label":"Friday, May 8, 2026","scripture":"The heart of the wise one gives his mouth insight and adds persuasiveness to his speech.","ref":"—Prov. 16:23.","comment":"To be more effective as a teacher, brothers, base your public teaching and private counsel on God’s Word. Be a good student of the Bible and of our publications. (Prov. 15:28) As you study, take careful note of the proper application of the Scriptures. And when teaching, try hard to reach the heart of those in your audience. You"},"2026-05-09":{"date":"2026-05-09","label":"Saturday, May 9, 2026","scripture":"Declare his glory among the nations.","ref":"—Ps. 96:3.","comment":"We can glorify Jehovah by what we say about him. Jehovah’s people are invited to “sing to Jehovah,” to “praise his name,” to “proclaim the good news of his salvation,” and to “declare his glory among the nations.” (Ps. 96:1-3) All these are ways in which we can glorify our heavenly Father. (Acts 4:29) We can also glorify Jehovah with our valuable things. True worshippers have always honored Jehovah in that way. (Prov. 3:9) For example, the Israelites contributed toward building and maintaining the temple. (2 Ki. 12:4, 5; 1 Chron. 29: 3-9) Caring disciples of Christ ministered to him and his apostles “from their belongings.” (Luke 8:1-3) Firstcentury Christians also contributed relief aid for their spiritual brothers and sisters. (Acts 11:27-29) Today we too can glorify Jehovah by means of our voluntary donations. w25.01 4 ˚8; 5 ˚11"},"2026-05-10":{"date":"2026-05-10","label":"Sunday, May 10, 2026","scripture":"Can anyone deny water to prevent these from being baptized?","ref":"—Acts 10:47.","comment":"What helped Cornelius to get baptized? We read that he “feared God together with all his household.” And Cornelius made supplication to God continually. (Acts 10:2) When Peter declared the good news to Cornelius, he and his family accepted Christ and promptly got baptized. (Acts 10:47, 48) Cornelius was no doubt willing to make whatever adjustments were required of him so that he could worship Jehovah together with his family. (Josh. 24:15; Acts 10:24, 33) Cornelius could have allowed his position to prevent him from becoming a Christian. But he did not allow that to happen. Does accepting the truth require that you make significant changes in your life? If so, Jehovah will be your Helper. He will bless your determination to serve him in harmony with Bible principles. w25.03 5 ˚12-13"},"2026-05-11":{"date":"2026-05-11","label":"Monday, May 11, 2026","scripture":"Reject irreverent false stories.","ref":"—1 Tim. 4:7.","comment":"If you hear negative stories regarding the organization or the brothers who are taking the lead, remember how God’s enemies treated Jesus and the first-century disciples. Today, Jehovah’s people are being persecuted and maligned exactly as the Bible foretold. (Matt. 5:11, 12) False stories will not mislead us if we recognize their source and take immediate action. What action should we take? Reject false stories. The apostle Paul gave clear instructions on what to do if we are"},"2026-05-12":{"date":"2026-05-12","label":"Tuesday, May 12, 2026","scripture":"By smooth talk and flattering speech they seduce the hearts of unsuspecting ones.","ref":"—Rom. 16:18.","comment":"Remain united with those who are loyal to Jehovah. God wants us to be united in our worship. We will remain united as long as we cling to the truth. Any who deviate from the truth create divisions within the congregation, so God warns us to “avoid them.” Otherwise, we ourselves could be drawn away from the truth. (Rom. 16:17) When we recognize the truth and hold firmly to it, we will stay spiritually safe and healthy. (Eph. 4:15, 16) We will be protected from Satan’s false teachings and propaganda, and we will remain secure in Jehovah’s care during the great tribulation. Keep holding firmly to what is true, “and the God of peace will be with you.”—Phil. 4:8, 9. w24.07 13 ˚16-17"},"2026-05-13":{"date":"2026-05-13","label":"Wednesday, May 13, 2026","scripture":"This man offered one sacrifice for sins for all time.","ref":"—Heb. 10:12.","comment":"Jesus focused special attention on people who felt weighed down by sin and invited them to become his followers. He knew that sin was the root cause of mankind’s ills. So he reached out to men and women who were known to be sinners. Using an illustration, he explained: “Healthy people do not need a physician, but those who are ill do.” He added: “I came to call, not righteous people, but sinners.” (Matt. 9:12, 13) Jesus lived up to those words. He gently forgave the sins of the woman who washed his feet with her tears. (Luke 7:37-50) He taught vital truths to the Samaritan woman at the well, though he knew of her immoral lifestyle. (John 4:7, 1719, 25, 26) God even empowered Jesus to undo the end result of all sin —death. How? Jesus resurrected people—male and female, children and adults.—Matt. 11:5. w24.08 4 ˚9-10"},"2026-05-14":{"date":"2026-05-14","label":"Thursday, May 14, 2026","scripture":"He will judge the inhabited earth with righteousness and the peoples with his faithfulness.","ref":"—Ps. 96:13.","comment":"How will Jehovah glorify his name in the near future? By means of his judgments. Soon he will execute Babylon the Great for bringing reproach on his holy name. (Rev. 17:5, 16; 19:1, 2) Some who witness the destruction of Babylon the Great might join us in true worship. Finally, at Armageddon, Jehovah will destroy Satan’s entire system, eliminating all those who oppose him and blaspheme his name but saving all those who love and obey"},"2026-05-15":{"date":"2026-05-15","label":"Friday, May 15, 2026","scripture":"You need to endure as part of your discipline.","ref":"—Heb. 12:7.","comment":"What would help the Hebrew Christians to endure the opposition they faced? The apostle Paul knew that they needed to have the right view of their trials. He thus explained that God may allow tests of faith as part of a Christian’s training. Such training can help one to cultivate and refine vital Christian qualities. By focusing on the end result of such trials, those Hebrew Christians would find it easier to endure. (Heb. 12:11) Paul urged the Hebrew Christians to endure trials with greater determination. He was in a good position to write to them about this. As a former persecutor of Christians, he knew what they were up against. He also knew how to endure persecution. After all, he experienced various forms of opposition after becoming a Christian.—2 Cor. 11:23-25. w24.09 12-13 ˚16-17"},"2026-05-16":{"date":"2026-05-16","label":"Saturday, May 16, 2026","scripture":"Keep on the watch.","ref":"—Matt. 25:13.","comment":"With each passing day, our ministry becomes more urgent. Why? Because time is running out. Consider what Jesus foretold about the preaching work in the last days, as recorded at Mark 13:10. According to Matthew’s parallel account, Jesus said that the good news would be preached in all the inhabited earth before “the end” comes. (Matt. 24:14) That expression refers to the complete end of Satan’s wicked system of things. Jehovah has set the “day and hour” for the events that will soon unfold. (Matt. 24:36; Acts 1:7) Each day brings us one day closer to that time. (Rom. 13: 11) Meanwhile, we must keep preaching until the end comes. As we reflect on our ministry, we do well to consider a soul-searching question: Why do we preach the good news? Put simply, love motivates us to preach. What we do in the preaching work reflects our love—our love for the good news, our love for people and, above all, our love for Jehovah and his name. w24.05 14-15 ˚2-3"},"2026-05-17":{"date":"2026-05-17","label":"Sunday, May 17, 2026","scripture":"God saw everything he had made, and look! it was very good.","ref":"—Gen. 1:31.","comment":"Parents, encourage your child to think about the natural world. While you are walking in the countryside or gardening, draw your child’s attention to the intriguing patterns that can be seen in nature. Why? These patterns give evidence of intelligence and wise design. Spiral patterns, for instance, have been studied by scientists for many years. Biophysicist Nicola Fameli ex-"},"2026-05-18":{"date":"2026-05-18","label":"Monday, May 18, 2026","scripture":"He is your life.","ref":"—Deut. 30:20.","comment":"Moses, David, and John lived in time periods and circumstances that were different from ours. But we have much in common with them. They served the true God, and so do we. Like them, we pray to Jehovah, rely on him, and look to him for guidance. And like those men of old, we are confident that Jehovah richly blesses those who obey him. Let us, therefore, heed the parting words of those older men by obeying Jehovah’s commandments. Then we will have true success in all that we do. We will have life and “endure a long time,” yes, forever! And we will have the joy of pleasing our loving heavenly Father, who fulfills all his promises in ways far beyond anything we can anticipate or even imagine.—Eph. 3:20. w24.11 13 ˚20-21"},"2026-05-19":{"date":"2026-05-19","label":"Tuesday, May 19, 2026","scripture":"God has assigned the respective ones in the congregation.","ref":"—1 Cor. 12:28.","comment":"In the first century, some brothers were appointed as ministerial servants. (1 Tim. 3:8) It seems that they were the ones who performed the “helpful services” that the apostle Paul wrote about. Ministerial servants evidently cared for necessary matters so that the elders could focus on teaching and shepherding. For example, ministerial servants may have helped to make copies of the Scriptures or may have purchased materials needed for copying. Consider some helpful services that ministerial servants perform in your congregation. (1 Pet. 4:10) They may be assigned to care for congregation accounts or territories, to order literature and make it available to the publishers, to operate audio and video equipment, to serve as attendants, or to help maintain the Kingdom Hall. All these services are necessary for the congregation to function properly. —1 Cor. 14:40. w24.10 19 ˚4-5"},"2026-05-20":{"date":"2026-05-20","label":"Wednesday, May 20, 2026","scripture":"For all things I have the strength through the one who gives me power.","ref":"—Phil. 4:13.","comment":"We will be able to endure any trial, great or small, if we remember that Jehovah is alive and that he is there to sustain us. After all, he is the Almighty, and he can give us the power to endure. We have every reason, therefore, to face our trials with confidence. Our experiencing Jehovah’s support during smaller trials convinces us that he will also help us during greater trials. Consider two personal experiences that increased"},"2026-05-21":{"date":"2026-05-21","label":"Thursday, May 21, 2026","scripture":"When anyone replies to a matter before he hears the facts, it is foolish and humiliating.","ref":"—Prov. 18:13.","comment":"Suppose you are invited to a social gathering. Should you attend? If you are not acquainted with the host or the arrangements, you will need to ask him such questions as: “Where and when will the gathering be held? How large will it be? Who will supervise it? Who will attend? What activities are planned? Will alcoholic drinks be served?” The answers to these questions will help you to make a wise decision. Next, facts in hand, look carefully at the full picture. For example, what if you learn that individuals who have no regard for Bible principles will attend the gathering or that alcoholic beverages will be served without supervision? Do you see the potential for this gathering to turn into a wild party? (1 Pet. 4:3) When you have seen the whole picture, you will be well on your way to making a good decision. w25.01 15 ˚4-5"},"2026-05-22":{"date":"2026-05-22","label":"Friday, May 22, 2026","scripture":"Though your sins are like scarlet, they will be made as white as snow.","ref":"—Isa. 1:18.","comment":"Jehovah uses word pictures to help us appreciate how by means of the ransom sacrifice, he wipes out the sins of repentant ones. It is extremely difficult to remove scarlet or crimson stains from a cloth. Yet, by means of this word picture, Jehovah assures us that our sins can be washed clean so thoroughly that they are no longer visible. Sins are also likened to “debts.” (Matt. 6:12; Luke 11:4) So every time we sin against Jehovah, it is as if we are going further and further into debt. We owe him a huge amount! But when Jehovah forgives us, it is as if he cancels the debt that would otherwise be charged against our account. He does not demand repayment of sins that have been forgiven. What a refreshing illustration to describe the relief we feel when Jehovah forgives us! w25.02 9-10 ˚9-10"},"2026-05-23":{"date":"2026-05-23","label":"Saturday, May 23, 2026","scripture":"Children are not expected to save up for their parents, but the parents for their children.","ref":"—2 Cor. 12:14.","comment":"Parents may need to receive some practical help as they grow old, and many children are happy to arrange for that. (1 Tim. 5:4) But Christian parents recognize that their greatest joy comes, not from raising children with a view to getting financial support from them, but from helping their children to become servants of Jehovah. (3 John 4) By your example, teach your children to trust in Jehovah as you help them prepare"},"2026-05-24":{"date":"2026-05-24","label":"Sunday, May 24, 2026","scripture":"Put on the new personality.","ref":"—Eph. 4:24.","comment":"Isaiah chapter 65 contains Jehovah’s description of what it would be like for those who would dwell in the spiritual paradise. The initial fulfillment of this prophecy was back in 537 B.C.E. At that time, repentant Jews were released from captivity in Babylon and they returned to their homeland. Jehovah blessed his people and helped them to make the devastated city of Jerusalem beautiful again and to restore its temple as the center of true worship in Israel. (Isa. 51:11; Zech. 8:3) A second fulfillment of Isaiah’s prophecy began in 1919 C.E. when Jehovah’s modern-day worshippers were set free from captivity to Babylon the Great. Then the spiritual paradise started to take shape throughout the earth. Zealous Kingdom proclaimers formed many congregations and produced spiritual fruitage. Men and women who once exhibited violent, animalistic tendencies “put on the new personality that was created according to God’s will.” w24.04 20-21 ˚3-4"},"2026-05-25":{"date":"2026-05-25","label":"Monday, May 25, 2026","scripture":"Each one will carry his own load.","ref":"—Gal. 6:5.","comment":"In some lands, parents or other adults may be expected to choose a mate for their single relatives. In other lands, family or friends find a potential mate for a single person and then arrange for the man and the woman to meet to see whether they are compatible. If you are asked to arrange a courtship or a marriage, consider the preferences and needs of both parties. Once you identify a prospective mate, find out as much as you can about the individual’s personality, qualities and, above all, spirituality. A close relationship with Jehovah is much more important than money, education, or social status. Remember, however, that the single brother and the single sister should make the final decision about whether to get married. w24.05 23 ˚11"},"2026-05-26":{"date":"2026-05-26","label":"Tuesday, May 26, 2026","scripture":"A true friend shows love at all times.","ref":"—Prov. 17:17.","comment":"We can support courting couples by what we say or do not say. At times, we may need to control ourselves. (Prov. 12:18) For instance, we may be eager to tell others that a couple have begun dating, but the couple may want to share the news themselves. We should not gossip about a courting couple or criticize them about personal matters. (Prov. 20:19; Rom. 14: 10; 1 Thess. 4:11) Furthermore, the couple may not appreciate comments or questions implying that they should or will get married. What if a couple decide to end the courtship? We"},"2026-05-27":{"date":"2026-05-27","label":"Wednesday, May 27, 2026","scripture":"If you become discouraged in the day of distress, your strength will be meager.","ref":"—Prov. 24:10.","comment":"Few trials can leave us feeling more discouraged than when a family member or a close friend leaves Jehovah. (Ps. 78:40) The closer our bond is with the person, the more difficult it can be to accept the situation. If you have had such a painful experience, Zadok’s example of loyalty can strengthen you. He remained loyal to Jehovah when his close associate Abiathar chose to be disloyal. This came about when King David lay on his deathbed. His son Adonijah tried to seize the throne that Jehovah had promised to Solomon. (1 Chron. 22: 9, 10) Abiathar chose to support Adonijah. (1 Ki. 1:5-8) In doing so, Abiathar was being disloyal not only to David and Zadok but also to Jehovah! For decades, Zadok and Abiathar had worked closely together as priests. —2 Sam. 8:17; 15:29; 19:11-14. w24.07 6 ˚14-15"},"2026-05-28":{"date":"2026-05-28","label":"Thursday, May 28, 2026","scripture":"Happy is the man who is always on guard.","ref":"—Prov. 28:14.","comment":"We can be certain that keeping on guard against temptation is worth the effort. Whatever “temporary enjoyment” sin may offer, living by Jehovah’s standards will make us far happier. (Heb. 11:25; Ps. 19:8) That is because we are designed to live according to his ways. (Gen. 1:27) Thus we will enjoy a clean conscience and keep ourselves in line for everlasting life. (1 Tim. 6:12; 2 Tim. 1:3; Jude 20, 21) True, “the flesh is weak.” (Matt. 26:41) But this does not mean that we are helpless. Jehovah stands ready to give us the needed power. (2 Cor. 4:7) Note, however, that it is the power beyond what is normal that God provides. The normal power—the effort we put forth from day to day to guard against temptation—is our responsibility to supply. Jehovah will answer our prayers for added strength when we need it. (1 Cor. 10:13) Yes, with Jehovah’s help, we can keep on guard against temptation. w24.07 19 ˚19-21"},"2026-05-29":{"date":"2026-05-29","label":"Friday, May 29, 2026","scripture":"Reprove before all onlookers those who practice sin.","ref":"—1 Tim. 5:20.","comment":"The apostle Paul wrote the words of today’s text to his fellow elder Timothy in connection with how to handle “those who practice sin.” What did he mean? He did not necessarily mean that the whole congregation were the “onlookers.” Rather, he was referring to those few who might already know of the sins. They could be eyewitnesses, or they could be those whom the wrongdoer confided in. The elders"},"2026-05-30":{"date":"2026-05-30","label":"Saturday, May 30, 2026","scripture":"These are the true sayings of God.","ref":"—Rev. 19:9.","comment":"We must keep busy in Jehovah’s service right up to the end. Anointed ones must remain watchful in order to be “taken along” by Jesus to their heavenly reward. (Matt. 24:40) With great anticipation, such ones look forward to “being gathered together” to Jesus in heaven. After the war of Armageddon, they will share as Jesus’ bride in the marriage of the Lamb. (2 Thess. 2:1) Though judgment is fast approaching, there is no reason for us to be afraid. If we remain faithful, our loving heavenly Father will give us “the power beyond what is normal” so that we “may succeed . . . in standing before the Son of man.” (2 Cor. 4:7; Luke 21:36) Whether our hope is heavenly or earthly, we will please our Father if we heed the warnings found in Jesus’ parables. Through Jehovah’s undeserved kindness, our names will be “found written down in the book” of life.—Dan. 12:1; Rev. 3:5. w24.09 24-25 ˚19-20"},"2026-05-31":{"date":"2026-05-31","label":"Sunday, May 31, 2026","scripture":"Drawing near to God is good for me.","ref":"—Ps. 73:28.","comment":"You can find peace of mind with the help of God’s Word. How? Contemplate the value of what you have—including treasures in heaven—and compare this to the outcome for those whose only reward is what this world has to offer. They may completely rely on their achievements in this life because they anticipate nothing else in the future. For you, however, Jehovah promises blessings far beyond anything you could ever imagine. (Ps. 145: 16) Also, consider this: Can we ever really know how our life would have turned out if we had made different decisions? One thing is certain: Those who make choices based on their love of God and love of neighbor never miss out on anything that is truly good. w24.10 27 ˚12-13"},"2026-06-01":{"date":"2026-06-01","label":"Monday, June 1, 2026","scripture":"For you, O Jehovah, are good and ready to forgive.","ref":"—Ps. 86:5.","comment":"We are already benefiting from Christ’s ransom sacrifice. For example, on the basis of the ransom, Jehovah forgives our sins. He is not obligated to forgive us. But he wants to. (Ps. 103:3, 10-13) Some may feel unworthy of Jehovah’s forgiveness. Actually, we are all unworthy. The apostle Paul understood that he was “not worthy of being called an apostle.” And yet, he added: “By God’s undeserved kindness I am what I am.” (1 Cor. 15:9, 10) When we repent of our sins, Jehovah forgives us. Why? Not because we deserve it, but because he loves us. If you are disturbed"},"2026-06-02":{"date":"2026-06-02","label":"Tuesday, June 2, 2026","scripture":"A kind man benefits himself, but the cruel person brings trouble on himself.","ref":"—Prov. 11:17.","comment":"We cannot control what others say or do to us, but we can try to control our response. And often the best response is to forgive. Why? Because we love Jehovah, and he wants us to be forgiving. If we remain angry and do not forgive, we are likely to act foolishly and perhaps suffer physically. (Prov. 14:17, 29, 30) When we let go of resentment, we prevent our heart from becoming damaged by bitterness. We also give ourselves a gift —we can start to move on and enjoy our life once again. How can you overcome hurt feelings? One way is by giving yourself time to heal. After receiving medical care, a person who has been severely injured needs time to heal physically. In a similar way, we may need time to heal emotionally before we are ready to forgive someone from the heart. (Eccl. 3:3; 1 Pet. 1:22) Pray, asking Jehovah to help you to be forgiving. w25.02 16-17 ˚8-11"},"2026-06-03":{"date":"2026-06-03","label":"Wednesday, June 3, 2026","scripture":"Solid food belongs to mature people.","ref":"—Heb. 5:14.","comment":"Examples of basic teachings include repentance, faith, baptism, and the resurrection. (Heb. 6:1, 2) Such teachings form the foundation of Christianity. For this reason, the apostle Peter spoke of them when preaching to the crowd at Pentecost. (Acts 2:32-35, 38) We must accept these primary teachings to become disciples of Christ. For example, Paul warned that any who deny the teaching of the resurrection reject the entire Christian faith. (1 Cor 15:12-14) However, we must not be satisfied with just a basic knowledge of the truth. In contrast to the primary doctrine, solid spiritual food includes not only Jehovah’s laws but also his principles, which help us to understand his thinking. To benefit from such food, we must study, meditate on, and carefully apply God’s Word. As we do so, we train ourselves to make decisions that please Jehovah. w24.04 5 ˚12-13"},"2026-06-04":{"date":"2026-06-04","label":"Thursday, June 4, 2026","scripture":"Men of Nineveh will rise up in the judgment.","ref":"—Matt. 12:41.","comment":"God reminded Jonah that the Ninevites did “not even know right from wrong.” (Jonah 1:1, 2; 3:10; 4:9-11) Later, Jesus used that example to teach about Jehovah’s justice and mercy. In what “judgment” would the Ninevites “rise up”? Jesus taught about a future “resurrection of judgment.” (John 5:29) He was referring to his Thousand Year Reign, during which both “the righteous and the unrighteous” will be resurrected. (Acts 24:15) For the unrighteous, this will"},"2026-06-05":{"date":"2026-06-05","label":"Friday, June 5, 2026","scripture":"The Son of man came to seek and to . save what was lost.","ref":"—Luke 19:10.","comment":"Jesus provided a perfect, living picture of his Father’s mercy. (John 14:9) By word and deed, he showed that his compassionate, merciful Father loves people and wants to help each of them to win the fight against sin. Jesus helped sinful people to want to change their ways and to follow him. (Luke 5:27, 28) Jesus knew what lay ahead of him. More than once, he told his followers that he would be betrayed and executed on a stake. (Matt. 17:22; 20:18, 19) He knew that his sacrifice would take away the sin of the world. Jesus also taught that after offering his life, he would “draw all sorts of men” to himself. (John 12:32) Sinful humans could please Jehovah by accepting Jesus as their Lord and by following in his steps. If they did so, they would finally be “set free from sin.” (Rom. 6: 14, 18, 22; John 8:32) So Jesus willingly and courageously faced his terrible death.—John 10:17, 18. w24.08 5 ˚11-12"},"2026-06-06":{"date":"2026-06-06","label":"Saturday, June 6, 2026","scripture":"In all the nations, the good news has to be preached first.","ref":"—Mark 13:10.","comment":"Think back to how you felt when you first learned the truth from God’s Word. You discovered that your heavenly Father loves you, that he wants you to be part of his family of worshippers, that he has promised to end pain and suffering, that you can hope to see your dead loved ones come back to life in a new world—and much more. (Mark 10:29, 30; John 5:28, 29; Rom. 8:38, 39; Rev. 21:3, 4) Those truths warmed your heart. (Luke 24: 32) You loved what you were learning, and you could not keep those precious truths to yourself! (Compare Jeremiah 20:9.) When love for Bible truth takes root in our heart, we cannot keep silent. (Luke 6:45) We feel like the first-century disciples of Jesus who said: “We cannot stop speaking about the things we have seen and heard.” (Acts 4:20) We love the truth so much that we want to share it with as many as possible. w24.05 15 ˚5; 16 ˚7"},"2026-06-07":{"date":"2026-06-07","label":"Sunday, June 7, 2026","scripture":"Serve Jehovah with rejoicing.","ref":"—Ps. 100:2.","comment":"As Jehovah’s people, we preach to others because we love our heavenly Father and we want to help our neighbors come to know him. But others struggle to find pleasure in the preaching work. Why? Some may be very shy and lack confidence. Some feel uncomfortable going to people’s homes uninvited. Some may fear being rejected. Some may have been taught to avoid conflict with others. These brothers and sisters find it hard"},"2026-06-08":{"date":"2026-06-08","label":"Monday, June 8, 2026","scripture":"Wisdom is with the modest ones.","ref":"—Prov. 11:2.","comment":"As you read the Bible, instead of trying to apply everything you read all at once, set a modest number of goals. You might try this approach: Keep a list of the things you need to work on, and then select one or two of these to work on first, leaving the other items to be pursued in time. Where should you start? You may decide to start with a goal that is easier for you to reach. Or you might choose to work on an area that you feel needs the most improvement. Once you have identified your goal, do research in our publications. Pray about your goal, asking Jehovah for “both the desire and the power to act.” (Phil. 2:13) Then put into practice what you have learned. Having made progress on your first goal, you will likely feel more motivated to work on another one. In fact, when you improve in one aspect of Christian living or on one Christian quality, you will probably find it easier to do so in other areas. w24.09 6 ˚13-14"},"2026-06-09":{"date":"2026-06-09","label":"Tuesday, June 9, 2026","scripture":"In every respect you demonstrated yourselves to be pure in this matter.","ref":"—2 Cor. 7:11.","comment":"You may be troubled by some of your past actions that have hurt others. What can help? Do what you can to repair the damage, including offering a sincere apology. Ask Jehovah to come to the aid of those affected by your actions. He can help you and those you have hurt to endure and to regain peace. Learn from past mistakes, and be willing to let Jehovah use you in whatever way he chooses. Note the example of the prophet Jonah. Instead of traveling to Nineveh as God had commanded, Jonah fled in the opposite direction. Jehovah disciplined Jonah, and he learned from his mistake. (Jonah 1:1-4, 15-17; 2:7-10) Jehovah did not give up on Jonah. God gave him another opportunity to go to Nineveh, and this time Jonah promptly obeyed. He did not let regret over his past mistake prevent him from accepting this assignment from Jehovah.—Jonah 3:1-3. w24.10 8-9 ˚10-11"},"2026-06-10":{"date":"2026-06-10","label":"Wednesday, June 10, 2026","scripture":"Repent, therefore, and turn around so as to get your sins blotted out, so that seasons of refreshing may come from Jehovah himself.","ref":"—Acts 3:19.","comment":"Jehovah does not simply cancel our debts, or sins; he blots them out. When a debt is canceled, we might imagine a large X being drawn across the account. However, the numbers beneath that X may still be legible. But to blot something out is different. To understand this word picture,"},"2026-06-11":{"date":"2026-06-11","label":"Thursday, June 11, 2026","scripture":"Do not become upset and turn to doing evil.","ref":"—Ps. 37:8.","comment":"When others misjudge us or mistreat us, we trust that Jehovah knows the truth. That confidence can help us to endure unfair treatment because we know that ultimately Jehovah will correct matters. By leaving things with Jehovah, we prevent anger or resentment from festering in our heart. Those emotions can cause us to overreact, can destroy our joy, and can damage our relationship with Jehovah. Of course, we will never be able to follow Jesus’ example perfectly. At times, we may do or say things that we later regret. (Jas. 3:2) And some injustices may leave us with emotional and physical scars that can be hard to bear. If that is true of you, be assured that Jehovah knows what you are going through. And Jesus, who also suffered unjustly, can sympathize with your feelings. (Heb. 4:15, 16) How happy we are that Jehovah gives us practical counsel that helps us to deal with injustice. w24.11 6 ˚12-13"},"2026-06-12":{"date":"2026-06-12","label":"Friday, June 12, 2026","scripture":"This is the work of God, that you exercise faith in the one whom he sent.","ref":"—John 6:29.","comment":"Exercising faith in Jesus is needed in order to “have everlasting life.” (John 3:16-18, 36; 17:3) Many Jews did not accept Jesus’ teaching about a new “work of God.” They asked him: “What are you performing as a sign, so that we may see it and believe you?” (John 6:30) They mentioned that their ancestors in Moses’ day had received manna, which could be likened to bread. (Neh. 9:15; Ps. 78: 24, 25) Clearly, their minds were still centered on being satisfied with literal bread. They even failed to press Jesus for clarification when he next spoke of “the true bread from heaven,” which was like life-giving manna from heaven. (John 6:32) They were so focused on their physical needs that they ignored the spiritual truths that Jesus was trying to share with them. w24.12 5-6 ˚10-11"},"2026-06-13":{"date":"2026-06-13","label":"Saturday, June 13, 2026","scripture":"The one who constructed all things is God.","ref":"—Heb. 3:4.","comment":"As your child learns more in science class at school, he will discover that laws govern the shape of many things. For example, each snowflake is formed according to geometric patterns known as fractals. Fractal patterns are also found in other things in nature. But who made the laws that result in these beautiful patterns? Who is behind the order and careful design we see in nature? The more your child thinks about such questions, the more likely it is that he will"},"2026-06-14":{"date":"2026-06-14","label":"Sunday, June 14, 2026","scripture":"Sexual immorality is reported among you, and such immorality as is not even found among the nations","ref":"—of","comment":"a man living with his father’s wife. —1 Cor. 5:1. Under divine inspiration, the apostle Paul wrote a letter directing that an unrepentant sinner be removed from the congregation. (1 Cor. 5:13) How were faithful Christians to treat him? Paul told them “to stop keeping company” with him. What did that mean? Paul explained that this command included “not even eating with such a man.” (1 Cor. 5:11) Sitting down to a meal with someone can easily lead to having further association with him. Clearly, then, Paul meant that the congregation should not socialize with that man. This would protect the congregation from his corrupting influence. (1 Cor. 5:5-7) Additionally, their avoiding close contact with the man might cause him to realize how far he had strayed from Jehovah’s ways, and he might feel shame and be moved to repent. w24.08 15 ˚4-5"},"2026-06-15":{"date":"2026-06-15","label":"Monday, June 15, 2026","scripture":"God loved the world so much that he gave his only-begotten Son.","ref":"—John 3:16.","comment":"In Israel, Atonement Day was observed annually. On that day, the high priest would offer animal sacrifices on behalf of the people. Of course, animal sacrifices could not completely atone for anyone’s sins because animals are inferior to humans. But as long as the repentant Israelites offered the sacrifices that Jehovah required, he was willing to forgive their sins. (Heb. 10:1-4) That arrangement impressed on the minds of the Israelites the seriousness of their sinful state. However, Jehovah had a permanent arrangement in mind for the forgiveness of sins. He arranged for his beloved Son to be “offered once for all time to bear the sins of many.” (Heb. 9:28) Jesus gave “his life as a ransom in exchange for many.”—Matt. 20:28. w25.02 4 ˚9-10"},"2026-06-16":{"date":"2026-06-16","label":"Tuesday, June 16, 2026","scripture":"Keep on the watch and pray continually, so that you may not enter into temptation.","ref":"—Matt. 26:41.","comment":"“The spirit, of course, is eager, but the flesh is weak.” (Matt. 26:41b) With those words, Jesus showed that he understood our imperfect condition. But his words also included a warning: Beware of overconfidence. Earlier that very night, the disciples had confidently expressed their determination to stick by their Master. (Matt. 26:35) Their motives were good. Still, they did not realize how quickly they could weaken under pressure. Thus, Jesus cautioned them with the words"},"2026-06-17":{"date":"2026-06-17","label":"Wednesday, June 17, 2026","scripture":"We became reconciled to God through the death of his Son.","ref":"—Rom. 5:10.","comment":"Adam and Eve lost their precious relationship with their Father, Jehovah. Originally, Adam and Eve were part of God’s family. (Luke 3:38) But when they disobeyed Jehovah, they were expelled from his family before they started to have children. (Gen. 3: 23, 24; 4:1) As their descendants, we therefore need to be reconciled to Jehovah. (Rom. 5:10, 11) In other words, we need to develop a good relationship with him. According to one reference work, the Greek word used here for “reconcile” can mean to “make a friend out of an enemy.” Amazingly, Jehovah is the one who took the initiative to make this possible. How? By means of the atonement arrangement, which Jehovah put in place for restoring a good relationship between him and sinful humans. It involves exchanging one thing for another of equal value. In this way, something that is lost or destroyed can be regained or replaced. w25.02 3-4 ˚7-8"},"2026-06-18":{"date":"2026-06-18","label":"Thursday, June 18, 2026","scripture":"Sadness in a godly way produces repentance leading to salvation.","ref":"—2 Cor. 7:10.","comment":"The apostle Paul noted that the “rebuke given by the majority [was] sufficient for such a man.” (2 Cor. 2: 5-8) In other words, the discipline had served its purpose toward the man who previously had sexual relations with his stepmother. (1 Cor. 5:1) What purpose? To lead him to repentance. (Heb. 12:11) Paul therefore directed the congregation: “Kindly forgive and comfort” the erring brother, and “confirm your love for him.” Note that Paul wanted the congregation to do more than merely allow the man back among Jehovah’s people. Paul wanted them to assure the repentant man by their words, manner, and actions that they truly forgave him and loved him. They would thus make it clear that they welcomed his return to the congregation. w24.08 15 ˚4; 16-17 ˚6-8"},"2026-06-19":{"date":"2026-06-19","label":"Friday, June 19, 2026","scripture":"You were publicly exposed both to reproaches and to tribulations.","ref":"—Heb. 10:33.","comment":"The apostle Paul could speak with conviction about what it takes to endure. He reminded Christians that when enduring trials, they needed to rely not on themselves but on Jehovah. Paul could say with courage: “Jehovah is my helper; I will not be afraid.” (Heb. 13:6) Some of our brothers are enduring persecution right now. We can loyally support them by means of our prayers and, at times, in practical ways. The Bible clearly says, however, that “all those"},"2026-06-20":{"date":"2026-06-20","label":"Saturday, June 20, 2026","scripture":"Many of the Corinthians who heard began to believe and be baptized.","ref":"—Acts 18:8.","comment":"What helped the Corinthians to get baptized? (2 Cor. 10:4, 5) God’s Word and his powerful holy spirit helped them to make drastic changes in their life. (Heb. 4:12) Those in Corinth who accepted the good news about Christ were able to abandon such habits and practices as drunkenness, thievery, and homosexuality. (1 Cor. 6:9-11) Note that although some in Corinth had deeply entrenched habits to overcome, they did not conclude that it would be too difficult for them to become Christians. They put forth diligent effort to get on the cramped road leading to everlasting life. (Matt. 7:13, 14) Are you struggling to overcome a bad habit or a wrong practice in order to get baptized? Never give up the fight! Beg Jehovah for his holy spirit to help you to resist craving what is bad. w25.03 6 ˚15-17"},"2026-06-21":{"date":"2026-06-21","label":"Sunday, June 21, 2026","scripture":"If any one of you is lacking in wisdom, let him keep asking God.","ref":"—Jas. 1:5.","comment":"Jehovah promises to give us the wisdom to discern whether a certain path will please him. He gives such wisdom “generously to all and without reproaching.” Once you have prayed for Jehovah’s direction, pay careful attention to his answer. To illustrate: If you got lost while traveling, you might ask a local resident for help. But would you then walk away before he had a chance to reply? Of course not. You would listen carefully to his directions. Similarly, after you ask Jehovah for wisdom, try to discern his answer by finding out which Bible laws and principles apply to your situation. For example, when deciding whether to attend a social gathering, you might consider what the Bible says about wild parties, bad associations, and the need to put Kingdom interests ahead of your personal preferences.—Matt. 6:33; Rom. 13:13; 1 Cor. 15:33. w25.01 16 ˚6-7"},"2026-06-22":{"date":"2026-06-22","label":"Monday, June 22, 2026","scripture":"Look! My servants will eat, but you will go hungry.","ref":"—Isa. 65:13.","comment":"Isaiah’s prophecy draws a vivid contrast between what life is like for those inside the spiritual paradise and what life is like for those outside. Jehovah abundantly satisfies the spiritual needs of his worshippers. We have his holy spirit, his written Word, and ample spiritual food so that we can “eat, . . . drink, . . . [and] rejoice.” (Compare Revelation 22:17.) In sharp contrast, those who are outside the spiritual paradise “go hungry . . . , go"},"2026-06-23":{"date":"2026-06-23","label":"Tuesday, June 23, 2026","scripture":"Let your words always be gracious.","ref":"—Col. 4:6.","comment":"If you would like to begin a courtship with someone, you could arrange to have a conversation with that person, either in a public setting or by telephone. Clearly express your intentions. (1 Cor. 14:9) If needed, give the person time to think about how to respond. (Prov. 15:28) And if the person is not interested in pursuing a relationship, respect his feelings. What if someone expresses interest in you? It likely took courage for that person to approach you, so be kind and respectful. If you need time to consider whether you agree to start a courtship, say so. However, try to provide a response as soon as possible. (Prov. 13:12) If you are not interested, express that fact kindly and clearly. If you are interested, discuss your feelings and expectations regarding courtship. Your expectations may differ from the other person’s. w24.05 23-24 ˚12-13"},"2026-06-24":{"date":"2026-06-24","label":"Wednesday, June 24, 2026","scripture":"I am coming against you in the name of Jehovah of armies.","ref":"—1 Sam. 17:45.","comment":"Likely while he was still a teenager, David visited the army camp of the Israelites. He found that the soldiers were terrified because a giant Philistine named Goliath had come out to “taunt the battle line of Israel.” (1 Sam. 17:10, 11) The soldiers’ fear was a result of their focusing on the giant and the taunts they heard on the battlefield. (1 Sam. 17:24, 25) David, however, viewed the situation from a different perspective. He viewed what was happening as a challenge, not merely against the battle line of Israel but against “the battle line of the living God.” (1 Sam. 17:26) David had Jehovah foremost in mind. David trusted that the God who had helped him when he was a shepherd would help him again in this situation. Certain of God’s backing, David faced Goliath and, of course, he won! —1 Sam. 17:45-51. w24.06 21 ˚7"},"2026-06-25":{"date":"2026-06-25","label":"Thursday, June 25, 2026","scripture":"Do not be afraid, for I am with you. Do not be anxious, for I am your God. I will fortify you, yes, I will help you, I will really hold on to you with my right hand of righteousness.","ref":"—Isa. 41:10.","comment":"Consider how our life would be if we were not serving Jehovah. Doing so can help us to stick to a faithful course and conclude as did the psalmist: “As for me, drawing near to God is good for me.” (Ps. 73:28) We can face whatever challenges come our way during these last days because we “slave for a living and true God.”"},"2026-06-26":{"date":"2026-06-26","label":"Friday, June 26, 2026","scripture":"You will . . . see the distinction between a righteous person and a wicked person.","ref":"—Mal. 3:18.","comment":"The Bible names more than 40 men who ruled as kings of Israel. The good kings did some bad things. Consider good King David. Jehovah said: “My servant David . . . walked after me with all his heart, doing only what was right in my eyes.” (1 Ki. 14:8) Yet, that man committed sexual immorality with a married woman and conspired to have her husband killed in battle. (2 Sam. 11:4, 14, 15) On the other hand, many of the unfaithful kings did some good things. Consider Rehoboam. In Jehovah’s eyes, he “did what was bad.” (2 Chron. 12:14) Yet, Rehoboam obeyed God’s order to have ten tribes break away from his kingdom. He also benefited his nation by fortifying its cities. (1 Ki. 12:21-24; 2 Chron. 11:5-12) How did Jehovah determine whether a king was faithful in His eyes? Evidently, He took into consideration his heart condition, his repentance, and his adherence to true worship. w24.07 20 ˚1-3"},"2026-06-27":{"date":"2026-06-27","label":"Saturday, June 27, 2026","scripture":"Go on bringing them up in the discipline and admonition of Jehovah.","ref":"—Eph. 6:4.","comment":"What about baptized minors—those under 18 years of age—who engage in serious wrongdoing? The body of elders will arrange for two elders to meet with the minor and his Christian parents. The elders will find out what steps the parents have already taken to help their child come to repentance. If the minor has a good attitude and the parents are reaching him, the two elders might decide that it is not necessary to take the matter any further. After all, it is the parents’ God-given responsibility to provide loving correction to their children. (Deut. 6:6, 7; Prov. 6:20; 22:6; Eph. 6:2-4) The elders will thereafter occasionally check with the parents to make sure that the minor is getting the help he needs. Howeve
