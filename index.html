lead to misconduct. (Prov. 6:27) Therefore, early in your relationship, discuss what limits you will set, in harmony with Bible principles.—1 Thess. 4:3-7. w24.05 29 ˚10-11"},"2026-12-28":{"date":"2026-12-28","label":"Monday, December 28, 2026","scripture":"Let your word “Yes” mean yes, your “No,” no.","ref":"—Matt. 5:37.","comment":"We want others to be able to count on us, especially during difficult times. (Prov. 17:17) How can we develop a reputation for being reliable? We can strive to display godly qualities consistently, such as by keeping our promises and by doing our best to be punctual. Reliable elders are a benefit to the congregation. How? Publishers feel supported when they can readily contact elders, such as their"},"2026-12-29":{"date":"2026-12-29","label":"Tuesday, December 29, 2026","scripture":"You will give them continuous peace, because it is in you that they trust.","ref":"—Isa. 26:3.","comment":"Today we cannot expect Jehovah to remove all our problems, but we can count on him to sustain us. (Ps. 41:3) By means of his holy spirit, Jehovah gives us strength, wisdom, and inner peace to cope. (Prov. 18:14; Phil. 4: 13) He also sustains us through our Bible-based hope of seeing all forms of illness eliminated. (Isa. 33:24) Jehovah has preserved soothing words that can lift our spirits when we face distressing situations. (Rom. 15:4) When a sister in West Africa was diagnosed with cancer, she often wept. She relates: “One scripture that I particularly find comforting is Isaiah 26:3. . . . That verse reassures me that Jehovah can give us the kind of inner peace that helps us control how we react to the trials.” Is there a scripture that you have found especially soothing when you are facing situations that seem extremely trying, maybe even hopeless? w24.12 24 ˚17-18"},"2026-12-30":{"date":"2026-12-30","label":"Wednesday, December 30, 2026","scripture":"While he was still a long way off, his father caught sight of him and was moved with pity, and he ran and embraced him and tenderly kissed him.","ref":"—Luke 15:20.","comment":"The elders strive to show a forgiving attitude toward those who have strayed. They want these lost sheep to “come back home.” (Luke 15:22-24, 32) There is joy in heaven when a sinner returns, and there is joy on earth as well! (Luke 15:7) It is clear that Jehovah does not condone unrepentant wrongdoing. However, he does not turn his back on wrongdoers. He wants them to return. Jehovah’s feelings toward repentant wrongdoers are expressed at Hosea 14:4: “I will heal their unfaithfulness. I will love them of my own free will, because my anger has turned away.” What a strong incentive for elders to respond to any signs of repentance. And what a strong incentive for those who have left Jehovah to return without delay. w24.08 28 ˚8-9"},"2026-12-31":{"date":"2026-12-31","label":"Thursday, December 31, 2026","scripture":"Show yourselves thankful.","ref":"—Col. 3:15.","comment":"Realistically, some may not always show or express appreciation. On occasion, we may give of our time, energy, or resources but thereafter wonder if the recipient even cared about what we did. If that happens, how can we avoid losing our joy or becoming bitter? Remember, our happiness in giving does not depend on the response. (Acts 20:35) We can choose to enjoy giving even if others do not seem appreciative. How? Focus on imitating Jehovah. He gives good things to people whether they appreciate it or not. (Matt. 5:43-48) Jehovah promises that when we likewise give “without hoping for anything back,” our “reward will be great.” (Luke 6:35) “Anything” might include an expression of appreciation. Whether we receive it or not, Jehovah will repay us for the good we do to help others, for our being ‘cheerful givers.’—Prov. 19: 17; 2 Cor. 9:7. w24.09 29 ˚14-16"}};
function getStorage(key){try{return window.localStorage.getItem(key)}catch(e){return null}}
function setStorage(key,value){try{window.localStorage.setItem(key,value);return true}catch(e){return false}}

function isoDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function prettyDailyDate(d){var days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],months=["January","February","March","April","May","June","July","August","September","October","November","December"];return days[d.getDay()]+", "+months[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear()}
