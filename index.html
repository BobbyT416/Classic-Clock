r, what if a baptized minor unrepentantly persists in a wrong course? In that case, a committee of elders will meet with him along with his Christian parents. w24.08 24 ˚18"},"2026-06-28":{"date":"2026-06-28","label":"Sunday, June 28, 2026","scripture":"There is more happiness in giving than there is in receiving.","ref":"—Acts 20:35.","comment":"We know from experience that we feel good when we receive a gift. Still, we feel even greater happiness when we are the giver. By creating us the way he did, Jehovah allows us to influence our happiness. We can increase our joy by looking for additional opportunities to give. Is that not a wonderful aspect of how we are made? (Ps. 139: 14) The Scriptures assure us that giv-"},"2026-06-29":{"date":"2026-06-29","label":"Monday, June 29, 2026","scripture":"To the extent we have made progress, let us go on walking orderly in this same course.","ref":"—Phil. 3:16.","comment":"After reviewing the qualifications to serve as elders, some ministerial servants might feel that they could never qualify. But remember that neither Jehovah nor his organization expects you to display these qualities perfectly. (1 Pet. 2:21) And it is Jehovah’s powerful spirit that helps you to develop these qualifications. (Phil. 2:13) Is there a particular quality that you would like to improve on? Pray to Jehovah about it. Research the topic, and ask one of the elders for suggestions on how to improve. Reach out! Ask Jehovah to train and mold you to be even more useful in serving him and the congregation. (Isa. 64:8) May Jehovah richly bless your efforts to qualify to serve as an elder. w24.11 25 ˚17-18"},"2026-06-30":{"date":"2026-06-30","label":"Tuesday, June 30, 2026","scripture":"God is not unrighteous so as to forget your work and the love you showed for his name by ministering and continuing to minister to the holy ones.","ref":"—Heb. 6:10.","comment":"None of us should feel that we are entitled to receive Jehovah’s mercy even if we have spent many years in his service. Of course, Jehovah appreciates our record of faithfulness. He gave us his Son as a free gift, not as payment for services rendered. If we were to claim that we have earned mercy or that we are entitled to special consideration, we would, in effect, be saying that Christ died for nothing. (Compare Galatians 2:21.) The apostle Paul knew that he could not earn God’s favor. Why, then, did he work so hard in Jehovah’s service? Not to prove himself deserving, but to show appreciation for Jehovah’s undeserved kindness. (Eph. 3:7) Like Paul, we continue to serve zealously, not to earn Jehovah’s mercy, but to show appreciation for it. w25.01 27 ˚5-6"},"2026-07-01":{"date":"2026-07-01","label":"Wednesday, July 1, 2026","scripture":"I have not seen anyone righteous abandoned.","ref":"—Ps. 37:25.","comment":"Some of Jehovah’s servants are feeling the effects of old age, struggling with poor health, or living with a disability. That may cause them to feel uncertain of their worth in Jehovah’s eyes. They may ask, ‘Am I still useful to Jehovah?’ The writer of Psalm 71 expressed a similar concern. He prayed: “Do not abandon me when my strength fails.” (Ps. 71:9, 18) Nevertheless, the psalmist remained"},"2026-07-02":{"date":"2026-07-02","label":"Thursday, July 2, 2026","scripture":"Concerning the eating of food offered to idols, we know that an idol is nothing in the world.","ref":"—1 Cor. 8:4.","comment":"Immature Christians often struggle when faced with situations that call for reasoning on Bible principles and applying them. If no Bible law exists, some might feel that they can do whatever they want. Others might ask for a rule when no rule is required. For instance, Christians in Corinth apparently asked the apostle Paul for a rule about whether they could eat food that had been offered to an idol. Rather than tell them what to do, Paul acknowledged the role of the conscience and the fact that each person has a “right to choose.” He reasoned on principles that would allow each individual to be at peace with his conscience while not stumbling others. (1 Cor. 8:7-9) Paul was thus helping the Corinthians to grow up spiritually so that they could use their own powers of discernment instead of depending on someone else or simply looking for rules. w24.04 5 ˚14"},"2026-07-03":{"date":"2026-07-03","label":"Friday, July 3, 2026","scripture":"I, Jehovah, am searching the heart . . . to give to each one according to his ways.","ref":"—Jer. 17:10.","comment":"In Jonah’s day, the Ninevites had an opportunity to repent. Further, remember what Jesus said about the “resurrection of judgment.” It will include “those who practiced vile things.” (John 5:29) So it seems that there may be some hope for the people of Sodom and Gomorrah too. It is possible that at least some of those people will be resurrected, and we may have the opportunity to teach them about Jehovah and Jesus Christ. Jehovah has always been the one “searching the heart, examining the innermost thoughts.” When it comes to the future resurrection, he will, as always, “give to each one according to his ways.” Jehovah will be firm when necessary but merciful whenever possible. So we should not assume that a person has no hope of a resurrection unless we know that to be the case! w24.05 5-6 ˚15-16"},"2026-07-04":{"date":"2026-07-04","label":"Saturday, July 4, 2026","scripture":"Do not be afraid. I will help you.","ref":"—Isa. 41:13.","comment":"Throughout the ages, the message from God has strengthened his servants when they had a difficult task to complete. Take, for example, the prophet Jeremiah. He was hesitant when Jehovah gave him the assignment to preach. Jeremiah said: “I do not know how to speak, for I am just a boy.” (Jer. 1:6) How did he overcome his lack of confidence? He drew strength from God’s word. He said: “It became like a burning fire shut up in"},"2026-07-05":{"date":"2026-07-05","label":"Sunday, July 5, 2026","scripture":"Zadok the priest . . . anointed Solomon.","ref":"—1 Ki. 1:39.","comment":"Zadok remained loyal to Jehovah despite High Priest Abiathar’s choice to support David’s son Adonijah, who planned to seize the throne. David never doubted Zadok’s loyalty. When Adonijah’s scheme was revealed, David turned to Zadok, Nathan, and Benaiah to anoint Solomon as king. (1 Ki. 1:32-34) Being with loyal worshippers of Jehovah, such as Nathan and other supporters of King David, must have strengthened and encouraged Zadok. When Solomon became king, he “appointed Zadok the priest in place of Abiathar.” (1 Ki. 2:35) How can you imitate Zadok? If someone close to you chooses to leave Jehovah, make your choice clear. (Josh. 24:15) Jehovah will give you the strength and the courage you need. Rely on him through prayer and by staying close to fellow loyal worshippers. Jehovah treasures your loyalty, and he will reward you for it. —2 Sam. 22:26. w24.07 6-7 ˚16-17"},"2026-07-06":{"date":"2026-07-06","label":"Monday, July 6, 2026","scripture":"Let us not give up in doing what is fine.","ref":"—Gal. 6:9.","comment":"At Psalm 15:2, a friend of God is described as “the one who is walking faultlessly, practicing what is right.” The terms “walking” and “practicing” imply action that is both constant and progressive. But can we really ‘walk faultlessly’? Yes. While no human is perfect, Jehovah will view us as “walking faultlessly” if we do our best to obey him. When we dedicate ourselves to God and get baptized, we are just starting on our journey with God. Note that in Bible times, merely belonging to the nation of Israel would not automatically qualify a person to be a guest of Jehovah. Some called on him but not “in truth and righteousness.” (Isa. 48:1) Sincere Israelites had to learn about Jehovah’s requirements and follow them. Similarly, to enjoy God’s approval today, more is required of us than getting baptized and associating with the Christian congregation. We must keep “practicing what is right.” w24.06 9 ˚4; 10 ˚6"},"2026-07-07":{"date":"2026-07-07","label":"Tuesday, July 7, 2026","scripture":"Become imitators of God.","ref":"—Eph. 5:1.","comment":"What are some ways that Jehovah shows generosity? Consider a few examples. Jehovah gives us material things. We may not always have luxuries, but thanks to Jehovah, most of us have what we need. For example, he makes it possible for us to have food, clothing, and shelter. (Ps. 4:8; Matt. 6:31-33; 1 Tim. 6:6-8) Does Jehovah provide for our physical needs merely out of a sense of obligation?"},"2026-07-08":{"date":"2026-07-08","label":"Wednesday, July 8, 2026","scripture":"The men who minister in a fine manner are acquiring for themselves a fine standing and great freeness of speech in the faith.","ref":"—1 Tim. 3:13.","comment":"A ministerial servant is a baptized brother who is appointed by holy spirit to help the elders care for many practical matters in the congregation. Ministerial servants are first and foremost spiritual men; they love Jehovah and live by his righteous standards. And they feel a deep love for their Christian brothers and sisters. (Matt. 22:37-39) How can a baptized brother reach out to be a ministerial servant? The Bible outlines the qualifications for those who may be appointed as ministerial servants. (1 Tim. 3:8-10, 12) You can reach out for this privilege by studying these Scriptural qualifications and then working hard to meet them. But first, you need to give careful attention to your motives for reaching out. w24.11 15 ˚4-5"},"2026-07-09":{"date":"2026-07-09","label":"Thursday, July 9, 2026","scripture":"You accepted it not as the word of men but, just as it truthfully is, as the word of God.","ref":"—1 Thess. 2:13.","comment":"Some people claim to have read the Bible dozens of times. But do they truly believe in the Bible? Have they applied it or allowed it to affect the course of their life? Sadly, often the answer is no. What a contrast with Jehovah’s people! We strive to demonstrate that it is at work in our life. Still, it is not always easy to read and apply God’s Word. We may struggle to find time to read. Or we may tend to read at a very rapid pace and not absorb much of what we read. Or we may feel overwhelmed by all the improvements we need to make. Whatever your challenge may be, it is not insurmountable. With Jehovah’s help, you can overcome it. May we be determined to become doers of the Word. Without a doubt, the more we read God’s Word and apply it in our life, the happier we will be.—Jas. 1:25. w24.09 7 ˚15-16"},"2026-07-10":{"date":"2026-07-10","label":"Friday, July 10, 2026","scripture":"Keep on asking, and it will be given you.","ref":"—Luke 11:9.","comment":"By means of his holy spirit, Jehovah comforts us when we suffer trauma or loss. If you are coping with a heartbreaking trial, you can pour out your heart to Jehovah in prayer as often and for as long as you want. (Ps. 86:3; 88:1) Ask Jehovah repeatedly for his holy spirit. He will never ignore your requests. Has a distressing ordeal left you weak? Holy spirit can empower you to continue worshipping Jehovah faithfully. (Eph. 3:16) How can you"},"2026-07-11":{"date":"2026-07-11","label":"Saturday, July 11, 2026","scripture":"God loved the world so much.","ref":"—John 3:16.","comment":"Like Jehovah and his Son, we love people. (Prov. 8:31) We feel deep compassion for those who are “without God” and who have “no hope.” (Eph. 2:12) They are drowning in life’s problems, and we have the life vest that they need—the good news of God’s Kingdom. Our love and compassion for such ones motivates us to make every effort to reach them with the good news. That precious message can fill their hearts with hope, help them find the best possible life now, and give them the prospect of “the real life”—everlasting life—in God’s new world. (1 Tim. 6:19) Our love for people also moves us to warn them about the approaching end of this wicked world. (Ezek. 33:7, 8) We want them to know what will happen during the great tribulation—false religion will be removed and the destruction of the entire wicked system will follow at Armageddon.—Rev. 16:14, 16; 17:16, 17; 19:11, 19, 20. w24.05 16-17 ˚8-9"},"2026-07-12":{"date":"2026-07-12","label":"Sunday, July 12, 2026","scripture":"Do not avenge yourselves, beloved, but yield place to the wrath; for it is written: “‘Vengeance is mine; I will repay,’ says Jehovah.”","ref":"—Rom. 12:19.","comment":"When the apostle Paul urged Christians to “yield place to the wrath,” whose wrath was he referring to? According to the context, it is Jehovah’s wrath. We yield place to Jehovah’s wrath by letting him bring about justice in his own time and in his own way. After a brother named John was treated unfairly, he said: “I had to fight the urge to pursue righting the wrong in my own way. Romans 12:19 helped me to wait on Jehovah.” We benefit when we wait on Jehovah to correct a matter. If we do so, we will be spared the burden and frustration of trying to solve the problem ourselves. Jehovah offers to help us. He says, as it were, ‘Leave the injustice to me; I will take care of things.’ If we accept Jehovah’s promise “I will repay,” we can let the matter go, confident that he will handle it in the best possible way. w24.11 6 ˚14-15"},"2026-07-13":{"date":"2026-07-13","label":"Monday, July 13, 2026","scripture":"Give us each day our bread according to our daily needs.","ref":"—Luke 11:3.","comment":"We need to keep material things in their proper place. The apostle Paul highlighted this when writing to Christians living near the end of the Jewish systems of things. He brought up events from Israel’s past, including what happened near Mount Sinai. He warned Christians “not to desire injurious things, as [the Israelites] desired them.” (1 Cor. 10:6, 7, 11) The Israelites let their longing for food turn"},"2026-07-14":{"date":"2026-07-14","label":"Tuesday, July 14, 2026","scripture":"Rejoice with the wife of your youth.","ref":"—Prov. 5:18.","comment":"Jehovah is “the happy God,” and he wants us to be happy too. (1 Tim. 1: 11) He has given us many gifts to help us enjoy life. (Jas. 1:17) One of those gifts is marriage. When a man and a woman get married, they vow to love, respect, and cherish each other. Maintaining a close bond can bring them real joy. Sadly, many married couples in today’s world forget the promises they made on their wedding day. As a result, they are not happy. How does Jehovah expect a husband to treat his wife? Jehovah commands husbands to honor their wife. Honor refers to the way we treat someone whom we respect. A husband who honors his wife will treat her in a kind and loving way.—1 Pet. 3:7. w25.01 8 ˚1-2; 9 ˚4-5"},"2026-07-15":{"date":"2026-07-15","label":"Wednesday, July 15, 2026","scripture":"Jehovah is my helper; I will not be afraid.","ref":"—Heb. 13:6.","comment":"No doubt the apostle Paul’s letter to the Hebrews helped first-century Christians to prepare for the tribulation that they would face. Paul urged his brothers to gain a deeper knowledge and understanding of the Scriptures. Doing so would equip them to identify and reject teachings that would undermine their faith. He encouraged them to strengthen their faith so that they would promptly follow the direction of Jesus and of those taking the lead in the congregation. And he helped Christians to build endurance by having the right view of trials and seeing the trials as an opportunity to be trained by their loving Father. May we too apply this inspired counsel. We will then be able to endure faithfully down to the end. —Heb. 3:14. w24.09 13 ˚17, 19"},"2026-07-16":{"date":"2026-07-16","label":"Thursday, July 16, 2026","scripture":"We have been sanctified through the offering of the body of Jesus Christ once for all time.","ref":"—Heb. 10:10.","comment":"According to the Bible, a ransom is the price paid to bring about atonement and reconciliation. From Jehovah’s standpoint, it provides the basis to restore what was lost. In what way? Remember, Adam and Eve lost their perfect life along with the prospect of living forever. So the ransom would need to be a price of equal value to what was lost. (1 Tim. 2:6) It could be paid only by an adult man who (1) was perfect; (2) had the potential of living forever on earth; and (3) was willing to give up, or to sacrifice, that life for"},"2026-07-17":{"date":"2026-07-17","label":"Friday, July 17, 2026","scripture":"He does not give the spirit sparingly.","ref":"—John 3:34.","comment":"Jehovah loves you and wants you to be part of his family. That is true no matter what obstacles to baptism you are facing. Jesus said to a group of his first-century disciples: “If you have faith the size of a mustard grain, you will say to this mountain, ‘Move from here to there,’ and it will move, and nothing will be impossible for you.” (Matt. 17:20) Those present to hear this had been with Jesus for just a few years, so their faith was still growing. But Jesus assured them that if they developed sufficient faith, Jehovah would help them to move mountainlike obstacles. And Jehovah will help you to do the same! If you recognize obstacles that prevent you from getting baptized, take steps to remove them without delay. Dedicate yourself to Jehovah and get baptized. It is the best decision you could ever make! w25.03 7 ˚18-20"},"2026-07-18":{"date":"2026-07-18","label":"Saturday, July 18, 2026","scripture":"Jehovah is on my side; I will not be afraid.","ref":"—Ps. 118:6.","comment":"We can face trials successfully if we remember that the living God is ready to assist us. We can build our confidence in that fact by considering what he has done in the past. (Isa. 37:17, 33-37) Also, consider reports on our jw.org website that illustrate how Jehovah has supported our brothers and sisters in modern times. Furthermore, recall times when Jehovah has acted in your behalf. Do not worry if you cannot point to some spectacular experience. Why not? The fact is, Jehovah has been involved in your life! He has drawn you into a relationship with him. (John 6:44) Why not ask him to help you to remember moments when he answered your prayers, gave you support at just the right time, or sustained you through a difficult situation? Reflecting on such experiences will strengthen your conviction that Jehovah will continue to act in your behalf. w24.06 21 ˚8"},"2026-07-19":{"date":"2026-07-19","label":"Sunday, July 19, 2026","scripture":"Death spread to all men because they had all sinned.","ref":"—Rom. 5:12.","comment":"We may be determined to let nothing turn us away from Jehovah. Yet, we are imperfect and vulnerable to temptation. (Rom. 7:21-23) Without warning, we could find ourselves in circumstances that make the wrong course seem very appealing. To remain loyal to Jehovah and his Son, we need to follow Jesus’ counsel to keep on guard against the temptation to sin. All of us face temptation to sin. But each one of us has areas of vulner-"},"2026-07-20":{"date":"2026-07-20","label":"Monday, July 20, 2026","scripture":"Kindly forgive and comfort him, so that he may not be overwhelmed by excessive sadness.","ref":"—2 Cor. 2:7.","comment":"Imagine what could happen if the elders refused to allow a truly repentant man back into the congregation or if after his return, the congregation refused to show him love. He could be swallowed up by “excessive sadness.” He could easily feel that his situation was hopeless. He might even give up in his efforts to repair his relationship with God. Even worse, if the other brothers and sisters in the congregation refused to forgive the repentant sinner, they would put their own relationship with Jehovah in jeopardy. Why? Because they would reflect, not Jehovah’s forgiving attitude toward repentant wrongdoers, but Satan’s harsh and merciless attitude. They would, in effect, become tools that the Devil could use to destroy the man spiritually.—2 Cor. 2:10, 11; Eph. 4:27. w24.08 17 ˚7, 10-11"},"2026-07-21":{"date":"2026-07-21","label":"Tuesday, July 21, 2026","scripture":"When he ascended on high . . . , he gave gifts in men.","ref":"—Eph. 4:8.","comment":"Christ Jesus gave the congregation “gifts in men” who serve in another way. Under his direction, the elders in Jerusalem sent out Paul, Barnabas, and others as traveling overseers. (Acts 11:22) Why? For the same reason that ministerial servants and elders were appointed: to build up the congregations. (Acts 15:40, 41) Circuit overseers are constantly on the move. Some travel hundreds of kilometers between congregations. Each week, a circuit overseer delivers several talks, goes on shepherding calls, and conducts a pioneer meeting, an elders’ meeting, and meetings for field service. He prepares talks and organizes circuit assemblies and conventions. He teaches pioneer schools, arranges for a special meeting with the pioneers in the circuit, and handles other—sometimes urgent—matters assigned to him by the branch office. w24.10 21 ˚12-13"},"2026-07-22":{"date":"2026-07-22","label":"Wednesday, July 22, 2026","scripture":"I will forgive their error, and I will no longer remember their sin.","ref":"—Jer. 31:34.","comment":"The prophet Jeremiah quotes Jehovah as saying the words found in today’s text. When referring to these words, the apostle Paul used a similar expression, saying: “I will no longer call their sins to mind.” (Heb. 8: 12) But what does that really mean? In the Bible, the expression “remember” does not always refer to someone recalling something or thinking about it. Rather, it can involve some-"},"2026-07-23":{"date":"2026-07-23","label":"Thursday, July 23, 2026","scripture":"Knowledge of the Most Holy One is understanding.","ref":"—Prov. 9:10.","comment":"True understanding comes from knowing Jehovah’s qualities, his purpose, and what he loves or hates. Ask yourself, ‘Knowing what I do about Jehovah, what decision can I make that will please him?’ (Eph. 5:17) In order to please Jehovah, we must at times disappoint those who are close to us. For example, some wellmeaning parents may insist that their adult daughter marry a man who is financially well-off—or one who can pay them a large dowry—even though he is not spiritually strong. True, they want their daughter to be cared for materially, but who will help her to progress as a spiritual person? How does Jehovah view the matter? We find the answer at Matthew 6:33. There, Christians are urged to keep “seeking first the Kingdom.” Although we honor our parents and respect the people in our community, our main concern is to make Jehovah happy. w25.01 17 ˚9-10"},"2026-07-24":{"date":"2026-07-24","label":"Friday, July 24, 2026","scripture":"The Lord stood near me and infused power into me.","ref":"—2 Tim. 4:17.","comment":"We need Jehovah’s help to keep zealously preaching in the face of opposition today. (Rev. 12:17) Why can you be certain that Jehovah will support you? Consider Jesus’ prayer recorded in John chapter 17. Jesus asked Jehovah to watch over the apostles, and Jehovah answered that request. The book of Acts reports how he helped the apostles to preach zealously despite persecution. In his prayer, Jesus also asked Jehovah to watch over those who would put faith in the apostles’ preaching. That includes you. Jehovah has not stopped answering Jesus’ prayer; He will help you just as He helped the apostles. (John 17:11, 15, 20) Even if it turns out to be more difficult to preach the good news with zeal as the end draws close, we will receive all the support we need.—Luke 21:12-15. w25.03 18 ˚13-14"},"2026-07-25":{"date":"2026-07-25","label":"Saturday, July 25, 2026","scripture":"My servants will shout joyfully.","ref":"—Isa. 65:14.","comment":"God’s people can “shout joyfully” because their heart overflows with appreciation. The upbuilding truths and comforting promises in God’s Word and our solid hope based on Christ’s ransom sacrifice give us a “good condition of the heart.” Talking about these things makes us truly happy! (Ps. 34:8; 133:1-3) The love and the unity among Jehovah’s people are two major characteristics of the spiritual paradise. This “bond of union” gives us an idea of what life will be like in the new world, where Jehovah’s ser-"},"2026-07-26":{"date":"2026-07-26","label":"Sunday, July 26, 2026","scripture":"Keep . . . building one another up.","ref":"—1 Thess. 5:11.","comment":"How can all of us support single Christians who want to get married? One way is by being careful about what we say. (Eph. 4:29) We could ask ourselves: ‘Do I tease those who want to get married? When I see a single brother and a single sister talking, do I assume that they have a romantic interest in each other?’ (1 Tim. 5:13) Additionally, we should never make single Christians feel that they are somehow incomplete because they are not married. How much better to look for opportunities to commend single Christians! What if we think that a certain brother and a certain sister would make a good couple? The Bible tells us to consider the feelings of others. (Rom. 15:2) Many single ones do not want others to introduce them to a potential mate, and we should respect their wishes. (2 Thess. 3:11) Others may appreciate some help, but we should not intervene without being asked.—Prov. 3:27. w24.05 24-25 ˚14-15"},"2026-07-27":{"date":"2026-07-27","label":"Monday, July 27, 2026","scripture":"Their rock is not like our Rock.","ref":"—Deut. 32:31.","comment":"We live in a world where unexpected challenges can disrupt—or even completely change—our lives. How thankful we are that we can turn to Jehovah God for help! When we receive his support, that experience reassures us that “Jehovah is alive!” (Ps. 18:46) However, right after making that declaration, David called God “my Rock.” Why would he liken Jehovah to an inanimate object—a rock? The Bible uses the term “rock” as a word picture to help us grasp qualities that Jehovah possesses. It often appears in passages that praise him as a God who is without equal. The first reference to Jehovah as “the Rock” is found at Deuteronomy 32:4. In prayer, Hannah said that “there is no rock like our God.” (1 Sam. 2:2) Habakkuk called Jehovah “my Rock.” (Hab. 1:12) The writer of Psalm 73 called God “the rock of my heart.” (Ps. 73:26) And even Jehovah referred to himself as a rock.—Isa. 44:8. w24.06 26 ˚1, 3"},"2026-07-28":{"date":"2026-07-28","label":"Tuesday, July 28, 2026","scripture":"Jehoshaphat . . . searched for Jehovah with all his heart.","ref":"—2 Chron. 22:9.","comment":"The kings of Israel who pleased Jehovah worshipped him with a complete heart. Speaking of Josiah, the inspired record says: “There was no king like him prior to him, who returned to Jehovah with all his heart.” (2 Ki. 23: 25) What about Solomon, who in his later years did what was bad? “His heart was not complete.” (1 Ki. 11:4) And regarding Abijam, another unfaithful king, the Bible record states:"},"2026-07-29":{"date":"2026-07-29","label":"Wednesday, July 29, 2026","scripture":"Wipe away all my errors.","ref":"—Ps. 51:9.","comment":"Jehovah uses a word picture to describe how he blots out sins. He declares: “I will blot out your transgressions as with a cloud and your sins as with a thick cloud.” (Isa. 44:22) When Jehovah forgives, it is as if he were using a thick cloud to hide our transgressions so that they disappear from sight altogether. What does this mean for us? When Jehovah forgives our sins, we should not feel that we will bear the stain of such sins for the rest of our life. By means of the blood of Jesus Christ, our debts are completely canceled. Even the record of those debts is no longer discernible. This is what the true forgiveness that comes from Jehovah means for us when we repent of our sins. Jehovah’s mercy also allows us to have a good relationship with him and helps us to avoid being overcome by feelings of guilt. w25.02 10 ˚11-14"},"2026-07-30":{"date":"2026-07-30","label":"Thursday, July 30, 2026","scripture":"God in his kindness is trying to lead you to repentance.","ref":"—Rom. 2:4.","comment":"Elders who serve on committees have a responsibility before Jehovah to keep the congregation clean. (1 Cor. 5:7) They also want wrongdoers to be moved to repentance if possible. To that end, elders maintain a positive, hopeful outlook. Why? Because they want to imitate Jehovah, who is “very tender in affection and merciful.” (Jas. 5:11) Note how the aged apostle John showed such a spirit. He wrote: “My little children, I am writing you these things so that you may not commit a sin. And yet, if anyone does commit a sin, we have a helper with the Father, Jesus Christ, a righteous one.” (1 John 2:1) Sadly, there are times when a Christian refuses to repent. If so, he must be removed from the congregation. w24.08 25 ˚19-20"},"2026-07-31":{"date":"2026-07-31","label":"Friday, July 31, 2026","scripture":"Stand firm in the faith.","ref":"—1 Cor. 16:13.","comment":"You may have the urge to compare what you do with what others can do. Resist that urge! Why? Because Jehovah does not make such comparisons. (Gal. 6:4) For example, Mary gave Jesus a gift of costly perfumed oil. (John 12:3-5) In contrast, the needy widow contributed to the temple two small coins of very little monetary value. (Luke 21:1-4) Yet, Jesus saw both gifts as expressions of faith. His Father, Jehovah, truly values anything you do that is motivated by your devotion to him and love for him, however small it may seem to you. We all have doubts at times. However, God’s reliable Word of truth, the Bible, can"},"2026-08-01":{"date":"2026-08-01","label":"Saturday, August 1, 2026","scripture":"There will be great tribulation such as has not occurred since the world’s beginning until now.","ref":"—Matt. 24:21.","comment":"We pray that as many as possible will respond to the warning message and join us in pure worship now. But what about those who do not heed the warning at this time? It may be Jehovah’s will to save people who have a change of heart when they see the destruction of Babylon the Great. If so, then it is all the more urgent that we keep sounding the warning. What we tell them now may give them something to remember then. (Compare Ezekiel 33:33.) Perhaps they will reflect back on the warning they heard from us and be moved to join us in pure worship before it is too late. Like the jailer in Philippi who had a change of heart only after “a great earthquake occurred,” perhaps some who do not respond now will have a change of heart after the world-shaking destruction of Babylon the Great.—Acts 16:25-34. w24.05 17 ˚9-10"},"2026-08-02":{"date":"2026-08-02","label":"Sunday, August 2, 2026","scripture":"Christ is the end of the Law.","ref":"—Rom. 10:4.","comment":"We learn a valuable lesson from what the apostle Paul wrote to the Hebrew Christians. Some had not continued to grow spiritually; they had actually “gone back to needing milk, not solid [spiritual] food.” (Heb. 5: 12) They had failed to keep up with the truth, which was being progressively revealed through the congregation. (Prov. 4:18) For example, many Jewish believers were still promoting the Mosaic Law even though some 30 years earlier the Law had been done away with on the basis of Christ’s sacrifice. (Titus 1:10) Anyone who has read Paul’s inspired letter to the Hebrews can confirm that this book contains solid spiritual food. It was just what those Christians needed to strengthen their faith in the superiority of the Christian arrangement for worship and to give them the courage to keep preaching.—Heb. 10:1923. w24.04 6 ˚15"},"2026-08-03":{"date":"2026-08-03","label":"Monday, August 3, 2026","scripture":"There is going to be a resurrection of both the righteous and the unrighteous.","ref":"—Acts 24:15.","comment":"Ever since Adam and Eve joined Satan and rebelled against Jehovah God, billions of humans have died. What lies ahead for all those people? A limited number, 144,000 in all, of Christ’s faithful followers will receive a resurrection to immortal life in heaven. (Rev. 14:1) And a vast number of faithful men and women who loved Jehovah will be part of the “resurrection of . . . the righteous,”"},"2026-08-04":{"date":"2026-08-04","label":"Tuesday, August 4, 2026","scripture":"They honor me with their lips, but their heart is far removed from me.","ref":"—Isa. 29:13.","comment":"Someone who wants to be approved by Jehovah must be “speaking the truth in his heart.” (Ps. 15:2) This means more than not lying. Jehovah wants us to be honest through and through. (Heb. 13:18) That is important, “for Jehovah detests a devious person, but his close friendship is with the upright.” (Prov. 3:32) Those who ‘speak the truth in their heart’ do not pretend to be obedient in public while breaking God’s laws in secret. They avoid acting deviously. A devious person may begin to doubt the wisdom of some of Jehovah’s regulations. (Jas. 1:5-8) He may disobey Jehovah on matters that seem to him to be of little importance. Then if there appear to be no consequences for his disobedience, he may be emboldened to violate God’s laws further, and his worship would become hypocritical. (Eccl. 8:11) We, however, want to be honest in all things. w24.06 10 ˚7-8"},"2026-08-05":{"date":"2026-08-05","label":"Wednesday, August 5, 2026","scripture":"Stand firm . . . with the belt of truth fastened around your waist.","ref":"—Eph. 6:14.","comment":"Jehovah’s people love the truth found in God’s Word. We have built our faith on it. (Rom. 10:17) We have come to believe that Jehovah set up the Christian congregation as “a pillar and support of the truth.” (1 Tim. 3:15) Satan would like nothing better than to cause us to lose confidence in the Bible or in the direction we receive from God’s organization. (Eph. 4:14) Soon the Devil will use powerful propaganda to mislead entire nations into taking sides against Jehovah. (Rev. 16:13, 14) We can also expect Satan to intensify his efforts to mislead Jehovah’s people. (Rev. 12:9) Consequently, it is important that we train ourselves to see the difference between truth and falsehood and to be obedient to the truth. (Rom. 6:17; 1 Pet. 1:22) Our survival during the great tribulation will depend on it! w24.07 8 ˚1-3"},"2026-08-06":{"date":"2026-08-06","label":"Thursday, August 6, 2026","scripture":"This commandment that I am commanding you today is not too difficult for you, nor is it beyond your reach.","ref":"—Deut. 30:11.","comment":"When Jehovah organized the Israelites into a nation, he made a covenant, a formal agreement, with them. If they kept his laws, he would protect and bless them. But if they rebelled against him—for example, by choosing to worship other gods—he would withdraw his blessing, and they would suffer. Yet, even then, they could still regain God’s favor. They could “return to Jehovah [their] God and lis-"},"2026-08-07":{"date":"2026-08-07","label":"Friday, August 7, 2026","scripture":"Great persecution arose against the congregation that was in Jerusalem.","ref":"—Acts 8:1.","comment":"Hebrew Christians living in Jerusalem and Judea went through hard times in the years following Jesus’ death. Soon after the Christian congregation was formed, intense persecution arose against it. Then some 20 years later, Christ’s followers faced serious economic hardships, possibly caused by a famine that had previously afflicted the land. (Acts 11:2730) However, about 61 C.E., Christians were experiencing a time of relative peace compared with what was to come. During that period, they received an inspired letter from the apostle Paul—a letter that would prove to be very timely. The letter to the Hebrews was timely because the peace that the Christians were experiencing would not last. Paul provided practical counsel that would help those Christians to endure the tribulation that they would soon face. w24.09 8 ˚1-2"},"2026-08-08":{"date":"2026-08-08","label":"Saturday, August 8, 2026","scripture":"They have become a source of great comfort to me.","ref":"—Col. 4:11.","comment":"When we are suffering, our brothers and sisters are truly a living expression of Jehovah’s love for us. Fellow believers can comfort us by listening empathetically, or they may support us with their presence. They may share a reassuring Bible verse or say a prayer with us. (Rom. 15:4) At times, a brother or a sister may remind us of Jehovah’s thinking and thus help us maintain our balance. Fellow Christians can also give us practical support, such as by providing a meal when we are in distress. To receive support from others, we may need to ask for it. (Prov. 17:17) They may not know how we feel or what we need. (Prov. 14:10) So be willing to share your feelings with mature friends. Let them know what would help you. You might choose to confide in one or two elders with whom you feel at ease. Some sisters have found it comforting to speak with another mature sister. w24.10 10 ˚15-16"},"2026-08-09":{"date":"2026-08-09","label":"Sunday, August 9, 2026","scripture":"Everyone who recognizes the Son and exercises faith in him [will ] have everlasting life.","ref":"—John 6:40.","comment":"Many people watch what they eat and try to exercise regularly in order to stay healthy. Still, they do not expect to live forever. Hoping for that could seem unrealistic and undesirable because of the distress that comes with old age. Nevertheless, Jesus spoke in a positive way about “everlasting life,” as indicated at John 3:16 and 5:24. One day, Jesus mirac-"},"2026-08-10":{"date":"2026-08-10","label":"Monday, August 10, 2026","scripture":"You husbands, . . . assign them honor as to a weaker vessel, the feminine one.","ref":"—1 Pet. 3:7.","comment":"A recent report from the World Health Organization indicates that many husbands physically, verbally, or emotionally abuse their wife. A husband who does this might treat his wife respectfully in front of others but then mistreat her at home. What can cause some husbands to be abusive? They may have been raised by a violent father, so they think that abusive behavior is normal. Others are influenced by the culture around them, which may promote the wrong idea that “a real man” must use force to show his wife who is the boss. Other men were not taught to control their emotions, including their anger. Some men have developed a warped view of women and sex because of regularly viewing pornography. Additionally, reports indicate that the impact of the COVID-19 pandemic has intensified these problems. Of course, none of these factors justify a husband’s abusive behavior. w25.01 8 ˚2-3"},"2026-08-11":{"date":"2026-08-11","label":"Tuesday, August 11, 2026","scripture":"Since Christ suffered in the flesh, you too arm yourselves with the same mental disposition.","ref":"—1 Pet. 4:1.","comment":"“You must love Jehovah your God with your whole heart and with your whole soul and with your whole strength and with your whole mind.” (Luke 10:27) Jesus acknowledged this as the most important command in the Mosaic Law. Notice that our love for Jehovah involves our heart, which includes our desires, feelings, and emotions. It also involves our wholesouled devotion and our strength—including our energy. However, loving Jehovah also involves our mind, which includes the way we think about matters. Of course, we can never fully understand all of Jehovah’s thinking. But we can better understand God’s thinking by studying “the mind of Christ” because Jesus perfectly reflects the thinking of his Father. —1 Cor. 2:16. w25.03 8 ˚1"},"2026-08-12":{"date":"2026-08-12","label":"Wednesday, August 12, 2026","scripture":"By means of him we have the release by ransom through the blood of that one, yes, the forgiveness of our trespasses, according to the riches of his undeserved kindness.","ref":"—Eph. 1:7.","comment":"As a perfect man, Jesus was the equal of the first man, Adam, before he sinned. (1 Cor. 15:45) So by Jesus’ death, he was able to atone for Adam’s sin, that is, to replace what Adam had lost. (Rom. 5:19) Jesus thus became “the last Adam.” There is no need for another perfect person to come and pay for what Adam lost. Jesus died “once for all time.” (Heb. 7:27; 10:12) What, then, is the differ-"},"2026-08-13":{"date":"2026-08-13","label":"Thursday, August 13, 2026","scripture":"God is faithful, and he will not let you be tempted beyond what you can bear, but along with the temptation he will also make the way out so that you may be able to endure it.","ref":"—1 Cor. 10:13.","comment":"Seeing Jehovah as a living Person will allow us to view our trials properly. How so? We begin to see our trials as part of a bigger issue between Jehovah and Satan. The Devil claims that when we suffer hardship, we will abandon Jehovah. (Job 1:10, 11; Prov. 27: 11) But when we deal with our trials successfully, we show our love for Jehovah and prove the Devil a liar. Are you facing government opposition, economic hardship, negative responses to your preaching, or some other trial? If so, remember that your situation gives you an opportunity to make Jehovah’s heart rejoice. Remember, too, that he will never let you be tested beyond your limits. He will give you the strength to endure. w24.06 22 ˚9"},"2026-08-14":{"date":"2026-08-14","label":"Friday, August 14, 2026","scripture":"Each one is tried by being drawn out and enticed by his own desire.","ref":"—Jas. 1:14.","comment":"Do you know in which areas you are most easily tempted? It does us no good to fool ourselves by denying our weaknesses or concluding that we are too strong to fall into wrongdoing. (1 John 1:8) After all, Paul indicates that even those “who have spiritual qualifications” might give in to temptation if they do not keep on guard. (Gal. 6:1) We must be honest with ourselves and acknowledge the areas in which we are not strong. (2 Cor. 13:5) Once we have identified those areas in which we are most susceptible to temptation, what should we do? Strengthen our resistance! To illustrate, in Bible times the most vulnerable part of a city wall was its gates. Therefore, the gates were the most heavily guarded. Similarly, we need to give special attention to any areas in which we know that we are especially weak.—1 Cor. 9:27. w24.07 15 ˚5-7"},"2026-08-15":{"date":"2026-08-15","label":"Saturday, August 15, 2026","scripture":"Go on bearing fruit in every good work and increasing in the accurate knowledge of God.","ref":"—Col. 1:10.","comment":"Good work, as mentioned in today’s text, includes the preaching of the good news. So when we read God’s Word and meditate on it, our faith in Jehovah is strengthened and the importance of sharing the Kingdom message becomes clear. To get the most out of God’s Word, we should avoid rushing through our reading, study, and meditation. Take your time. If you come across a scripture that you"},"2026-08-16":{"date":"2026-08-16","label":"Sunday, August 16, 2026","scripture":"I wrote to you: to determine whether you would give proof of your obedience in all things.","ref":"—2 Cor. 2:9.","comment":"He is “good and ready to forgive,” said David. (Ps. 86:5) Micah wrote: “Who is a God like you, pardoning error and passing over the transgression?” (Mic. 7:18) And Isaiah stated: “Let the wicked man leave his way and the evil man his thoughts; let him return to Jehovah, who will have mercy on him, to our God, for he will forgive in a large way.” (Isa. 55:7) To imitate Jehovah, the congregation in Corinth was told to welcome back a repentant man and assure him of their love. By following that direction, the congregation showed their “obedience in all things.” True, only months had passed since the man was removed, but the discipline had successfully led him to repentance. So there would be no point in delaying his reinstatement into the congregation. w24.08 17-18 ˚12-13"},"2026-08-17":{"date":"2026-08-17","label":"Monday, August 17, 2026","scripture":"One will be taken along and the other abandoned.","ref":"—Matt. 24:40.","comment":"We live in a climactic time! Soon, Jesus will judge every living person. Jesus described the time leading up to this judgment by giving his disciples a prophetic “sign” of his invisible presence and of “the conclusion of the system of things.” (Matt. 24:3) This prophecy is recorded in Matthew chapters 24 and 25 and in the parallel accounts of Mark chapter 13 and Luke chapter 21. Jesus provided helpful warnings by means of three parables. These are the parables of the sheep and the goats, the discreet and the foolish virgins, and the talents. Each parable helps us to understand how a person’s behavior will affect the way he will be judged. w24.09 20 ˚1-2"},"2026-08-18":{"date":"2026-08-18","label":"Tuesday, August 18, 2026","scripture":"Let everything you do be done with love.","ref":"—1 Cor. 16:14.","comment":"Our greatest example, Jesus Christ, was motivated by love—love for his Father and love for people. That love moved him to work hard and perform humble tasks for others. (Matt. 20:28; John 13:5, 14, 15) Brothers, if you are motivated by love, Jehovah will bless you and will help you to reach your spiritual goals, such as qualifying as a ministerial servant. (1 Pet. 5:5) In the world, people who promote themselves are often admired. Not so in Jehovah’s organization. A brother who is motivated by love, as Jesus was, does not crave power, authority over others, or status. If such an ambitious person were to be appointed in the congregation, he would like-"},"2026-08-19":{"date":"2026-08-19","label":"Wednesday, August 19, 2026","scripture":"The holy spirit has appointed you overseers.","ref":"—Acts 20:28.","comment":"Around the world, we need more brothers to serve as “gifts in men.” (Eph. 4:8) If you are a baptized brother, is it “within your power to help”? (Prov. 3:27) Are you willing to qualify as a ministerial servant? Could you reach out to care for the needs of your brothers as an elder? Are you able to adjust your circumstances to apply for the School for Kingdom Evangelizers? That school will equip you to be used even more fully by Jesus. If you feel unqualified, pray to Jehovah. Ask him for the help of his holy spirit to handle successfully any assignment you are given. (Luke 11: 13) The brothers whom Jesus has appointed as “gifts in men” are proof that he has been leading us during these last days. (Matt. 28:20) Are you not grateful that we have a King who is loving, generous, and attentive and who provides qualified brothers to care for our needs? w24.10 23 ˚16-17"},"2026-08-20":{"date":"2026-08-20","label":"Thursday, August 20, 2026","scripture":"The former things will not be called to mind.","ref":"—Isa. 65:17.","comment":"What about all the things that have caused God’s people pain and distress? Eventually, those things “will be forgotten [and] concealed from [God’s] eyes.” (Isa. 65:16) Jehovah will make our troubles go away, and in time the pain of such memories will vanish completely. Even now, it is soothing to our nerves to be at our Christian meetings, where we can relax and put behind us the stresses of this wicked world. We contribute to the calmness of our spiritual environment when we manifest the love, joy, peace, kindness, and mildness that are included in the fruitage of God’s spirit. (Gal. 5:22, 23) What a blessing it is for us to be associated with God’s organization! Those who remain in the spiritual paradise will see the complete fulfillment of God’s promise of “new heavens and a new earth.” w24.04 22 ˚9-10"},"2026-08-21":{"date":"2026-08-21","label":"Friday, August 21, 2026","scripture":"It is a snare for a man to cry out rashly, “Holy!” And only later to give consideration to what he vowed.","ref":"—Prov. 20:25.","comment":"Although courtship can be enjoyable, it is also a serious step that may lead to marriage. On their wedding day, a couple vow before Jehovah to love and respect each other for as long as they both live. Before making any vow, we should consider the matter very carefully. That is certainly true of the marriage vow. Courtship allows a couple to get to know each other and to make a good decision. Some-"},"2026-08-22":{"date":"2026-08-22","label":"Saturday, August 22, 2026","scripture":"Do not become ashamed . . . of the witness about our Lord.","ref":"—2 Tim. 1:8.","comment":"Young Christians may at times lack the confidence to defend their beliefs. They may feel intimidated when the theory of evolution comes up in class. Why? Their teachers may present evolution as an established fact. If you are a parent, how can you help your child to have the confidence to stand firm in his beliefs? Assure him that he does not need to be ashamed because he knows the truth about creation. Why not? The fact is that many scientists also understand that life did not appear spontaneously or by chance. They perceive intelligent and obvious design in the complexity of life. As a result, they do not accept the evolution theory. Your child can fortify his own convictions by reflecting on the reasons that persuaded other brothers and sisters to believe that life was created. w24.12 18 ˚14-15"},"2026-08-23":{"date":"2026-08-23","label":"Sunday, August 23, 2026","scripture":"He became overjoyed in the holy spirit.","ref":"—Luke 10:21.","comment":"Jesus maintained a positive attitude about the preaching work. That helped him to stay enthusiastic about his ministry. For example, late in 30 C.E., Jesus saw that many were ready to respond to his preaching activity, and he likened them to a ripe field ready to be harvested. (John 4: 35) About a year later, he told his disciples: “The harvest is great.” (Matt. 9:37, 38) And later he again emphasized: “The harvest is great . . . Beg the Master of the harvest to send out workers into his harvest.” (Luke 10:2) Jesus never lost sight of the potential for people to respond to the good news, and he rejoiced when they did. Jesus taught his disciples to keep a positive view of their message, which would encourage them to maintain their zeal. w25.03 18-19 ˚15-16"},"2026-08-24":{"date":"2026-08-24","label":"Monday, August 24, 2026","scripture":"My God is my rock of refuge.","ref":"—Ps. 94:22.","comment":"Jehovah is a refuge. Just as a huge rock can be a person’s hiding place from a threatening storm, Jehovah safeguards us when we face situations that threaten our well-being. He keeps us safe and prevents us from suffering lasting harm. And he promises even more: He will eventually eliminate whatever threatens our peace and security. (Ezek. 34:25, 26) One way we make Jehovah our rocklike Refuge is by praying to him. When we pray, Jehovah gives us “the peace of God” that safeguards our heart and mind. (Phil. 4:6, 7) Jehovah is always there"},"2026-08-25":{"date":"2026-08-25","label":"Tuesday, August 25, 2026","scripture":"Safeguard your heart, for out of it are the sources of life.","ref":"—Prov. 4:23.","comment":"Unwholesome entertainment can divide our heart. So can bad association and materialistic thinking. If we detect that something is beginning to weaken our love for Jehovah, let us take swift action to remove it. (Matt. 5:29, 30) We must not let our heart become divided. We could fool ourselves into thinking that by increasing our spiritual activities, we need not reject bad influences. To illustrate, imagine yourself outside on a brutally cold and windy day. On arriving home, you turn on the heat. How much good would that do you if you left the door open? The cold air would quickly fill your house. The point? We need to do more than just take in spiritual food that warms our relationship with Jehovah. We must also close the door on unwholesome influences, so that this world’s cold “air,” or ungodly attitude, does not enter our heart and divide it.—Eph. 2:2. w24.07 21 ˚6-7"},"2026-08-26":{"date":"2026-08-26","label":"Wednesday, August 26, 2026","scripture":"Continue to love your enemies and to pray for those who persecute you.","ref":"—Matt. 5:44.","comment":"We can only begin to imagine the pain Jesus felt as well as the indignity and the injustice that he endured. Yet, he was not conquered by the injustice he suffered. Instead of cursing the soldiers who had nailed him to the stake, he prayed: “Father, forgive them, for they do not know what they are doing.” (Luke 23:34) When we pray for those who mistreat us, it can lessen our feelings of resentment and anger and even change the way we view those who offend us. There is no telling what injustices we may yet face before this system ends. Whatever comes our way, let us never stop praying to Jehovah for help. Also, may we imitate the way Jesus responded to mistreatment and continue to apply Bible principles. If we do, we can be sure of inheriting a blessing from Jehovah.—1 Pet. 3:8, 9. w24.11 6 ˚16; 7 ˚17, 19"},"2026-08-27":{"date":"2026-08-27","label":"Thursday, August 27, 2026","scripture":"You are not a God who takes pleasure in wickedness; no one bad may remain with you.","ref":"—Ps. 5:4.","comment":"Jehovah is not a permissive God; he does not condone sin. (Ps. 5:4-6) He requires that we respect his righteous standards, which he has set forth for us in his Word. Of course, Jehovah does not expect perfection from imperfect people. (Ps. 130:3, 4) At the same time, he does not tolerate ‘ungodly men who turn his undeserved kindness into an excuse for brazen conduct.’ (Jude 4) Indeed, the Bible"},"2026-08-28":{"date":"2026-08-28","label":"Friday, August 28, 2026","scripture":"You open your hand and satisfy the desire of every living thing.","ref":"—Ps. 145:16.","comment":"Like Jehovah, we too can give materially out of love. For example, are you acquainted with a fellow believer who is in need of food or clothing? Jehovah can use you to give him something to help fill that need. Jehovah’s people are especially known for showing generosity when disaster strikes. For instance, during the COVID-19 pandemic, brothers and sisters shared food, clothing, and other supplies with ones who were in need. Many also made generous contributions to the worldwide work. That helped to fund relief efforts around the globe. They took to heart the words of Hebrews 13:16: “Do not forget to do good and to share what you have with others, for God is well-pleased with such sacrifices.” w24.09 27 ˚6-7"},"2026-08-29":{"date":"2026-08-29","label":"Saturday, August 29, 2026","scripture":"Make sure of the more important things.","ref":"—Phil. 1:10.","comment":"Consider this scenario. You are looking for a job to support your family. Two jobs are available. You review all the facts, taking note of the type of work, the schedule, the travel time, and so on. In both cases, the work itself is Scripturally acceptable. Perhaps you favor one option because you prefer the type of work or because the salary is higher. There are other factors, though, to consider before making a decision. For example, would either job conflict with your congregation meeting schedule? Would either job cut into the time you need to care for your family’s emotional and spiritual needs? Asking such questions will help you to put “the more important things”—your worship and your family’s needs—ahead of material advantages. Then you can reach a decision that Jehovah will bless. w25.01 17 ˚11-13"},"2026-08-30":{"date":"2026-08-30","label":"Sunday, August 30, 2026","scripture":"Jehovah is close to the brokenhearted.","ref":"—Ps. 34:18.","comment":"Even if others have mistreated you, you can be certain that Jehovah loves you and values you. If you feel “crushed in spirit,” remember that Jehovah saw good things in your heart and personally drew you to him. (John 6:44) He is always ready to help you because you are precious to him. We can learn about Jehovah’s feelings by considering Jesus’ example. During his earthly ministry, Jesus took notice of those who were looked down on by others, and he treated"},"2026-08-31":{"date":"2026-08-31","label":"Monday, August 31, 2026","scripture":"Do collect my tears in your skin bottle.","ref":"—Ps. 56:8.","comment":"During his life, David had to endure several troubling situations that made him shed tears. He faced hostility from others and even betrayal by those he trusted. (1 Sam. 19:10, 11; 2 Sam. 15:10-14, 30) At one point, he wrote: “I have grown weary with my sighing; all night long I soak my bed with tears; I flood my couch with weeping.” (Ps. 6:6) Despite the adversities that David faced, he was convinced that Jehovah loved him. He wrote: “Jehovah will hear the sound of my weeping.” (Ps. 6:8) The words of our text paint a touching portrait of Jehovah’s tender care. David felt as if Jehovah were collecting his tears in a bottle or recording them in a book. David was sure that Jehovah noticed and remembered his pain. David was convinced that his loving heavenly Father was aware not only of what he had been through but also of how it had affected him. w24.12 22 ˚11-12"},"2026-09-01":{"date":"2026-09-01","label":"Tuesday, September 1, 2026","scripture":"Keep testing whether you are in the faith.","ref":"—2 Cor. 13:5.","comment":"We must exert ourselves not only to reach maturity but also to maintain it. This requires that we avoid overconfidence. (1 Cor. 10:12) We should “keep testing” ourselves to make sure that we are continuing to make progress. In his letter to the Colossians, the apostle Paul again highlights the need to remain mature. Even though they had become full-grown Christians, Paul warned them against being ensnared by worldly thinking. (Col. 2: 6-10) And Epaphras, who evidently knew those in the congregation well, prayed constantly that they might “finally stand complete,” or mature. (Col. 4:12) The point? Both Paul and Epaphras understood that maintaining maturity requires personal effort and God’s support. They wanted the Colossians to remain mature, or fullgrown, Christians despite any challenges they were facing. w24.04 6-7 ˚16-17"},"2026-09-02":{"date":"2026-09-02","label":"Wednesday, September 2, 2026","scripture":"Jehovah is with us. Do not fear them.","ref":"—Num. 14:9.","comment":"When we have cultivated proper fear of Jehovah, we love him so much that we would never do anything to displease him. We are eager to learn the difference between right and wrong, between truth and falsehood, so that we can gain Jehovah’s approval. (Prov. 2:3-6; Heb. 5:14) If we were to fear humans more than we fear God, we could be led away from the truth. Consider the example of the 12 chieftains who spied out the land that Je-"},"2026-09-03":{"date":"2026-09-03","label":"Thursday, September 3, 2026","scripture":"Will the Judge of all the earth not do what is right?","ref":"—Gen. 18:25.","comment":"Do we have good reason for confidence regarding all of Jehovah’s judgments, both favorable and unfavorable? Yes! As Abraham understood so well, Jehovah is the perfect, all-wise, merciful “Judge of all the earth.” He has trained his Son and delegated all judging to him. (John 5:22) Both Father and Son can read what lies in each human heart. (Matt. 9:4) In every case, they will do “what is right”! Let us be determined to trust that Jehovah knows best. We recognize that we are not qualified to judge—but he is! (Isa. 55:8, 9) So we confidently leave all the judging to him and his Son, the King who perfectly reflects his Father’s justice and mercy.—Isa. 11:3, 4. w24.05 7 ˚18-19"},"2026-09-04":{"date":"2026-09-04","label":"Friday, September 4, 2026","scripture":"Jehovah detests a devious person, but His close friendship is with the upright.","ref":"—Prov. 3:32.","comment":"We can learn about the importance of having a sincere heart from Jesus’ first meeting with Nathanael. When Philip brought his friend Nathanael to meet Jesus, something remarkable happened. Although Jesus had never met Nathanael, Jesus said: “See, truly an Israelite in whom there is no deceit.” (John 1:47) Jesus saw in Nathanael an extraordinary sincerity. Like us, Nathanael was imperfect. But there was nothing artificial or insincere about him. Jesus admired that and commended Nathanael for it. Most of the requirements for pleasing Jehovah listed in Psalm 15 are related to how we treat others. Psalm 15:3 states that a guest in Jehovah’s tent “does not slander with his tongue, he does nothing bad to his neighbor, and he does not defame his friends.” Misusing our speech in such ways could cause serious harm to others.—Jas. 1: 26. w24.06 10 ˚7, 9; 11 ˚10"},"2026-09-05":{"date":"2026-09-05","label":"Saturday, September 5, 2026","scripture":"Lord, even the demons are made subject to us by the use of your name.","ref":"—Luke 10:17.","comment":"If you prepare well for the ministry, you are likely to feel more comfortable when speaking with others. Jesus helped his disciples to prepare before he sent them out into the ministry. (Luke 10:1-11) Because they put into practice what Jesus had taught them, the disciples felt a deep sense of joy in what they were able to accomplish. How might we prepare for the minis-"},"2026-09-06":{"date":"2026-09-06","label":"Sunday, September 6, 2026","scripture":"You are worthy, Jehovah our God, to receive the glory and the honor and the power, because you created all things.","ref":"—Rev. 4:11.","comment":"The most important reason why we preach the good news is that we love Jehovah God and his holy name. We view our ministry as a way to praise the God we love. We wholeheartedly agree that Jehovah God is worthy to receive glory, honor, and power from his loyal worshippers. We give him glory and honor when we share with others the convincing evidence that he “created all things” and that we owe him our very existence. We give him power—our power—when we use our time, energy, and resources to share in the ministry as fully as our circumstances allow. (Matt. 6:33; Luke 13:24; Col. 3: 23) Put simply, we love to speak about the God we love. We also feel compelled to tell others about his name and what it stands for. w24.05 17 ˚11"},"2026-09-07":{"date":"2026-09-07","label":"Monday, September 7, 2026","scripture":"He becomes the rewarder of those earnestly seeking him.","ref":"—Heb. 11:6.","comment":"Jehovah gives us peace and contentment now and will give us everlasting life in the future. We can place our hope in Jehovah, convinced that he has both the desire and the power to reward us. And that conviction moves us to stay busy in our worship, just as faithful servants of God in the past were moved to do. This proved true of Timothy in the first century. (Heb. 6: 10-12) Timothy put his hope in the living God. (1 Tim. 4:10) Therefore, he had good reason to work hard and exert himself. In what ways? The apostle Paul encouraged him to make progress as a teacher and a public speaker. Timothy was also to set a good example for fellow believers, both young and old. And he was assigned some difficult tasks, which included giving firm but loving counsel to those who needed it. (1 Tim. 4:11-16; 2 Tim. 4: 1-5) Timothy could be sure that Jehovah would reward him.—Rom. 2:6, 7. w24.06 22-23 ˚10-11"},"2026-09-08":{"date":"2026-09-08","label":"Tuesday, September 8, 2026","scripture":"Jehovah kept warning Israel and Judah through all his prophets.","ref":"—2 Ki. 17:13.","comment":"Jehovah often used his prophets to warn and correct his people. For example, God said through Jeremiah: “Return, O renegade Israel . . . I will not look down angrily on you, for I am loyal . . . I will not stay resentfu forever. Only acknowledge your guilt, for you have rebelled against Jehovah.” (Jer. 3:12, 13) By means of Joel, Jehovah said: “Return to me with"},"2026-09-09":{"date":"2026-09-09","label":"Wednesday, September 9, 2026","scripture":"All Scripture is inspired of God and beneficial.","ref":"—2 Tim. 3:16.","comment":"All of God’s people receive the spiritual nourishment, direction, and protection they need. An example of Jehovah’s impartiality is that he makes the Bible accessible to people around the globe today. The Holy Scriptures were originally written in three languages: Hebrew, Aramaic, and Greek. Do those who can read the original Bible languages have a closer relationship with Jehovah than those who cannot? No, they do not. (Matt. 11: 25) Jehovah’s approval of us is not dependent on our secular education or on our ability with languages. Rather than offer his wisdom only to the highly educated, Jehovah makes it accessible to people around the earth, whether they are highly educated or not. His inspired Word, the Bible, has been translated into thoul sands of languages; thus, people the world over can benefit from its teachings and learn how they can become his friends.—2 Tim. 3:16, 17. w24.06 6-7 ˚13-15"},"2026-09-10":{"date":"2026-09-10","label":"Thursday, September 10, 2026","scripture":"The desolating of [Jerusalem] has drawn near.","ref":"—Luke 21:20.","comment":"The destruction of the Jewish system of things, which Jesus had foretold, was approaching. Christians needed to use the time remaining to prepare themselves by building up such qualities as faith and endurance. (Heb. 10: 25; 12:1, 2) We are about to face a tribulation far greater than the one experienced by the Hebrew Christians. (Matt. 24:21; Rev. 16:14, 16) Consider some of the practical counsel that Jehovah provided for those Christians that can benefit us too. The apostle Paul encouraged his fellow believers to dig deeper into God’s Word. (Heb. 5:14–6:1) Using the Hebrew Scriptures, Paul reasoned with his brothers on the superiority of the Christian way of worship over Judaism. Paul knew that increased knowledge and a deeper understanding of the truth would equip those Christians to identify and reject false reasonings so that they would not be led astray. w24.09 8-9 ˚2-3; 10 ˚6"},"2026-09-11":{"date":"2026-09-11","label":"Friday, September 11, 2026","scripture":"For a fact the Lord was raised up.","ref":"—Luke 24:34.","comment":"Jesus’ disciples needed encouragement. Why? Some had left homes, families, and businesses to follow Jesus full-time. (Matt. 19:27) Others were treated as social outcasts because they had become his disciples. (John 9:22) They made these sacrifices because they believed that Jesus was the promised Messiah. (Matt. 16:16) But when Jesus was executed, their hopes were dashed and they"},"2026-09-12":{"date":"2026-09-12","label":"Saturday, September 12, 2026","scripture":"[Be] always ready to make a defense before everyone who demands of you a reason for the hope you have.","ref":"—1 Pet. 3:15.","comment":"Parents, prepare your child to defend his belief in a Creator. You might find it useful to review together articles on jw.org in the series “Young People Ask—Creation or Evolution?” Then discuss the line of reasoning that your child feels is most persuasive for helping others understand the truth about the Creator. Encourage him to use simple logic and reasoning if some are open to a pleasant discussion. For example, a schoolmate might say: “I believe only what I can see, and I have never seen God.” A young Christian could respond: “Imagine that you are walking through a forest far from any human activity and you come upon a functioning well. What would you conclude? If the presence of a well gives clear evidence of intelligent life having made it, how much more so does the existence of the universe!” w24.12 18 ˚16"},"2026-09-13":{"date":"2026-09-13","label":"Sunday, September 13, 2026","scripture":"Is not wisdom found among the aged, and does not understanding come with a long life?","ref":"—Job 12:12.","comment":"All of us need guidance in making life’s important decisions. We can obtain much of that guidance from elders and other mature Christians. If they are much older than we are, we should not automatically dismiss their advice as outdated. Jehovah wants us to learn from older ones. They have had more time than we have had to acquire experience, understanding, and wisdom. In Bible times, Jehovah used faithful older ones to encourage and guide his people. Consider, for example, Moses, David, and the apostle John. They lived at different times, and their circumstances differed greatly. As they neared the end of their life, they gave wise advice to younger ones. Each of these faithful older men emphasized the value of being obedient to God. Whether we are young or old, we can benefit by reviewing their counsel.—Rom. 15:4; 2 Tim. 3:16. w24.11 8 ˚1-2"},"2026-09-14":{"date":"2026-09-14","label":"Monday, September 14, 2026","scripture":"Unless you eat the flesh of the Son of man and drink his blood, you have no life in yourselves.","ref":"—John 6:53.","comment":"Back in Noah’s day, God prohibited humans from consuming blood. (Gen. 9:3, 4) Jehovah repeated that restriction in his Law to Israel. Anyone eating blood was to “be put to death.” (Lev. 7:27, ftn.) Jesus upheld that Law. (Matt. 5:17-19) So it is unthinkable that he would urge a crowd of Jews to consume his actual flesh or drink the blood in his veins. Jesus"},"2026-09-15":{"date":"2026-09-15","label":"Tuesday, September 15, 2026","scripture":"Present your bodies as a living sacrifice, holy and acceptable to God, a sacred service with your power of reason.","ref":"—Rom. 12:1.","comment":"Christian husbands need to guard against adopting an improper view of women. Why? One reason is that a person’s thoughts often lead to actions. The apostle Paul warned anointed Christians in Rome to “stop being molded by this system of things.” (Rom. 12:1, 2) When Paul wrote to the Romans, the congregation had evidently been in existence for some time. Yet, Paul’s words imply that some in the congregation were still being influenced by the customs and thinking of the world. That is why he exhorted them to change their thinking and behavior. That counsel certainly applies to Christian husbands today. Sadly, some of them have been influenced by the thinking of the world and have even abused their wife. w25.01 9 ˚4"},"2026-09-16":{"date":"2026-09-16","label":"Wednesday, September 16, 2026","scripture":"Shepherd the flock of God under your care, serving as overseers.","ref":"—1 Pet. 5:2.","comment":"Elders today are busy men. They are evangelizers. (2 Tim. 4:5) They take a zealous lead in the field ministry, organize the preaching work in the local territory, and train us to preach and teach effectively. They also serve as merciful, impartial judges. When a Christian commits a serious sin, elders strive to help him repair his friendship with Jehovah. At the same time, they are careful to keep the congregation clean. (1 Cor. 5:12, 13; Gal. 6:1) Primarily, elders are known as shepherds. (1 Pet. 5:1-3) They deliver well-prepared Scriptural talks, endeavor to get to know everyone in the congregation, and make shepherding calls. Some elders also assist with Kingdom Hall construction and maintenance, convention organization, and the work of Hospital Liaison Committees and Patient Visitation Groups, in addition to other assignments. Elders work hard for us! w24.10 20 ˚9"},"2026-09-17":{"date":"2026-09-17","label":"Thursday, September 17, 2026","scripture":"Just as in Adam all are dying, so also in the Christ all will be made alive.","ref":"—1 Cor. 15:22.","comment":"In the Bible, the word “redemption” refers to the releasing, or acquittal, that results because of the payment of the ransom. The apostle Peter expressed it this way: “You know that it was not with corruptible things, with silver or gold, that you were set free [lit., “you were ransomed; you were redeemed”] from your futile way of"},"2026-09-18":{"date":"2026-09-18","label":"Friday, September 18, 2026","scripture":"Happy is the man who is always on guard.","ref":"—Prov. 28:14.","comment":"How can we guard ourselves? Consider what we can learn from the young man discussed in Proverbs chapter 7. He committed sexual immorality with an immoral woman. Verse 22 tells us that the young man went after her “suddenly.” But as the preceding verses show, he had taken several steps before this that gradually led him to sin. What led up to his sin? First, in the evening, he “passed along the street near [the immoral woman’s] corner.” Then, he marched toward her house. (Prov. 7:8, 9) Next, when he saw the woman, he did not turn away. Instead, he accepted her kiss and listened as she spoke of the communion sacrifices she had offered, perhaps in an attempt to make him think that she was not a bad person. (Prov. 7:13, 14, 21) Had the young man avoided the dangers that led up to the sin, he would have guarded himself from the temptations and from the sin. w24.07 16 ˚8-9; 19 ˚19"},"2026-09-19":{"date":"2026-09-19","label":"Saturday, September 19, 2026","scripture":"Kindly forgive and comfort him.","ref":"—2 Cor. 2:7.","comment":"Jehovah does not tolerate serious wrongdoing among his people. He does not take the view that wrongdoers who are unrepentant should be “mercifully” allowed to continue associating with his faithful worshippers. Jehovah is merciful, but he is not permissive; nor does he lower his standards. (Jude 4) Indeed, to do so would not be merciful at all because it would endanger all in the congregation. (Prov. 13:20; 1 Cor. 15:33) Still, we learn that Jehovah does not want anyone to be destroyed. He wants to save people whenever possible. He shows mercy to people who have a change of heart and want to repair their relationship with him. (Ezek. 33: 11; 2 Pet. 3:9) Thus, when the man in Corinth repented and turned away from his sinful course, Jehovah used the apostle Paul to explain to the congregation that the man should be forgiven and welcomed back. w24.08 17 ˚7; 18-19 ˚14-15"},"2026-09-20":{"date":"2026-09-20","label":"Sunday, September 20, 2026","scripture":"To the extent that you did it to one of the least of these my brothers, you did it to me.","ref":"—Matt. 25:40.","comment":"In the parable of the sheep and the goats, Jesus described the judgment of people who have the opportunity to support his anointed brothers. (Matt. 25:31-46) During the “great tribulation,” he will render this judgment right before Armageddon. (Matt. 24:21) Just as a shepherd separates the sheep from the goats, Jesus will separate those who loyally"},"2026-09-21":{"date":"2026-09-21","label":"Monday, September 21, 2026","scripture":"Make sure of all things.","ref":"—1 Thess. 5:21.","comment":"We can make sure that what we believe is true by comparing it with what the Bible says. For example, consider the case of the young person who wonders whether he has any value in God’s eyes. Should he simply accept that thought as true? No, he should “make sure of all things” by getting Jehovah’s thoughts on the matter. As we read God’s Word, we “hear” Jehovah speaking to us. But to get his thoughts on a specific question requires effort on our part. We need to focus our Bible reading on the topic that concerns us. We can do research on that subject, using the extensive study tools that Jehovah’s organization provides. (Prov. 2:3-6) We can pray that Jehovah will guide our research and help us to find his thoughts on our question. Then we can look for Bible principles and practical information that apply to our situation. w24.10 25 ˚4-5"},"2026-09-22":{"date":"2026-09-22","label":"Tuesday, September 22, 2026","scripture":"[Love] does not look for its own interests.","ref":"—1 Cor. 13:5.","comment":"Jehovah will not bless the efforts of anyone who is driven by pride or selfish ambition. (1 Cor. 10:24, 33; 13:4) At times, even Jesus’ closest companions reached out for privileges for the wrong reason. Consider an event involving two of Jesus’ apostles—James and John. They asked Jesus to give them special prominence in his Kingdom. Jesus did not commend them for their ambition. Instead, he explained to all 12 apostles: “Whoever wants to become great among you must be your minister, and whoever wants to be first among you must be the slave of all.” (Mark 10:35-37, 43, 44) Brothers who reach out with the proper motive—that is, to serve others—will be a blessing to the congregation.—1 Thess. 2:8. w24.11 15-16 ˚7-8"},"2026-09-23":{"date":"2026-09-23","label":"Wednesday, September 23, 2026","scripture":"There is accomplishment through many advisers.","ref":"—Prov. 15:22.","comment":"When making decisions, love will motivate us to seek the advantage of “the other person” and to be modest. (1 Cor. 10:23, 24, 32; 1 Tim. 2:9, 10) We will then make a decision that reflects our love and respect for others. If you are making a major decision, think about what it would take to implement it. Jesus taught us to “calculate the expense.” (Luke 14:28) So consider the amount of time, resources, and effort that you would need to invest to make the decision work. In some cases, you might consult your family to determine what"},"2026-09-24":{"date":"2026-09-24","label":"Thursday, September 24, 2026","scripture":"Exult and be joyful.","ref":"—Isa. 65:18.","comment":"Isaiah reveals why we have every reason to “exult and be joyful” in the spiritual paradise. This environment is a creation of Jehovah. (Isa. 65:18, 19) No wonder he is using us to direct people away from the spiritually parched organizations of this old world and into our beautiful spiritual environment! We are excited about the blessings we enjoy because of being in the truth, and we are moved to tell others about them. (Jer. 31:12) We are also grateful for and excited about the hope we have as residents of the spiritual paradise. The Bible promises that we will “build houses and live in them [and] plant vineyards and eat their fruitage.” We will “not toil for nothing” because we will be “blessed by Jehovah.” He promises us a secure, satisfying life with a real purpose. He knows each one’s needs and “[will] satisfy the desire of every living thing.”—Isa. 65:20-24; Ps. 145: 16. w24.04 22-23 ˚11-12"},"2026-09-25":{"date":"2026-09-25","label":"Friday, September 25, 2026","scripture":"My strong rock, my refuge, is God.","ref":"—Ps. 62:7.","comment":"We make Jehovah our Rock when we rely fully on him. We trust that by obeying him even during difficult times, we will benefit. (Isa. 48:17, 18) As we experience his support, our confidence in him will grow. We will then be better prepared to face trials that only Jehovah can get us through. Similar to a massive rock, Jehovah is firm and stable. He is consistent in his personality and unshakable in his purpose. (Mal. 3:6) When faced with the rebellion in Eden, Jehovah did not waver. As the apostle Paul wrote, Jehovah “cannot deny himself.” (2 Tim. 2:13) This means that no matter what happens or what others do, Jehovah will never deviate from his qualities, his purpose, or his standards. With confidence in our stable God, we can look to him for salvation and for help to cope during turbulent times. —Ps. 62:6, 7. w24.06 27-28 ˚7-8"},"2026-09-26":{"date":"2026-09-26","label":"Saturday, September 26, 2026","scripture":"The secret person of the heart . . . is of great value.","ref":"—1 Pet. 3:4.","comment":"If you are in a courtship, what will help you decide whether to get married or not? Get to know each other well. You likely learned some things about the other person before you began dating. But now you have the opportunity to get to know “the secret person of the heart.” This involves learning more about your prospective mate’s spirituality, personality, and thinking. Over time, you should be able to answer such questions as: ‘Will this person be a good marriage"},"2026-09-27":{"date":"2026-09-27","label":"Sunday, September 27, 2026","scripture":"I have sinned against Jehovah.","ref":"—2 Sam. 12:13.","comment":"King David erred seriously. But when the prophet Nathan confronted him about his sin, David humbly repented. (Ps. 51:3, 4, 17, superscription) King Hezekiah too sinned against Jehovah. (2 Chron. 32:25) But like David, Hezekiah humbly repented. (2 Chron. 32:26) In the final analysis, Jehovah viewed him as a faithful king who “kept doing what was right.” (2 Ki. 18:3) What do we learn? We need to repent of our sins and do all we can to avoi
